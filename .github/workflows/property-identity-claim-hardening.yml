name: Property Identity Claim Hardening

on:
  push:
    branches: [feature/property-identity-duplicate-prevention]
    paths:
      - '.github/scripts/property_identity_claim_hardening.py'
      - '.github/workflows/property-identity-claim-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install dependencies
        working-directory: backend-api-runtime
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        working-directory: backend-api-runtime
        run: |
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          printf 'APP_KEY=base64:%s\n' "$key" > .env
      - name: Apply claim hardening
        run: python3 .github/scripts/property_identity_claim_hardening.py
      - name: Validate PHP syntax
        working-directory: backend-api-runtime
        run: |
          php -l app/Services/PropertyIdentityService.php
          php -l tests/Feature/PropertyIdentityV2Test.php
      - name: Run targeted regression
        working-directory: backend-api-runtime
        run: php artisan test tests/Feature/PropertyIdentityV2Test.php --display-warnings --fail-on-warning --fail-on-risky
      - name: Verify patch
        run: git diff --check
      - name: Commit hardening and remove one-shot assets
        run: |
          rm .github/scripts/property_identity_claim_hardening.py
          rm .github/workflows/property-identity-claim-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden Property Identity representation claim race'
          git push origin HEAD:feature/property-identity-duplicate-prevention
