name: Android 36 upgrade recheck for the original signed UAT1820
'on':
  push:
    branches:
    - work/map-search-ux-1820-20261117
    paths:
    - .github/workflows/map-search-ux-1820-recheck.yml
    - scripts/recheck_map_search_ux_1820.py
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    name: Upgrade 1819 with the pinned original 1820 APK on Android 36
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    if: ${{ github.event.repository.private }}
    env:
      AQER_MAP_SEARCH_UX_UPGRADE: 'true'
      UPGRADE_SOURCE_SHA: 8cdcc2b6de2146a0eca8390c7db82ae511c5113e
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 8cdcc2b6de2146a0eca8390c7db82ae511c5113e
        fetch-depth: 0
        persist-credentials: false
        path: product
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 2
        persist-credentials: false
        path: harness
    - name: Download the immutable verified 1819 baseline artifact
      uses: actions/download-artifact@v4
      with:
        artifact-ids: '14362467229'
        run-id: '44156549567'
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        merge-multiple: true
        path: product/map-search-ux-input/baseline
    - name: Download the original immutable 1820 APK without rebuilding
      uses: actions/download-artifact@v4
      with:
        artifact-ids: '14372604952'
        run-id: '44183138283'
        repository: ${{ github.repository }}
        github-token: ${{ github.token }}
        merge-multiple: true
        path: product/map-search-ux-input/candidate
    - name: Reject unexpected artifact files before starting Android
      run: |
        python3 -B - <<'PYFILES'
        from pathlib import Path
        expected = {
            'baseline': {'AQER-UAT-1819-Clean.apk', 'APK_VERIFICATION.json'},
            'candidate': {'AQER-UAT-1820-Map-Search.apk', 'APK_VERIFICATION.json'},
        }
        for name, filenames in expected.items():
            root = Path('map-search-ux-input') / name
            entries = list(root.iterdir())
            if (root.is_symlink() or {path.name for path in entries} != filenames or
                any(path.is_symlink() or not path.is_file() for path in entries)):
                raise RuntimeError('only_verified_1819_1820_apk_and_public_receipt_allowed')
        print('AQER_MAP_SEARCH_UX_ARTIFACT_CONTENTS_VERIFIED')
        PYFILES
      working-directory: product
    - name: Reclaim unused SDK space on the disposable runner
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-36 build-tools;36.0.0
    - name: Boot an empty disposable map UX API36 emulator
      run: |
        test -c /dev/kvm
        sdkmanager --install 'emulator' 'system-images;android-36;google_apis;x86_64'
        export ANDROID_USER_HOME="$RUNNER_TEMP/map-search-ux-android"
        export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
        export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
        mkdir -p "$ANDROID_AVD_HOME"
        avdmanager create avd --force --name aqer-map-search-ux-upgrade --device pixel --path "$ANDROID_AVD_HOME/aqer-map-search-ux-upgrade.avd" --package 'system-images;android-36;google_apis;x86_64'
        python3 - "$ANDROID_AVD_HOME/aqer-map-search-ux-upgrade.avd/config.ini" <<'PYCONF'
        from pathlib import Path
        import sys
        path = Path(sys.argv[1])
        values = {'hw.lcd.width': '540', 'hw.lcd.height': '960', 'hw.lcd.density': '210',
                  'showDeviceFrame': 'no', 'hw.camera.back': 'none', 'hw.camera.front': 'none',
                  'disk.dataPartition.size': '2048M'}
        lines = [line for line in path.read_text().splitlines() if line.split('=', 1)[0].strip() not in values]
        path.write_text('\n'.join(lines + [key + '=' + value for key, value in values.items()]) + '\n')
        PYCONF
        export QT_QPA_PLATFORM=offscreen
        printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
        sudo chmod 666 /dev/kvm
        "$ANDROID_HOME/emulator/emulator" -avd aqer-map-search-ux-upgrade -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -accel on -memory 2048 -cores 2 > "$RUNNER_TEMP/map-search-ux-emulator.log" 2>&1 &
        emulator_pid=$!
        deadline=$((SECONDS+250))
        while [ "$SECONDS" -lt "$deadline" ]; do
          if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/map-search-ux-emulator.log"; exit 1; fi
          if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null || true)" = 1 ] && [ "$(adb -s emulator-5554 shell getprop sys.user.0.ce_available 2>/dev/null || true)" = true ]; then break; fi
          sleep 2
        done
        if [ "$SECONDS" -ge "$deadline" ]; then cat "$RUNNER_TEMP/map-search-ux-emulator.log"; adb -s emulator-5554 shell getprop sys.boot_completed || true; exit 1; fi
    - name: Replace ordinary 1819 with 1820 without uninstall or data reset
      run: |
        python3 -B ../harness/scripts/recheck_map_search_ux_1820.py \
          --baseline-apk map-search-ux-input/baseline/AQER-UAT-1819-Clean.apk \
          --baseline-receipt map-search-ux-input/baseline/APK_VERIFICATION.json \
          --candidate-apk map-search-ux-input/candidate/AQER-UAT-1820-Map-Search.apk \
          --candidate-receipt map-search-ux-input/candidate/APK_VERIFICATION.json \
          --source "$UPGRADE_SOURCE_SHA" --serial emulator-5554 \
          --output map-search-ux-upgrade-proof
      working-directory: product
    - name: Save update and guest UI evidence
      uses: actions/upload-artifact@v4
      if: always() && github.event.repository.private
      with:
        name: map-search-ux-1820-keyless-recheck-8cdcc2b6de2146a0eca8390c7db82ae511c5113e
        path: product/map-search-ux-upgrade-proof/
        retention-days: 14
        if-no-files-found: warn
    - name: Stop the disposable emulator
      if: always()
      run: adb -s emulator-5554 emu kill || true
