name: Temporary Support Manager Agent Patch

on:
  push:
    branches:
      - support/manager-agent-workflow
    paths:
      - .github/workflows/temp-support-manager-agent-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout support workflow branch
        uses: actions/checkout@v4
        with:
          ref: support/manager-agent-workflow
          fetch-depth: 0
      - name: Apply backend support workflow patch
        run: python3 tools/temp_support_manager_agent_backend_patch.py
      - name: Remove temporary patch tooling
        run: |
          rm tools/temp_support_manager_agent_backend_patch.py
          rm .github/workflows/temp-support-manager-agent-patch.yml
      - name: Commit generated support workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement support manager and agent backend workflow"
          git push origin HEAD:support/manager-agent-workflow
