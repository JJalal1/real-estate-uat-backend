name: Owner active screen states
on:
  pull_request:
    branches: [work/wave2-review-current]
    paths: ['mobile_app/**', '.github/workflows/owner-screen-audit.yml']
permissions:
  contents: read
jobs:
  states:
    name: Active role screens loading error retry RTL and large text
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve protected dependencies and run screen matrix
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter test test/owner_active_screen_states_test.dart --reporter expanded
