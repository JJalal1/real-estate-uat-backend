name: Temporary Support Inbox Completed Fix

on:
  push:
    branches:
      - fix/support-inbox-completed-assignment-flow
    paths:
      - tools/temp_fix_support_inbox_completed.py
      - .github/workflows/temp-support-inbox-completed-fix.yml

permissions:
  contents: write

env:
  UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/support-inbox-completed-assignment-flow
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/temp_fix_support_inbox_completed.py
      - name: Remove temporary patcher and workflow
        run: |
          rm tools/temp_fix_support_inbox_completed.py
          rm .github/workflows/temp-support-inbox-completed-fix.yml
      - name: Backend tests
        working-directory: backend-api-runtime
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          cp .env.example .env || true
          composer install --no-interaction --prefer-dist --no-progress
          php artisan test tests/Feature/UatSupportCompletedInboxFlowApiTest.php tests/Feature/UatSupportManagerAgentWorkflowApiTest.php tests/Feature/UatAdminSupportWorkspaceApiTest.php --display-warnings --fail-on-warning --fail-on-risky
      - name: Flutter checks
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - working-directory: mobile_app
        run: flutter pub get
      - working-directory: mobile_app
        run: flutter analyze
      - working-directory: mobile_app
        run: flutter test test/support_completed_inbox_flow_test.dart test/support_manager_agent_workflow_test.dart
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix support inbox completion and assignment flow"
          git push origin HEAD:fix/support-inbox-completed-assignment-flow
