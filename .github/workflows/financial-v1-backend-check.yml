name: Financial V1 Backend Check

on:
  push:
    branches: [feature/financial-v1-impl]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test environment
        shell: bash
        run: |
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          printf 'APP_KEY=base64:%s\n' "$key" > .env
      - run: php artisan migrate:fresh --force
      - run: php artisan route:list > /tmp/routes.txt
      - name: Diagnose payment-review inbox state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/Feature/FinancialV1ApiTest.php')
          s=p.read_text(encoding='utf-8')
          old="""        $inbox=$this->withHeaders($agentHeaders)->getJson('/api/admin/workspace/tasks?scope=inbox&type=payment_review')->assertOk();
        $taskId=(int)$inbox->json('data.0.id');
        $this->assertGreaterThan(0,$taskId);
"""
          new="""        $inbox=$this->withHeaders($agentHeaders)->getJson('/api/admin/workspace/tasks?scope=inbox&type=payment_review')->assertOk();
        $projected=SupportTask::query()->where('source_type','payment_review')->where('source_id',$paymentId)->firstOrFail();
        $members=DB::table('support_team_members')->where('user_id',$agent->id)->get(['support_team_id','member_role','is_available','capacity']);
        fwrite(STDERR, 'FIN_DIAG='.json_encode([
            'response_total'=>$inbox->json('meta.total'),
            'response_count'=>count((array)$inbox->json('data')),
            'task'=>['id'=>$projected->id,'status'=>$projected->status,'team'=>$projected->support_team_id,'assigned'=>$projected->assigned_to_user_id,'source_type'=>$projected->source_type],
            'memberships'=>$members->map(fn($m)=>['team'=>(int)$m->support_team_id,'role'=>$m->member_role,'available'=>(bool)$m->is_available,'capacity'=>(int)$m->capacity])->values()->all(),
            'has_support_agent'=>$agent->fresh()->hasRole('support_agent'),
            'has_payment_review'=>$agent->fresh()->hasPermission('payments.review'),
            'has_support_manage'=>$agent->fresh()->hasPermission('support.manage'),
        ],JSON_UNESCAPED_UNICODE).PHP_EOL);
        $taskId=(int)$inbox->json('data.0.id');
        $this->assertGreaterThan(0,$taskId);
"""
          if s.count(old)!=1:
              raise SystemExit('diagnostic anchor changed')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          php -l tests/Feature/FinancialV1ApiTest.php
          php artisan test tests/Feature/FinancialV1ApiTest.php --filter=payment_review_task_is_visible_claimed_and_reviewed_only_by_assigned_agent
      - run: git checkout -- tests/Feature/FinancialV1ApiTest.php && php artisan test --display-warnings --fail-on-warning --fail-on-risky

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: real_estate_financial_v1
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d real_estate_financial_v1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: real_estate_financial_v1
      DB_USERNAME: postgres
      DB_PASSWORD: ''
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_pgsql, pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test environment
        shell: bash
        run: |
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          printf 'APP_KEY=base64:%s\n' "$key" > .env
      - name: Migrate clean PostgreSQL database
        run: php artisan migrate --force
      - name: Verify Financial V1 RLS and ledger triggers
        shell: bash
        run: |
          php artisan tinker --execute="dump(DB::select(\"select relname, relrowsecurity from pg_class where relname in ('property_payments','property_platform_receivables','property_financial_ledger_entries','property_financial_ledger_lines') order by relname\"));"
          php artisan tinker --execute="dump(DB::select(\"select tgname from pg_trigger where not tgisinternal and tgname like 'property_financial_ledger_%_immutable_%' order by tgname\"));"
      - name: Run Financial V1 PostgreSQL acceptance tests
        run: >-
          php artisan test
          tests/Feature/FinancialV1ApiTest.php
          tests/Feature/PropertySaiAgreementSettlementTest.php
          tests/Feature/PropertySaiPolicyAcceptanceTest.php
          --display-warnings --fail-on-warning --fail-on-risky