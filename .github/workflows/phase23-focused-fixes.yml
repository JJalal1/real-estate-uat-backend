name: Phase23 focused product fixes
on:
  push:
    branches: [work/phase23-acceptance-20261111]
    paths:
      - .github/workflows/phase23-focused-fixes.yml
      - mobile_app/lib/features/support/presentation/support_tasks_screen.dart
      - mobile_app/lib/features/reviews/presentation/listing_review_workspace_screen.dart
      - mobile_app/lib/features/reviews/domain/listing_review_models.dart
      - mobile_app/lib/features/properties/domain/property_field_options.dart
      - mobile_app/lib/features/properties/domain/property_comparison.dart
      - mobile_app/test/phase23_listing_task_navigation_test.dart
      - mobile_app/test/uat_listing_support_claim_ux_test.dart
permissions:
  contents: read
jobs:
  support-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve only the existing approved dependency set
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Analyze the changed support flow
        working-directory: mobile_app
        run: flutter analyze --fatal-infos lib/features/support/presentation/support_tasks_screen.dart lib/features/reviews/presentation/listing_review_workspace_screen.dart lib/features/reviews/domain/listing_review_models.dart lib/features/properties/domain/property_field_options.dart lib/features/properties/domain/property_comparison.dart test/phase23_listing_task_navigation_test.dart test/uat_listing_support_claim_ux_test.dart
      - name: Verify exact case navigation and account isolation
        working-directory: mobile_app
        run: |
          flutter test --no-pub test/phase23_listing_task_navigation_test.dart test/uat_listing_support_claim_ux_test.dart test/support_manager_agent_workflow_test.dart test/support_completed_inbox_flow_test.dart
          flutter test --no-pub test/wave6_product_contract_test.dart --plain-name 'comparison uses only real comparable money'
