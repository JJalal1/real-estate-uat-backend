name: Connectivity fix for the installed UAT 1815
on:
  push:
    branches: [work/fix-connectivity-1815-20261117]
    paths:
      - mobile_app/**
      - scripts/import_ci_uat_signing.py
      - scripts/tests/test_uat_signing_configuration.py
      - scripts/verify_connectivity_fix_apk.py
      - .github/workflows/connectivity-fix-1815.yml
permissions:
  contents: read
concurrency:
  group: connectivity-fix-1815-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signing_readiness:
    name: Presence only and installed signer pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      compatible: ${{ steps.readiness.outputs.compatible }}
    steps:
      - name: Emit public readiness without reading signing material
        id: readiness
        env:
          HAS_KEYSTORE: ${{ secrets.AQER_UAT_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.AQER_RELEASE_STORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.AQER_RELEASE_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.AQER_RELEASE_KEY_PASSWORD != '' }}
          HAS_CERTIFICATE_PIN: ${{ secrets.AQER_UAT_SIGNING_CERT_SHA256 != '' }}
          INSTALLED_CERTIFICATE_PIN_MATCHES: ${{ secrets.AQER_UAT_SIGNING_CERT_SHA256 == 'a157c63cd37090cebac83d2a2786e1e3342a8b09f17daeea30e93a5cbd65796f' }}
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          names = ('KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD', 'CERTIFICATE_PIN')
          present = {name.lower(): os.environ['HAS_' + name] == 'true' for name in names}
          pin_matches = os.environ['INSTALLED_CERTIFICATE_PIN_MATCHES'] == 'true'
          compatible = all(present.values()) and pin_matches
          receipt = {
              'source_commit': os.environ['GITHUB_SHA'], 'present': present,
              'installed_certificate_pin_matches': pin_matches, 'compatible': compatible,
              'status': 'configuration_present_pending_validation' if compatible else 'blocked_missing_or_mismatched_installed_signer',
              'signing_material_verified': False, 'apk_built': False,
              'installed_device_upgrade_tested': False, 'duplicate_apk_created': False,
          }
          output = Path('connectivity-readiness')
          output.mkdir()
          (output / 'SIGNING_READINESS.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('compatible=' + str(compatible).lower() + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: connectivity-signing-readiness-${{ github.sha }}
          path: connectivity-readiness/SIGNING_READINESS.json
          retention-days: 14
          if-no-files-found: error
  tests:
    name: Strict analysis, connectivity and existing offline regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Existing signing importer contracts with synthetic fixtures only
        env:
          AQER_TEST_RUNNER_SIGNING: 'true'
          AQER_SIGNING_ENVIRONMENT: uat
        run: python3 -B -m unittest discover -s scripts/tests -p test_uat_signing_configuration.py -v
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve original locked dependencies
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
      - name: Strict analysis
        working-directory: mobile_app
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Connection detection and affected offline contracts
        working-directory: mobile_app
        run: >-
          flutter test test/offline_connection_detection_test.dart
          test/offline_http_storage_test.dart test/offline_message_outbox_test.dart
          test/offline_photo_and_draft_test.dart test/offline_search_restore_test.dart
          test/offline_coordinator_intent_test.dart test/offline_conversation_loading_test.dart
          test/private_journey_actor_scope_test.dart test/wave1_public_photo_cache_test.dart
          test/adaptive_image_quality_test.dart test/private_listing_card_photo_test.dart
          test/message_inbox_pagination_test.dart test/session_lifecycle_race_test.dart
          test/stage6_auth_user_test.dart test/owner_auth_boundary_test.dart
          test/compact_cards_email_login_test.dart test/phase23_draft_network_recovery_test.dart
          test/phase04_ranked_search_test.dart test/phase04_governorates_test.dart
          test/property_marker_cluster_test.dart test/map_dynamic_filters_1430_test.dart
          test/smart_search_pagination_recovery_test.dart test/public_discovery_cancellation_test.dart
          --reporter expanded --timeout 2m
  delivery:
    name: Build 1816 only with the installed app signer
    needs: [tests, signing_readiness]
    if: ${{ needs.tests.result == 'success' && needs.signing_readiness.outputs.compatible == 'true' && github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AQER_SIGNING_ENVIRONMENT: uat
      AQER_ALLOW_DEBUG_RELEASE_SIGNING: 'false'
      ORG_GRADLE_PROJECT_AQER_UAT_APPLICATION_ID: com.aqer.yemen.uat.offline
      ORG_GRADLE_PROJECT_AQER_UAT_APP_NAME: عقار أوفلاين اختبار
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Reuse existing reviewed public Gradle dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: aqer-phase1-public-gradle-v1-${{ runner.os }}-jdk17-flutter3273-api36-ad06237b7aceaaba2ea4833b822d61753244af41-${{ hashFiles('mobile_app/pubspec.lock', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties', 'mobile_app/android/settings.gradle*', 'mobile_app/android/build.gradle*', 'docs/ui-transplant-v3/pubspec_overrides.yaml') }}
      - name: Resolve original locked dependencies
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
      - name: Validate and stage the existing pinned UAT key; never generate one
        env:
          AQER_UAT_KEYSTORE_BASE64: ${{ secrets.AQER_UAT_KEYSTORE_BASE64 }}
          AQER_RELEASE_STORE_PASSWORD: ${{ secrets.AQER_RELEASE_STORE_PASSWORD }}
          AQER_RELEASE_KEY_ALIAS: ${{ secrets.AQER_RELEASE_KEY_ALIAS }}
          AQER_RELEASE_KEY_PASSWORD: ${{ secrets.AQER_RELEASE_KEY_PASSWORD }}
          AQER_UAT_SIGNING_CERT_SHA256: ${{ secrets.AQER_UAT_SIGNING_CERT_SHA256 }}
        run: python3 -B scripts/import_ci_uat_signing.py --required
      - name: Build an update candidate in the same installed package
        working-directory: mobile_app
        env:
          AQER_RELEASE_STORE_PASSWORD: ${{ secrets.AQER_RELEASE_STORE_PASSWORD }}
          AQER_RELEASE_KEY_ALIAS: ${{ secrets.AQER_RELEASE_KEY_ALIAS }}
          AQER_RELEASE_KEY_PASSWORD: ${{ secrets.AQER_RELEASE_KEY_PASSWORD }}
        run: >-
          flutter build apk --flavor uat --release --no-pub --build-number=1816
          --dart-define=APP_ENVIRONMENT=uat
          --dart-define=APP_BUILD_NUMBER=1816
          --dart-define=APP_PACKAGE_ID=com.aqer.yemen.uat.offline
          --dart-define=API_BASE_URL=https://real-estate-uat-api-frankfurt.onrender.com/api
          --dart-define=APP_SHARE_BASE_URL=https://real-estate-uat-api-frankfurt.onrender.com
          --dart-define=AQER_RANKED_DISCOVERY=true
      - name: Verify exact installed signer, identity, compiled API and packaging
        run: python3 -B scripts/verify_connectivity_fix_apk.py
      - uses: actions/upload-artifact@v4
        if: success() && github.event.repository.private
        with:
          name: connectivity-fix-1816-${{ github.sha }}
          path: |
            mobile_app/connectivity-proof/AQER-UAT-1816-Connectivity-Fix.apk
            mobile_app/connectivity-proof/APK_VERIFICATION.json
          retention-days: 14
          if-no-files-found: error
      - name: Remove staged signing key even after failure or cancellation
        if: always()
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'aqer-uat-signing'
          if directory.is_symlink():
              raise RuntimeError('refuse_unexpected_signing_directory_symlink')
          (directory / 'uat-release.keystore').unlink(missing_ok=True)
          if directory.exists():
              directory.rmdir()
          print('AQER_UAT_SIGNING_MATERIAL_REMOVED')
          PY
