name: Private broker AI verified build evidence
on:
  push:
    branches: [delivery/broker-ai-57-evidence]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    name: Verify broker AI APK 1057 metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read bounded tested build metadata
        env:
          APK_READ_TOKEN: ${{ github.token }}
        run: python3 -B scripts/read_broker_ai_evidence.py
  preview:
    name: Preview ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        file: [assistant-completion.png, assistant-review-1.0.png, assistant-copy-1.0.png, assistant-copy-2.4.png]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read one bounded synthetic preview
        env:
          APK_READ_TOKEN: ${{ github.token }}
        run: python3 -B scripts/read_broker_ai_evidence.py --preview '${{ matrix.file }}'
