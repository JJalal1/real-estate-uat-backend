name: Temporary Support Backend Check

on:
  push:
    branches:
      - support/manager-agent-workflow
    paths:
      - .github/workflows/temp-support-backend-check.yml

jobs:
  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: cp .env.example .env || true
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan key:generate --force
      - name: Run support workflow tests
        run: php artisan test tests/Feature/UatSupportManagerAgentWorkflowApiTest.php tests/Feature/UatThreeRoleSupportWorkspaceApiTest.php
      - name: Run full Laravel tests
        run: php artisan test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: real_estate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d real_estate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-api-runtime
    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: real_estate_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Apply complete PostgreSQL migration chain
        run: php artisan migrate --force
      - name: Run support workflow tests on PostgreSQL
        run: php artisan test tests/Feature/UatSupportManagerAgentWorkflowApiTest.php tests/Feature/UatThreeRoleSupportWorkspaceApiTest.php
