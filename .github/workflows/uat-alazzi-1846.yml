          AQER_CHAT_PUBLIC_CERTIFICATE_1850_SHA256: '54ce067cb28053b644ab0ff4a0fb05b4e8e31d5bb1be06dce10218dee8b2c7ce'
        run: |
          python3 -B - <<'PYTHON'
          import base64
          import hashlib
          import json
          import os
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from prepare_phase1_close import encrypt

          original = Path("uat-installer")
          receipt = json.loads((original / "APK_VERIFICATION.json").read_text())
          identity = json.loads(Path("docs/uat-signing-identity.json").read_text())
          assert receipt["source"] == os.environ["AQER_SOURCE_SHA"]
          assert receipt["run_id"] == os.environ["GITHUB_RUN_ID"]
          build = int(os.environ["AQER_BUILD"])
          assert build in (1848, 1849, 1850) and receipt["build"] == build and receipt["abis"] == ["arm64-v8a"]
          assert receipt["package"] == identity["package"] == "com.aqer.yemen.uat.offline"
          assert receipt["certificate_sha256"] == identity["certificate_sha256"]
          apk = original / f"AQER-UAT-{build}-Alazzi-ARM64.apk"
          assert not apk.is_symlink() and apk.stat().st_size == receipt["bytes"]
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == receipt["sha256"]

          encoded = "".join(os.environ[f"AQER_CHAT_PUBLIC_CERTIFICATE_{build}_B64"].split())
          certificate = base64.b64decode(encoded, validate=True)
          fingerprint = os.environ[f"AQER_CHAT_PUBLIC_CERTIFICATE_{build}_SHA256"]
          assert hashlib.sha256(certificate).hexdigest() == fingerprint
          output = Path("uat-private-chat")
          output.mkdir(mode=0o700)
          with tempfile.TemporaryDirectory(prefix="aqer-chat-recipient-", dir=os.environ["RUNNER_TEMP"]) as directory:
              recipient = Path(directory) / "recipient.pem"
              recipient.write_bytes(certificate)
              receipt["encrypted_installer"] = encrypt(apk, output / "installer.cms", recipient)
          receipt["recipient_sha256"] = fingerprint
          (output / "APK_VERIFICATION.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PYTHON
      - name: Upload the temporary encrypted owner delivery
        if: env.AQER_BUILD == '1848' || env.AQER_BUILD == '1849' || env.AQER_BUILD == '1850'
        uses: actions/upload-artifact@v4
        with:
          name: AQER-UAT-${{ env.AQER_BUILD }}-private-chat-${{ github.run_attempt }}
          path: |
            uat-private-chat/installer.cms
            uat-private-chat/APK_VERIFICATION.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload the verified APK and receipt
        if: github.event.repository.private == true && env.AQER_BUILD != '1848' && env.AQER_BUILD != '1849' && env.AQER_BUILD != '1850' && env.AQER_BUILD != '1851'
        uses: actions/upload-artifact@v4
        with:
          name: AQER-UAT-${{ env.AQER_BUILD }}-Alazzi-ARM64-${{ github.run_attempt }}
          path: |
            uat-installer/AQER-UAT-${{ env.AQER_BUILD }}-Alazzi-ARM64.apk
            uat-installer/APK_VERIFICATION.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Attach the verified installer to a private draft
        if: github.event.repository.private == true && env.AQER_BUILD != '1848' && env.AQER_BUILD != '1849' && env.AQER_BUILD != '1850' && env.AQER_BUILD != '1851'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = JJalal1/real-estate-uat-backend
          cd uat-installer
          gh release create "uat-alazzi-$AQER_BUILD-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "AQER-UAT-$AQER_BUILD-Alazzi-ARM64.apk" APK_VERIFICATION.json --repo "$GITHUB_REPOSITORY" \
            --draft --target "$AQER_SOURCE_SHA" --title "AQER UAT $AQER_BUILD — Alazzi" \
            --notes "Signed UAT installer verified against source $AQER_SOURCE_SHA."
