name: Alazzi signed UAT installer

on:
  push:
    branches:
      - work/alazzi-unify-1846
      - work/alazzi-marketplace-1847
      - release/alazzi-1848-account-search
      - release/alazzi-1849-ui-parity
      - work/alazzi-support-1850
      - release/alazzi-1850-support
      - release/alazzi-1851-category-filters
      - work/alazzi-support-1851
      - release/alazzi-1851-support
      - work/alazzi-unified-1852
      - release/alazzi-1852-unified
      - release/alazzi-1853-polish
      - release/alazzi-1854-manager
      - release/alazzi-1855-listing
      - release/alazzi-1856-sai

permissions:
  contents: read

concurrency:
  group: aqer-alazzi-signed-${{ github.ref }}
  cancel-in-progress: true

env:
  AQER_BUILD: >-
    ${{ github.ref_name == 'release/alazzi-1856-sai' && '1856'
      || github.ref_name == 'release/alazzi-1855-listing' && '1855'
      || github.ref_name == 'release/alazzi-1854-manager' && '1854'
      || github.ref_name == 'release/alazzi-1853-polish' && '1853'
      || (github.ref_name == 'work/alazzi-unified-1852' || github.ref_name == 'release/alazzi-1852-unified') && '1852'
      || (github.ref_name == 'release/alazzi-1851-category-filters' || github.ref_name == 'work/alazzi-support-1851' || github.ref_name == 'release/alazzi-1851-support') && '1851'
      || (github.ref_name == 'work/alazzi-support-1850' || github.ref_name == 'release/alazzi-1850-support') && '1850'
      || github.ref_name == 'release/alazzi-1849-ui-parity' && '1849'
      || github.ref_name == 'release/alazzi-1848-account-search' && '1848'
      || github.ref_name == 'work/alazzi-marketplace-1847' && '1847' || '1846' }}
  AQER_SOURCE_SHA: ${{ github.sha }}
  AQER_PUBSPEC_BLOB: >-
    ${{ (github.ref_name == 'release/alazzi-1854-manager' || github.ref_name == 'release/alazzi-1855-listing' ||
         github.ref_name == 'release/alazzi-1856-sai') && '60410c09da10a147c646a06716d2f44fee4a3443'
      || (github.ref_name == 'release/alazzi-1848-account-search' || github.ref_name == 'release/alazzi-1849-ui-parity' ||
         github.ref_name == 'work/alazzi-support-1850' || github.ref_name == 'release/alazzi-1850-support' ||
         github.ref_name == 'release/alazzi-1851-category-filters' || github.ref_name == 'work/alazzi-support-1851' || github.ref_name == 'release/alazzi-1851-support' ||
         github.ref_name == 'work/alazzi-unified-1852' || github.ref_name == 'release/alazzi-1852-unified' ||
         github.ref_name == 'release/alazzi-1853-polish')
      && '09ac4bdf253134411b87d99acd412bb118159e71' || '4583d88e975281d4d55c0622b48ae1249342d99c' }}

jobs:
  verify-api:
    name: Test listing availability, deal confirmation and dues APIs
    if: >-
      ${{ github.repository == 'JJalal1/real-estate-uat-backend' && !github.event.deleted &&
          ((github.event.repository.private && !startsWith(github.ref_name, 'release/')) ||
           (github.actor == github.repository_owner &&
            (github.ref_name == 'work/alazzi-marketplace-1847' || github.ref_name == 'release/alazzi-1848-account-search' ||
             github.ref_name == 'release/alazzi-1849-ui-parity' || github.ref_name == 'work/alazzi-support-1850' ||
             github.ref_name == 'release/alazzi-1850-support' || github.ref_name == 'release/alazzi-1851-category-filters' ||
             github.ref_name == 'work/alazzi-support-1851' || github.ref_name == 'release/alazzi-1851-support' ||
             github.ref_name == 'work/alazzi-unified-1852' || github.ref_name == 'release/alazzi-1852-unified' ||
             github.ref_name == 'release/alazzi-1853-polish' || github.ref_name == 'release/alazzi-1854-manager' ||
             github.ref_name == 'release/alazzi-1855-listing' || github.ref_name == 'release/alazzi-1856-sai'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 27
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: real_estate_audit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d real_estate_audit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AQER_SOURCE_SHA }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Initialize disposable test credentials and database roles
        run: |
          test "$(git rev-parse HEAD)" = "$AQER_SOURCE_SHA"
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
          php artisan key:generate --force
          psql -h 127.0.0.1 -U postgres -d real_estate_audit -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: Exercise listing, support, notifications and discovery on SQLite
        run: >-
          php artisan test
          tests/Feature/PlatformNotificationHistoryTest.php
          tests/Feature/Stage11MessagingNotificationsApiTest.php
          tests/Feature/UatThreeRoleSupportWorkspaceApiTest.php
          tests/Feature/FinancialV1ApiTest.php
          tests/Feature/FinancialV1CompletionTest.php
          tests/Feature/BrokerExperienceApiTest.php
          tests/Feature/Phase3BuyerDiscoveryFavoritesApiTest.php
          tests/Feature/Stage5PropertyApiTest.php
          tests/Feature/BackgroundPreparationTest.php
          tests/Feature/DiscoverySearchQualityTest.php
          tests/Feature/SpokenSearchCityTest.php
          --display-warnings --fail-on-warning --fail-on-risky
      - name: Exercise the unified APIs and migrations on PostgreSQL/PostGIS
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: real_estate_audit
          DB_USERNAME: postgres
          DB_PASSWORD: ''
          DB_URL: ''
          DB_SEARCH_PATH: public,extensions
        run: >-
          php artisan test
          tests/Feature/PlatformNotificationHistoryTest.php
          tests/Feature/Stage11MessagingNotificationsApiTest.php
          tests/Feature/UatThreeRoleSupportWorkspaceApiTest.php
          tests/Feature/FinancialV1ApiTest.php
          tests/Feature/FinancialV1CompletionTest.php
          tests/Feature/BrokerExperienceApiTest.php
          tests/Feature/Phase3BuyerDiscoveryFavoritesApiTest.php
          tests/Feature/Stage5PropertyApiTest.php
          tests/Feature/BackgroundPreparationTest.php
          tests/Feature/DiscoverySearchQualityTest.php
          tests/Feature/SpokenSearchCityTest.php
          tests/Postgres/PropertyMarketContextPostgresTest.php
          --display-warnings --fail-on-warning --fail-on-risky

      - name: Verify support task lifecycles and access on both test databases
        if: fromJSON(env.AQER_BUILD) >= 1850
        run: |
          support_tests=(
            tests/Feature/UatAdminSupportWorkspaceApiTest.php
            tests/Feature/UatSupportCompletedInboxFlowApiTest.php
            tests/Feature/UatSupportManagerAgentWorkflowApiTest.php
            tests/Feature/UatSupportTeamAdministrationApiTest.php
            tests/Feature/UatListingSupportClaimApiTest.php
            tests/Feature/Stage9ListingReviewApiTest.php
            tests/Feature/BrokerSupportHttpJourneyTest.php
            tests/Feature/Wave2MediaTrustTest.php
          )
          if [ "$AQER_BUILD" -ge 1852 ] || { [ "$AQER_BUILD" = 1851 ] && [ "$GITHUB_REF_NAME" != release/alazzi-1851-category-filters ]; }; then
            support_tests+=(
              tests/Feature/Stage10CommunitySupportApiTest.php
              tests/Feature/Phase4MessagingViewingAcceptanceTest.php
              tests/Feature/Phase23InboxPaginationTest.php
              tests/Feature/UatGeneralManagerInsightsApiTest.php
              tests/Feature/PlatformNotificationHistoryTest.php
            )
          fi
          if [ "$AQER_BUILD" -ge 1855 ]; then
            support_tests+=(
              tests/Feature/PropertySaiPolicyAcceptanceTest.php
              tests/Feature/PropertySaiAgreementSettlementTest.php
              tests/Feature/Wave3MarketplaceApiTest.php
              tests/Feature/BrokerListingAssistantTest.php
              tests/Feature/Branch2RecoveryTest.php
              tests/Feature/UxRefinementApiTest.php
              tests/Feature/Wave4ListingJourneyTest.php
              tests/Feature/Wave5ListingRefinementTest.php
            )
          fi
          if [ "$AQER_BUILD" = 1856 ]; then
            support_tests+=(tests/Feature/Wave6EditorDiscoveryTest.php)
          fi
          php artisan test "${support_tests[@]}" --display-warnings --fail-on-warning --fail-on-risky
          APP_ENV=testing DB_CONNECTION=pgsql DB_HOST=127.0.0.1 DB_PORT=5432 \
            DB_DATABASE=real_estate_audit DB_USERNAME=postgres DB_PASSWORD='' DB_URL='' DB_SEARCH_PATH=public,extensions \
            php artisan test "${support_tests[@]}" --display-warnings --fail-on-warning --fail-on-risky

      - name: Verify property category filters and their migration on both test databases
        if: github.ref_name == 'release/alazzi-1851-category-filters' || fromJSON(env.AQER_BUILD) >= 1852
        run: |
          test_file=tests/Feature/CategoryPropertyFiltersTest.php
          php artisan test "$test_file" --display-warnings --fail-on-warning --fail-on-risky
          APP_ENV=testing DB_CONNECTION=pgsql DB_HOST=127.0.0.1 DB_PORT=5432 \
            DB_DATABASE=real_estate_audit DB_USERNAME=postgres DB_PASSWORD='' DB_URL='' DB_SEARCH_PATH=public,extensions \
            php artisan test "$test_file" --display-warnings --fail-on-warning --fail-on-risky

  verify-flutter:
    name: Analyze Flutter and exercise listing, finance, and support journeys
    if: >-
      ${{ github.repository == 'JJalal1/real-estate-uat-backend' && !github.event.deleted &&
          ((github.event.repository.private && !startsWith(github.ref_name, 'release/')) ||
           (github.actor == github.repository_owner &&
            (github.ref_name == 'work/alazzi-marketplace-1847' || github.ref_name == 'release/alazzi-1848-account-search' ||
             github.ref_name == 'release/alazzi-1849-ui-parity' || github.ref_name == 'work/alazzi-support-1850' ||
             github.ref_name == 'release/alazzi-1850-support' || github.ref_name == 'release/alazzi-1851-category-filters' ||
             github.ref_name == 'work/alazzi-support-1851' || github.ref_name == 'release/alazzi-1851-support' ||
             github.ref_name == 'work/alazzi-unified-1852' || github.ref_name == 'release/alazzi-1852-unified' ||
             github.ref_name == 'release/alazzi-1853-polish' || github.ref_name == 'release/alazzi-1854-manager' ||
             github.ref_name == 'release/alazzi-1855-listing' || github.ref_name == 'release/alazzi-1856-sai'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AQER_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the exact Flutter source
        run: test "$(git rev-parse HEAD)" = "$AQER_SOURCE_SHA"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve the approved package lock
        working-directory: mobile_app
        run: |
          test "$(git hash-object pubspec.yaml)" = "$AQER_PUBSPEC_BLOB"
          git diff --exit-code fd832497768aac67fdd32485f2af835f273111c8 HEAD -- \
            pubspec.lock ../docs/ui-transplant-v3/pubspec_overrides.yaml
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          approved="$RUNNER_TEMP/aqer-approved-dependencies"
          git worktree add --detach --quiet "$approved" fd832497768aac67fdd32485f2af835f273111c8
          cp "$approved/docs/ui-transplant-v3/pubspec_overrides.yaml" "$approved/mobile_app/pubspec_overrides.yaml"
          reference_lock="$PWD/pubspec.lock"
          if [ "$AQER_BUILD" -ge 1854 ]; then
            reference_lock="$RUNNER_TEMP/aqer-1829-reference.lock"
            python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock \
              --approved-uat1829 --reference-lock "$reference_lock"
          else
            python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock --approved-uat1829
          fi
          python3 -B "$approved/scripts/verify_v3_dependency_lock.py" --resolved "$reference_lock" --approved-uat1829
          flutter pub get --enforce-lockfile

      - name: Check Android map configuration and signing boundaries
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_uat_signing_configuration.py'
          cd mobile_app
          flutter test --no-pub test/app_theme_test.dart test/map_layers_test.dart test/phase04_ranked_search_test.dart \
            --dart-define=APP_ENVIRONMENT=uat --dart-define=AQER_GOOGLE_MAPS_UAT=true --reporter expanded
      - name: Analyze the exact Flutter source
        working-directory: mobile_app
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Test listing updates, sale/rent outcomes and broker activity
        working-directory: mobile_app
        run: >-
          flutter test --no-pub --reporter expanded
          test/broker_experience_ui_test.dart
          test/broker_activity_result_test.dart
          test/my_listings_layout_20261126_test.dart
          test/my_listings_pagination_test.dart
          test/private_tail_pagination_test.dart
          test/wave4_sai_consent_test.dart
          test/broker_messaging_handoff_test.dart
      - name: Test support tasks, financial dues and actionable notifications
        working-directory: mobile_app
        run: >-
          flutter test --no-pub --reporter expanded
          test/support_task_pagination_test.dart
          test/support_manager_agent_workflow_test.dart
          test/uat_manager_wave_screen_test.dart
          test/uat_notification_actions_test.dart
          test/phase4_notification_destination_test.dart
          test/phase5_notification_destination_test.dart
          test/message_inbox_pagination_test.dart
          test/platform_dues_payment_test.dart
          test/financial_v1_contract_test.dart
      - name: Test public discovery, favorites and prior listing history
        working-directory: mobile_app
        run: >-
          flutter test --no-pub --reporter expanded
          test/wave3_search_only_1393_test.dart
          test/home_location_entry_1820_test.dart
          test/home_dhamar_similar_cards_test.dart
          test/phase3_favorites_screen_test.dart
          test/phase23_favorite_recovery_test.dart
      - name: Test compact Home rails in the full marketplace screen
        if: fromJSON(env.AQER_BUILD) >= 1853
        working-directory: mobile_app
        run: flutter test --no-pub --reporter expanded test/ui_transplant_v3_home_test.dart
      - name: Test the listing card layouts and both dictation entry points
        if: fromJSON(env.AQER_BUILD) >= 1849
        working-directory: mobile_app
        run: >-
          flutter test --no-pub --reporter expanded
          test/listing_card_parity_test.dart
          test/compact_cards_email_login_test.dart
          test/broker_listing_assistant_test.dart
          test/branch2_voice_test.dart
          test/live_dictation_test.dart
          test/in_app_voice_search_test.dart
          test/wave6_product_ui_test.dart
      - name: Test support workspace navigation and listing review
        if: fromJSON(env.AQER_BUILD) >= 1850
        working-directory: mobile_app
        run: >-
          flutter test --no-pub --reporter expanded
          test/support_completed_inbox_flow_test.dart
          test/support_case_pagination_test.dart
          test/support_manager_agent_workflow_test.dart
          test/uat_manager_wave_screen_test.dart
          test/uat_map_location_picker_test.dart
          test/uat_notification_actions_test.dart
          test/startup_navigation_layout_test.dart
          test/uat_three_role_workspaces_test.dart
          test/uat_admin_support_interface_contract_test.dart
          test/uat_admin_support_workspace_models_test.dart
          test/uat_listing_support_claim_ux_test.dart
          test/listing_review_pagination_test.dart
          test/phase23_listing_task_navigation_test.dart
          test/stage9_review_models_test.dart
          test/financial_v1_contract_test.dart
      - name: Test private report forms across session changes
        if: fromJSON(env.AQER_BUILD) >= 1852
        working-directory: mobile_app
        run: flutter test --no-pub --reporter expanded test/private_journey_actor_scope_test.dart
      - name: Test the Sections tab, category filters and navigation
        if: github.ref_name == 'release/alazzi-1851-category-filters' || fromJSON(env.AQER_BUILD) >= 1852
        working-directory: mobile_app
        run: |
          flutter test --no-pub --reporter expanded \
            test/marketplace_categories_screen_test.dart \
            test/section_property_filters_test.dart \
            test/category_listing_facts_test.dart \
            test/smart_search_pagination_recovery_test.dart \
            test/owner_ux_location_navigation_test.dart \
            test/template_creation_menu_test.dart
          flutter test --no-pub --reporter expanded test/ui_transplant_v3_template_test.dart \
            --name 'sees the navigation for its approved identity|consumer categories and personal listings'
      - name: Check listing submission, session restoration and search results
        if: fromJSON(env.AQER_BUILD) >= 1855
        working-directory: mobile_app
        run: >-
          flutter test --no-pub --reporter expanded
          test/wave2_home_search_test.dart
          test/wave3_personal_listing_test.dart
          test/offline_http_storage_test.dart
          test/current_wave_ui_test.dart
          test/ux_refinement_test.dart
      - name: Check listing commission limits for sales and first-month rent
        if: env.AQER_BUILD == '1856'
        working-directory: mobile_app
        run: >-
          flutter test --no-pub --reporter expanded
          test/listing_commission_cap_acceptance_test.dart
          test/property_sai_cap_test.dart
      - name: Test support visibility of dues
        working-directory: mobile_app
        run: >-
          flutter test --no-pub --reporter expanded
          test/owner_active_screen_states_test.dart
          --name 'support sees outstanding dues without a publishing restriction'

  verify-and-build:
    name: Build and verify the signed UAT installer
    needs: [verify-api, verify-flutter]
    permissions:
      contents: write
    if: >-
      ${{ github.repository == 'JJalal1/real-estate-uat-backend' && !github.event.deleted &&
          ((github.event.repository.private && !startsWith(github.ref_name, 'release/') &&
            github.ref_name != 'work/alazzi-support-1850' && github.ref_name != 'work/alazzi-support-1851' &&
            github.ref_name != 'work/alazzi-unified-1852') ||
           (github.actor == github.repository_owner &&
            (github.ref_name == 'work/alazzi-marketplace-1847' || github.ref_name == 'release/alazzi-1848-account-search' ||
             github.ref_name == 'release/alazzi-1849-ui-parity' || github.ref_name == 'release/alazzi-1850-support' ||
             github.ref_name == 'release/alazzi-1851-category-filters' || github.ref_name == 'release/alazzi-1851-support' ||
             github.ref_name == 'release/alazzi-1852-unified' || github.ref_name == 'release/alazzi-1853-polish' || github.ref_name == 'release/alazzi-1854-manager' ||
             github.ref_name == 'release/alazzi-1855-listing' || github.ref_name == 'release/alazzi-1856-sai'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AQER_KURAIMI_ARTWORK_PATH: assets/payments/kuraimi.png
      AQER_KURAIMI_ARTWORK_SHA256: '0bfeac8f0a37c3951be2aa852cf86403a1d52c63d8207c9d8d1a784d3b2c194a'
      AQER_JAWALI_ARTWORK_PATH: assets/payments/jawali.png
      AQER_JAWALI_ARTWORK_SHA256: '5288ea4552ee477d6418f03692982ca0eb2adaf31bf600b9d387e0481367f66e'
      AQER_HOME_ASSISTANT_ASSET_PATH: assets/brand/home-smart-assistant.webp
      AQER_HOME_ASSISTANT_ASSET_SHA256: '0fd0d4726de99e45609a1ed94f76756f7abdb2616c683b97d52dbedd7117617a'
      AQER_GOVERNORATES_ASSET_PATH: assets/regions/yemen-adm1.geojson
      AQER_GOVERNORATES_ASSET_SHA256: 'f8a7f28f8fe73a5263ea43bb868cc7eeb7a01c7faf419f2155cffd9fef4ea253'
      AQER_SIGNING_ENVIRONMENT: uat
      AQER_VERIFIED_FIREBASE_FINGERPRINT: '716a458274e8e131530269d9a5196cf6bd3e3bc9d231f3c0c415870d0b1dc79a'
      AQER_ALLOW_DEBUG_RELEASE_SIGNING: 'false'
      ORG_GRADLE_PROJECT_AQER_UAT_APPLICATION_ID: com.aqer.yemen.uat.offline
      ORG_GRADLE_PROJECT_AQER_UAT_APP_NAME: عقار أوفلاين اختبار
      ORG_GRADLE_PROJECT_AQER_UAT_COMPRESS_NATIVE_LIBS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AQER_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and protect approved UAT mobile inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AQER_SOURCE_SHA"
          baseline=8b5ad43b62afab42bd4dbc10cd0bd1ed3e5b6308
          protected_exclusions=()
          if [ "$AQER_BUILD" = 1847 ]; then
            baseline=c5c9ec1a50ddd41fcc8c0d1f88a48dd66986d44a
          elif [ "$AQER_BUILD" = 1848 ]; then
            baseline=8f31b6823b9d8f28d795d7818de1426ce79a569d
            tested_source="$(git rev-parse --verify 'refs/remotes/origin/work/alazzi-account-smart-search-1848^{commit}')"
            test "$tested_source" = "$AQER_SOURCE_SHA"
            governorates="mobile_app/$AQER_GOVERNORATES_ASSET_PATH"
            notice=mobile_app/assets/regions/README.md
            protected_exclusions=(":(exclude,top)$governorates" ":(exclude,top)$notice" ":(exclude,top)mobile_app/pubspec.yaml")
            test -f "$governorates" && test ! -L "$governorates"
            test -f "$notice" && test ! -L "$notice"
            cmp "backend-api-runtime/resources/regions/${governorates##*/}" "$governorates"
            cmp "backend-api-runtime/resources/regions/${notice##*/}" "$notice"
            printf '%s  %s\n' "$AQER_GOVERNORATES_ASSET_SHA256" "$governorates" \
              '1d97dedd3df366c9ee63e2011475ef6d098c8ddfed4afaadb640f15191348091' "$notice" | sha256sum --check --strict
          elif [ "$AQER_BUILD" = 1849 ]; then
            baseline=921847209c499d381a71e159d1262b6c03763ae4
            tested_source="$(git rev-parse --verify 'refs/remotes/origin/work/alazzi-ui-parity-1849^{commit}')"
            test "$tested_source" = "$AQER_SOURCE_SHA"
          elif [ "$AQER_BUILD" = 1850 ]; then
            baseline=dabfb514e9f5d12a044d0ff5ee3367aebe1a10ab
            tested_source="$(git rev-parse --verify 'refs/remotes/origin/work/alazzi-support-1850^{commit}')"
            test "$tested_source" = "$AQER_SOURCE_SHA"
          elif [ "$AQER_BUILD" = 1851 ]; then
            baseline=520b084f379b9e898c6009dc7e5794b9ae6c1f41
            if [ "$GITHUB_REF_NAME" = release/alazzi-1851-category-filters ]; then
