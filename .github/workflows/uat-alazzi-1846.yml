name: Private chat delivery of signed UAT 1847

on:
  push:
    branches: [delivery/alazzi-1847-session-f7b5fd83]

permissions:
  contents: read

concurrency:
  group: aqer-alazzi-signed-${{ github.ref }}
  cancel-in-progress: true

env:
  AQER_BUILD: '1847'
  AQER_SOURCE_SHA: '8f31b6823b9d8f28d795d7818de1426ce79a569d'

jobs:
  verify-api:
    name: Test listing availability, deal confirmation and dues APIs
    if: ${{ github.repository == 'JJalal1/real-estate-uat-backend' && github.ref_name == 'delivery/alazzi-1847-session-f7b5fd83' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 27
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: real_estate_audit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d real_estate_audit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AQER_SOURCE_SHA }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Initialize disposable test credentials and database roles
        run: |
          test "$(git rev-parse HEAD)" = "$AQER_SOURCE_SHA"
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
          php artisan key:generate --force
          psql -h 127.0.0.1 -U postgres -d real_estate_audit -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: Exercise listing, support, notifications and discovery on SQLite
        run: >-
          php artisan test
          tests/Feature/PlatformNotificationHistoryTest.php
          tests/Feature/Stage11MessagingNotificationsApiTest.php
          tests/Feature/UatThreeRoleSupportWorkspaceApiTest.php
          tests/Feature/FinancialV1ApiTest.php
          tests/Feature/FinancialV1CompletionTest.php
          tests/Feature/BrokerExperienceApiTest.php
          tests/Feature/Phase3BuyerDiscoveryFavoritesApiTest.php
          tests/Feature/Stage5PropertyApiTest.php
          tests/Feature/BackgroundPreparationTest.php
          tests/Feature/DiscoverySearchQualityTest.php
          tests/Feature/SpokenSearchCityTest.php
          --display-warnings --fail-on-warning --fail-on-risky
      - name: Exercise the unified APIs and migrations on PostgreSQL/PostGIS
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: real_estate_audit
          DB_USERNAME: postgres
          DB_PASSWORD: ''
          DB_URL: ''
          DB_SEARCH_PATH: public,extensions
        run: >-
          php artisan test
          tests/Feature/PlatformNotificationHistoryTest.php
          tests/Feature/Stage11MessagingNotificationsApiTest.php
          tests/Feature/UatThreeRoleSupportWorkspaceApiTest.php
          tests/Feature/FinancialV1ApiTest.php
          tests/Feature/FinancialV1CompletionTest.php
          tests/Feature/BrokerExperienceApiTest.php
          tests/Feature/Phase3BuyerDiscoveryFavoritesApiTest.php
          tests/Feature/Stage5PropertyApiTest.php
          tests/Feature/BackgroundPreparationTest.php
          tests/Feature/DiscoverySearchQualityTest.php
          tests/Feature/SpokenSearchCityTest.php
          tests/Postgres/PropertyMarketContextPostgresTest.php
          --display-warnings --fail-on-warning --fail-on-risky

  verify-flutter:
    name: Analyze Flutter and exercise listing, finance, and support journeys
    if: ${{ github.repository == 'JJalal1/real-estate-uat-backend' && github.ref_name == 'delivery/alazzi-1847-session-f7b5fd83' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AQER_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the exact Flutter source
        run: test "$(git rev-parse HEAD)" = "$AQER_SOURCE_SHA"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve the approved package lock
        working-directory: mobile_app
        run: |
          # This manifest differs from UAT 1830 only by the Cairo font assets.
          test "$(git hash-object pubspec.yaml)" = '4583d88e975281d4d55c0622b48ae1249342d99c'
          git diff --exit-code fd832497768aac67fdd32485f2af835f273111c8 HEAD -- \
            pubspec.lock ../docs/ui-transplant-v3/pubspec_overrides.yaml
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          approved="$RUNNER_TEMP/aqer-approved-dependencies"
          git worktree add --detach --quiet "$approved" fd832497768aac67fdd32485f2af835f273111c8
          cp "$approved/docs/ui-transplant-v3/pubspec_overrides.yaml" "$approved/mobile_app/pubspec_overrides.yaml"
          python3 -B "$approved/scripts/verify_v3_dependency_lock.py" --resolved "$PWD/pubspec.lock" --approved-uat1829
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock --approved-uat1829
          flutter pub get --enforce-lockfile

      - name: Check Android map configuration and signing boundaries
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_uat_signing_configuration.py'
          cd mobile_app
          flutter test --no-pub test/app_theme_test.dart test/map_layers_test.dart test/phase04_ranked_search_test.dart \
            --dart-define=APP_ENVIRONMENT=uat --dart-define=AQER_GOOGLE_MAPS_UAT=true --reporter expanded
      - name: Analyze the exact Flutter source
        working-directory: mobile_app
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Test listing updates, sale/rent outcomes and broker activity
        working-directory: mobile_app
        run: >-
          flutter test --no-pub --reporter expanded
          test/broker_experience_ui_test.dart
          test/broker_activity_result_test.dart
          test/my_listings_layout_20261126_test.dart
          test/my_listings_pagination_test.dart
          test/private_tail_pagination_test.dart
          test/wave4_sai_consent_test.dart
          test/broker_messaging_handoff_test.dart
      - name: Test support tasks, financial dues and actionable notifications
        working-directory: mobile_app
        run: >-
          flutter test --no-pub --reporter expanded
          test/support_task_pagination_test.dart
          test/support_manager_agent_workflow_test.dart
          test/uat_notification_actions_test.dart
          test/phase4_notification_destination_test.dart
          test/phase5_notification_destination_test.dart
          test/message_inbox_pagination_test.dart
          test/platform_dues_payment_test.dart
          test/financial_v1_contract_test.dart
      - name: Test public discovery, favorites and prior listing history
        working-directory: mobile_app
        run: >-
          flutter test --no-pub --reporter expanded
          test/wave3_search_only_1393_test.dart
          test/home_location_entry_1820_test.dart
          test/home_dhamar_similar_cards_test.dart
          test/phase3_favorites_screen_test.dart
          test/phase23_favorite_recovery_test.dart
      - name: Test support visibility of dues
        working-directory: mobile_app
        run: >-
          flutter test --no-pub --reporter expanded
          test/owner_active_screen_states_test.dart
          --name 'support sees outstanding dues without a publishing restriction'

  verify-and-build:
    name: Build and verify the signed UAT installer
    needs: [verify-api, verify-flutter]
    permissions:
      contents: read
    if: ${{ github.repository == 'JJalal1/real-estate-uat-backend' && github.ref_name == 'delivery/alazzi-1847-session-f7b5fd83' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AQER_KURAIMI_ARTWORK_PATH: assets/payments/kuraimi.png
      AQER_KURAIMI_ARTWORK_SHA256: '0bfeac8f0a37c3951be2aa852cf86403a1d52c63d8207c9d8d1a784d3b2c194a'
      AQER_JAWALI_ARTWORK_PATH: assets/payments/jawali.png
      AQER_JAWALI_ARTWORK_SHA256: '5288ea4552ee477d6418f03692982ca0eb2adaf31bf600b9d387e0481367f66e'
      AQER_HOME_ASSISTANT_ASSET_PATH: assets/brand/home-smart-assistant.webp
      AQER_HOME_ASSISTANT_ASSET_SHA256: '0fd0d4726de99e45609a1ed94f76756f7abdb2616c683b97d52dbedd7117617a'
      AQER_SIGNING_ENVIRONMENT: uat
      AQER_VERIFIED_FIREBASE_FINGERPRINT: '716a458274e8e131530269d9a5196cf6bd3e3bc9d231f3c0c415870d0b1dc79a'
      AQER_ALLOW_DEBUG_RELEASE_SIGNING: 'false'
      ORG_GRADLE_PROJECT_AQER_UAT_APPLICATION_ID: com.aqer.yemen.uat.offline
      ORG_GRADLE_PROJECT_AQER_UAT_APP_NAME: عقار أوفلاين اختبار
      ORG_GRADLE_PROJECT_AQER_UAT_COMPRESS_NATIVE_LIBS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AQER_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and protect approved UAT 1845 mobile inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AQER_SOURCE_SHA"
          baseline=8b5ad43b62afab42bd4dbc10cd0bd1ed3e5b6308
          if [ "$AQER_BUILD" = 1847 ]; then
            baseline=c5c9ec1a50ddd41fcc8c0d1f88a48dd66986d44a
            git diff --exit-code "$baseline" HEAD -- docs/PUBLIC_UAT_DELIVERY.json .github/uat-apk-recipient.pem scripts/prepare_phase1_close.py
          fi
          kuraimi="mobile_app/$AQER_KURAIMI_ARTWORK_PATH"
          jawali="mobile_app/$AQER_JAWALI_ARTWORK_PATH"
          git merge-base --is-ancestor "$baseline" HEAD
          git diff --exit-code "$baseline" HEAD -- docs/uat-signing-identity.json \
            mobile_app/android mobile_app/ios mobile_app/pubspec.yaml mobile_app/pubspec.lock \
            mobile_app/assets scripts/import_ci_uat_firebase.py
          printf '%s  %s\n' 'b94d32f369e40254381cc6320fe911a41e015441ec89ca94d2b54ab493656790' scripts/import_ci_uat_signing.py \
            | sha256sum --check --strict
          test -f "$kuraimi" && test ! -L "$kuraimi"
          test -f "$jawali" && test ! -L "$jawali"
          printf '%s  %s\n' \
            "$AQER_HOME_ASSISTANT_ASSET_SHA256" "mobile_app/$AQER_HOME_ASSISTANT_ASSET_PATH" \
            "$AQER_KURAIMI_ARTWORK_SHA256" "$kuraimi" "$AQER_JAWALI_ARTWORK_SHA256" "$jawali" \
            | sha256sum --check --strict
      - name: Verify and import the approved Firebase Android configuration
        env:
          AQER_UAT_OFFLINE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.AQER_UAT_OFFLINE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$AQER_UAT_OFFLINE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo 'The Firebase Android configuration is not available to this workflow.'
            exit 1
          fi
          python3 -B scripts/import_ci_uat_firebase.py --package com.aqer.yemen.uat.offline
          python3 -B - <<'PY'
          import os
          from pathlib import Path

          properties = Path('mobile_app/android/firebase-uat.properties').read_text().splitlines()
          assert 'aqer.uat.firebase.enabled=true' in properties, 'Firebase is disabled for the Android client'
          assert 'aqer.uat.firebase.packageName=com.aqer.yemen.uat.offline' in properties, 'Firebase package mismatch'
          expected = 'aqer.uat.firebase.fingerprint=' + os.environ['AQER_VERIFIED_FIREBASE_FINGERPRINT']
          assert expected in properties, 'Firebase configuration differs from the reviewed configuration'
          print('The approved Firebase project, Android package and configuration fingerprint match.')
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve the approved package lock
        working-directory: mobile_app
        run: |
          # This manifest differs from UAT 1830 only by the Cairo font assets.
          test "$(git hash-object pubspec.yaml)" = '4583d88e975281d4d55c0622b48ae1249342d99c'
          git diff --exit-code fd832497768aac67fdd32485f2af835f273111c8 HEAD -- \
            pubspec.lock ../docs/ui-transplant-v3/pubspec_overrides.yaml
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          approved="$RUNNER_TEMP/aqer-approved-dependencies"
          git worktree add --detach --quiet "$approved" fd832497768aac67fdd32485f2af835f273111c8
          cp "$approved/docs/ui-transplant-v3/pubspec_overrides.yaml" "$approved/mobile_app/pubspec_overrides.yaml"
          python3 -B "$approved/scripts/verify_v3_dependency_lock.py" --resolved "$PWD/pubspec.lock" --approved-uat1829
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock --approved-uat1829
          flutter pub get --enforce-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Restore the reviewed public Gradle cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: aqer-phase1-public-gradle-v1-${{ runner.os }}-jdk17-flutter3273-api36-ad06237b7aceaaba2ea4833b822d61753244af41-${{ hashFiles('mobile_app/pubspec.lock', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties', 'mobile_app/android/settings.gradle*', 'mobile_app/android/build.gradle*', 'docs/ui-transplant-v3/pubspec_overrides.yaml') }}
          restore-keys: aqer-phase1-public-gradle-v1-${{ runner.os }}-jdk17-flutter3273-api36-ad06237b7aceaaba2ea4833b822d61753244af41-
      - name: Import the approved UAT signer
        env:
          AQER_UAT_KEYSTORE_BASE64: ${{ secrets.AQER_UAT_KEYSTORE_BASE64 }}
          AQER_RELEASE_STORE_PASSWORD: ${{ secrets.AQER_RELEASE_STORE_PASSWORD }}
          AQER_RELEASE_KEY_ALIAS: ${{ secrets.AQER_RELEASE_KEY_ALIAS }}
          AQER_RELEASE_KEY_PASSWORD: ${{ secrets.AQER_RELEASE_KEY_PASSWORD }}
          AQER_UAT_SIGNING_CERT_SHA256: ${{ secrets.AQER_UAT_SIGNING_CERT_SHA256 }}
        run: python3 -B scripts/import_ci_uat_signing.py --required
      - name: Assemble the signed Android candidate
        working-directory: mobile_app
        env:
          AQER_RELEASE_STORE_PASSWORD: ${{ secrets.AQER_RELEASE_STORE_PASSWORD }}
          AQER_RELEASE_KEY_ALIAS: ${{ secrets.AQER_RELEASE_KEY_ALIAS }}
          AQER_RELEASE_KEY_PASSWORD: ${{ secrets.AQER_RELEASE_KEY_PASSWORD }}
          AQER_UAT_GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.AQER_UAT_GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          if [ -z "$AQER_UAT_GOOGLE_MAPS_ANDROID_KEY" ]; then
            echo "The UAT Android Maps credential is missing."
            exit 1
          fi
          flutter build apk --no-pub --flavor uat --release --build-number="$AQER_BUILD" \
            --target-platform=android-arm64 \
            --dart-define=APP_ENVIRONMENT=uat --dart-define=APP_BUILD_NUMBER="$AQER_BUILD" \
            --dart-define=APP_PACKAGE_ID=com.aqer.yemen.uat.offline \
            --dart-define=API_BASE_URL=https://real-estate-uat-api-frankfurt.onrender.com/api \
            --dart-define=APP_SHARE_BASE_URL=https://real-estate-uat-api-frankfurt.onrender.com \
            --dart-define=AQER_GOOGLE_MAPS_UAT=true --dart-define=AQER_RANKED_DISCOVERY=true --dart-define=AQER_MAP_SEARCH_TRACE=true
      - name: Verify the APK, restricted Maps configuration and bundled classifier
        env:
          AQER_UAT_GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.AQER_UAT_GOOGLE_MAPS_ANDROID_KEY }}
        run: |
          set -euo pipefail
          mkdir uat-installer
          apk="uat-installer/AQER-UAT-$AQER_BUILD-Alazzi-ARM64.apk"
          cp mobile_app/build/app/outputs/flutter-apk/app-uat-release.apk "$apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          badging="$("$tools/aapt" dump badging "$apk")"
          grep -F "package: name='com.aqer.yemen.uat.offline' versionCode='$AQER_BUILD'" <<< "$badging"
          grep -Eq "^native-code: 'arm64-v8a'[[:space:]]*$" <<< "$badging"
          certs="$("$tools/apksigner" verify --print-certs "$apk")"
          export SIGNER_SHA256="$(awk -F ': ' '/^Signer #1 certificate SHA-256 digest:/ {print $2}' <<< "$certs")"
          export SIGNER_SHA1="$(awk -F ': ' '/^Signer #1 certificate SHA-1 digest:/ {print $2}' <<< "$certs")"
          python3 - "$apk" "$tools/aapt" <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from phase23_firebase import verify_compiled_configuration
          from prepare_uat_firebase import OFFLINE_PACKAGE

          apk = Path(sys.argv[1])
          identity = json.loads(Path("docs/uat-signing-identity.json").read_text())
          assert identity["approved_for_delivery"] and identity["github_secret_storage_verified"]
          assert os.environ["SIGNER_SHA256"] == identity["certificate_sha256"]
          assert os.environ["SIGNER_SHA1"] == "8716d831c2102bd72dd8c90b18b19b5acaa25ad4", "APK signer differs from the Android Maps restriction"
          maps_key = os.environ["AQER_UAT_GOOGLE_MAPS_ANDROID_KEY"]
          manifest = subprocess.check_output([sys.argv[2], "dump", "xmltree", str(apk), "AndroidManifest.xml"], text=True)
          entries = re.split(r"(?m)^ +E: ", manifest)
          assert maps_key and any(
              entry.startswith("meta-data ") and '"com.google.android.geo.API_KEY"' in entry
              and any("android:value" in line and ('="' + maps_key + '"') in line for line in entry.splitlines())
              for entry in entries
          ), "APK is missing its configured Android Maps credential"
          model = "assets/mlkit_label_default_model/mobile_ica_8bit_with_metadata_tflite"
          abis = ("arm64-v8a",)
          payment_artwork = [
              {"path": os.environ[f"AQER_{name}_ARTWORK_PATH"],
               "sha256": os.environ[f"AQER_{name}_ARTWORK_SHA256"]}
              for name in ("KURAIMI", "JAWALI")
          ]
          with zipfile.ZipFile(apk) as contents:
              for artwork in payment_artwork:
                  source = Path("mobile_app", artwork["path"]).read_bytes()
                  bundled = contents.read("assets/flutter_assets/" + artwork["path"])
                  assert bundled == source, artwork["path"]
                  assert bundled.startswith(b"\x89PNG\r\n\x1a\n"), artwork["path"]
                  assert hashlib.sha256(bundled).hexdigest() == artwork["sha256"], artwork["path"]
                  artwork["bundled_verified"] = True
              assistant_asset = os.environ["AQER_HOME_ASSISTANT_ASSET_PATH"]
              assistant_digest = os.environ["AQER_HOME_ASSISTANT_ASSET_SHA256"]
              bundled_assistant = contents.read("assets/flutter_assets/" + assistant_asset)
              assert hashlib.sha256(bundled_assistant).hexdigest() == assistant_digest
              assert bundled_assistant == Path("mobile_app", assistant_asset).read_bytes()
              for weight in ("Regular", "Medium", "SemiBold", "Bold", "ExtraBold"):
                  asset = "assets/fonts/Cairo-" + weight + ".ttf"
                  bundled = contents.read("assets/flutter_assets/" + asset)
                  assert bundled == Path("mobile_app", asset).read_bytes(), weight
              actual_abis = {
                  entry.filename.split("/")[1]
                  for entry in contents.infolist()
                  if entry.filename.startswith("lib/") and not entry.is_dir()
              }
              assert actual_abis == set(abis), actual_abis
              assert hashlib.sha256(contents.read(model)).hexdigest() == "4afa3970d3efd6726d147d505e28c7ff1e4fe1c24be7bcda6b5429eb099777a5"
              for abi in abis:
                  for lib in ("libflutter.so", "libapp.so"):
                      assert contents.getinfo(f"lib/{abi}/{lib}").compress_type == zipfile.ZIP_DEFLATED
                  assert b"https://real-estate-uat-api-frankfurt.onrender.com/api" in contents.read(f"lib/{abi}/libapp.so")
              firebase = verify_compiled_configuration(
                  contents, Path("mobile_app/android/firebase-uat.properties"), package=OFFLINE_PACKAGE,
              )
          assert firebase["client_configured"] and firebase["client_push_enabled"]
          assert firebase["compiled_configuration_verified"]
          assert firebase["config_fingerprint"] == os.environ["AQER_VERIFIED_FIREBASE_FINGERPRINT"]
          receipt = {
              "branch": os.environ["GITHUB_REF_NAME"],
              "size_baseline_build": 1845,
              "bytes_baseline": 25938100,
              "cairo_fonts_verified": True,
              "assistant_asset": {"path": assistant_asset, "sha256": assistant_digest, "bundled_verified": True},
              "payment_artwork": payment_artwork,
              "api_base_url": "https://real-estate-uat-api-frankfurt.onrender.com/api",
              "source": os.environ["AQER_SOURCE_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "package": "com.aqer.yemen.uat.offline",
              "build": int(os.environ["AQER_BUILD"]),
              "certificate_sha256": identity["certificate_sha256"],
              "bytes": apk.stat().st_size,
              "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              "abis": abis,
              "google_maps_android_configured": True,
              "firebase": firebase,
          }
          (apk.parent / "APK_VERIFICATION.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt))
          PY
      - name: Remove temporary signing and Firebase configuration
        if: always()
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          Path("mobile_app/android/firebase-uat.properties").unlink(missing_ok=True)
          folder = Path(os.environ["RUNNER_TEMP"]) / "aqer-uat-signing"
          (folder / "uat-release.keystore").unlink(missing_ok=True)
          PY
      - name: Check the exact installer and verification receipt for upload
        run: |
          set -euo pipefail
          cd uat-installer
          apk="AQER-UAT-$AQER_BUILD-Alazzi-ARM64.apk"
          jq -e --argjson build "$AQER_BUILD" --arg source "$AQER_SOURCE_SHA" '.source == $source and .build == $build and .abis == ["arm64-v8a"]' APK_VERIFICATION.json >/dev/null
          printf '%s  %s\n' "$(jq -r .sha256 APK_VERIFICATION.json)" "$apk" | sha256sum --check --strict
      - name: Seal the public-repository installer for the approved recipient
        if: github.event.repository.private == false
        run: |
          python3 -B - <<'PYTHON'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from prepare_phase1_close import encrypt

          policy = json.loads(Path("docs/PUBLIC_UAT_DELIVERY.json").read_text())
          assert policy["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert policy["visibility"] == "public" and policy["apk_delivery"] == "recipient-encrypted-cms-only"
          assert policy["plaintext_public_artifacts"] is False
          recipient = Path(policy["recipient_certificate"])
          assert not recipient.is_symlink() and hashlib.sha256(recipient.read_bytes()).hexdigest() == policy["recipient_sha256"]
          sealed = Path("uat-sealed")
          sealed.mkdir(mode=0o700)
          original = Path("uat-installer")
          receipt = json.loads((original / "APK_VERIFICATION.json").read_text())
          apk = original / f"AQER-UAT-{receipt['build']}-Alazzi-ARM64.apk"
          receipt["encrypted_installer"] = encrypt(apk, sealed / "installer.cms", recipient)
          receipt["recipient_sha256"] = policy["recipient_sha256"]
          (sealed / "APK_VERIFICATION.json").write_text(json.dumps(receipt, indent=2))
          PYTHON
      - name: Upload recipient-encrypted installer and receipt
        if: github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: AQER-UAT-${{ env.AQER_BUILD }}-sealed-${{ github.run_attempt }}
          path: |
            uat-sealed/installer.cms
            uat-sealed/APK_VERIFICATION.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Seal the verified installer for the owner-approved one-time delivery
        env:
          CHAT_CERT_B64: 
          CHAT_CERT_SHA256: e7e2ad95bc3bba596bc0fd565b1cb99b6357bdf573a77346894009c9d332cc0c
        run: |
          python3 -B - <<'PYTHON'
          import base64, hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from prepare_phase1_close import encrypt

          cert = Path(os.environ["RUNNER_TEMP"]) / "delivery-recipient.pem"
          cert.write_bytes(base64.b64decode(os.environ["CHAT_CERT_B64"], validate=True))
          assert hashlib.sha256(cert.read_bytes()).hexdigest() == os.environ["CHAT_CERT_SHA256"]
          input_dir = Path("uat-installer")
          receipt = json.loads((input_dir / "APK_VERIFICATION.json").read_text())
          assert receipt["build"] == 1847 and receipt["source"] == os.environ["AQER_SOURCE_SHA"]
          apk = input_dir / "AQER-UAT-1847-Alazzi-ARM64.apk"
          assert apk.stat().st_size == receipt["bytes"] and hashlib.sha256(apk.read_bytes()).hexdigest() == receipt["sha256"]
          output = Path("chat-sealed")
          output.mkdir(mode=0o700)
          receipt["encrypted_installer"] = encrypt(apk, output / "installer.cms", cert)
          receipt["recipient_sha256"] = os.environ["CHAT_CERT_SHA256"]
          (output / "APK_VERIFICATION.json").write_text(json.dumps(receipt, indent=2))
          PYTHON
      - name: Upload the temporary encrypted delivery
        uses: actions/upload-artifact@v4
        with:
          name: AQER-UAT-1847-private-chat
          path: |
            chat-sealed/installer.cms
            chat-sealed/APK_VERIFICATION.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
