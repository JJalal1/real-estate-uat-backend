name: Phase1 focused closeout build
on:
  push:
    # Temporary task activation; remove before any product merge.
    branches: [work/phase1-close-20261103]
permissions:
  contents: read
concurrency:
  group: phase1-close-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_COMMIT: ${{ github.sha }}
  AQER_PHASE1_CLOSE: 'true'
  UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api
jobs:
  regression:
    if: github.repository == 'JJalal1/real-estate-uat-backend' && github.ref == 'refs/heads/work/phase1-close-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Guard scoped source and current public recipient
        run: python3 -B scripts/prepare_phase1_close.py --source-only
      - name: Packaging safety tests
        run: python3 -B -m unittest discover -s scripts/tests -p test_phase1_close.py -v
      - name: Set up PHP8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install locked backend dependencies in disposable test environment
        working-directory: backend-api-runtime
        run: |
          set -euo pipefail
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate --force
      - name: Witness the old unit proposal failure and restore candidate bytes
        run: python3 -B scripts/prepare_phase1_close.py --red-control
      - name: Run affected broker assistant regressions
        working-directory: backend-api-runtime
        run: php artisan test --filter=BrokerListingAssistantTest --display-warnings --fail-on-warning --fail-on-risky
      - name: Upload sanitized old-source regression witness
        uses: actions/upload-artifact@v4
        with:
          name: phase1-close-regression-${{ github.run_id }}
          path: phase1-close-regression/RED_CONTROL.json
          retention-days: 3
          if-no-files-found: error
  release:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Guard scoped source and unchanged mobile component
        run: python3 -B scripts/prepare_phase1_close.py --source-only
      - name: Set up Java17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up pinned Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Set up pinned Flutter3.27.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve the accepted locked dependency graph
        working-directory: mobile_app
        run: |
          set -euo pipefail
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml
      - name: Build release for local native acceptance
        working-directory: mobile_app
        env:
          AQER_ALLOW_DEBUG_RELEASE_SIGNING: 'true'
          AQER_PHASE1_RELEASE_UI_TEST: 'true'
        run: |
          set -euo pipefail
          task_version=$((1464 + GITHUB_RUN_NUMBER))
          flutter build apk --flavor uat --release --build-number="$task_version" \
            --dart-define=APP_BUILD_NUMBER="$task_version" \
            --dart-define=APP_ENVIRONMENT=uat --dart-define=API_BASE_URL="$UAT_API_BASE_URL"
      - name: Verify release and self-targeted helper then encrypt to current recipient
        run: python3 -B scripts/prepare_phase1_close.py
      - name: Upload ciphertext and safe identity only
        uses: actions/upload-artifact@v4
        with:
          name: phase1-close-encrypted-${{ github.run_id }}
          path: |
            phase1-close-encrypted/target.cms
            phase1-close-encrypted/input.cms
            phase1-close-encrypted/APK_VERIFICATION.json
          retention-days: 3
          if-no-files-found: error
