name: Phase04 maps and ranked search
on:
  push:
    branches: [work/phase04-maps-search-20261117]
    paths: ['mobile_app/**', 'backend-api-runtime/**', 'scripts/verify_phase04_apk.py', '.github/workflows/phase04-maps-search.yml']
  pull_request:
    types: [synchronize]
    branches: [work/apk-cleanup-1817-20261117]
    paths: ['mobile_app/**', 'backend-api-runtime/**', '.github/workflows/phase04-maps-search.yml']
permissions:
  contents: read
concurrency:
  group: phase04-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Ranked discovery on ${{ matrix.database }}
    if: github.event_name == 'push' || (github.event.number == 193 && github.head_ref == 'work/map-search-ux-1820-20261117' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: phase04_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d phase04_test" --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend-api-runtime
    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'phase04_test' }}
      DB_USERNAME: postgres
      DB_PASSWORD: ''
      DB_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath,curl,dom,exif,fileinfo,gd,intl,mbstring,pdo_sqlite,sqlite3,pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Disposable test environment
        run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
          php artisan key:generate --force
      - name: Prepare roles for original migration chain
        if: matrix.database == 'pgsql'
        run: psql -h 127.0.0.1 -U postgres -d phase04_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: New ranking, boundary, paging and visibility contracts
        run: php artisan test tests/Feature/Phase04RankedDiscoveryTest.php tests/Feature/Phase04GovernoratesTest.php tests/Feature/Phase04RegionalFixturesTest.php tests/Feature/UatCityDemoSeedTest.php tests/Feature/Wave3MarketplacePurposeTest.php tests/Feature/Wave3MarketplaceApiTest.php --display-warnings --fail-on-warning --fail-on-risky
      - name: Small affected search regression
        run: php artisan test tests/Feature/DiscoverySearchQualityTest.php tests/Feature/SpokenSearchCityTest.php tests/Feature/Wave01SharedFiltersTest.php --display-warnings --fail-on-warning --fail-on-risky
  mobile:
    name: Flutter ranked search contracts
    if: github.event_name == 'push' || (github.event.number == 193 && github.head_ref == 'work/map-search-ux-1820-20261117' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve original locked dependencies
        working-directory: mobile_app
        env:
          AQER_CLEANUP_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python3 ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock --cleanup1818
          else
            python3 ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          fi
      - name: Strict analysis
        working-directory: mobile_app
        run: python3 ../scripts/check_v3_analysis.py
      - name: New ranked results and existing affected map contracts
        working-directory: mobile_app
        run: |
          tests=(test/phase04_ranked_search_test.dart test/phase04_governorates_test.dart test/current_wave_contract_test.dart
            test/property_marker_cluster_test.dart test/map_dynamic_filters_1430_test.dart
            test/smart_search_pagination_recovery_test.dart test/public_discovery_cancellation_test.dart)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            tests+=(test/uat1822_ranked_map_entry_test.dart test/map_search_layout_1820_test.dart
              test/wave2_home_search_test.dart test/broker_saved_search_navigation_test.dart)
          fi
          flutter test "${tests[@]}" --reporter expanded --timeout 2m
      - uses: actions/setup-java@v4
        if: github.event_name == 'push'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: github.event_name == 'push'
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Reuse existing reviewed public Gradle dependencies
        if: github.event_name == 'push'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: aqer-phase1-public-gradle-v1-${{ runner.os }}-jdk17-flutter3273-api36-ad06237b7aceaaba2ea4833b822d61753244af41-${{ hashFiles('mobile_app/pubspec.lock', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties', 'mobile_app/android/settings.gradle*', 'mobile_app/android/build.gradle*', 'docs/ui-transplant-v3/pubspec_overrides.yaml') }}
      - name: Build separate Phase04 phone candidate
        if: github.event_name == 'push'
        working-directory: mobile_app
        env:
          AQER_ALLOW_DEBUG_RELEASE_SIGNING: 'true'
          ORG_GRADLE_PROJECT_AQER_UAT_APPLICATION_ID: com.aqer.yemen.uat.phase04
          ORG_GRADLE_PROJECT_AQER_UAT_APP_NAME: عقار خرائط اختبار
        run: >-
          flutter build apk --flavor uat --release --build-number=1814
          --dart-define=APP_ENVIRONMENT=uat
          --dart-define=APP_BUILD_NUMBER=1814
          --dart-define=APP_PACKAGE_ID=com.aqer.yemen.uat.phase04
          --dart-define=API_BASE_URL=https://real-estate-uat-api-frankfurt.onrender.com/api
          --dart-define=APP_SHARE_BASE_URL=https://real-estate-uat-api-frankfurt.onrender.com
          --dart-define=AQER_RANKED_DISCOVERY=true
      - name: Verify actual APK identity, signer, source and 16KB packaging
        if: github.event_name == 'push'
        run: python3 scripts/verify_phase04_apk.py
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'push' && github.event.repository.private
        with:
          name: phase04-private-candidate-${{ github.sha }}
          path: mobile_app/phase04-proof/
          retention-days: 14
          if-no-files-found: error
