name: Temporary GM v2 runtime sync

on:
  push:
    branches:
      - uat/general-manager-command-center-v2-runtime

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: uat/general-manager-command-center-v2-runtime
          fetch-depth: 0
      - name: Sync reviewed backend commits
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for sha in b7c2ab07687b2f189d4322acc8a08e01e41ec8b3 d5bf82c5e4330ee21d0c75fe5359585f8c056046 70ec9096afbd3f090db5392c21abe1e2f111809d c9cfabd480fb1386af0e7be991f4931896b3a6d9; do
            git fetch origin "$sha"
            if git merge-base --is-ancestor "$sha" HEAD; then
              echo "$sha already present"
            else
              git cherry-pick "$sha"
            fi
          done
          git push origin HEAD:uat/general-manager-command-center-v2-runtime
