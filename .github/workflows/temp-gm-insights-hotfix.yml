name: Temporary GM insights table-name hotfix

on:
  push:
    branches:
      - hotfix/gm-insights-uat-table-names

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix/gm-insights-uat-table-names
          fetch-depth: 0
      - name: Patch canonical journey table names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend-api-runtime/app/Http/Controllers/Api/GeneralManagerInsightsController.php')
          s = p.read_text()
          replacements = {
              '(SELECT COUNT(*) FROM conversations) conversations,': '(SELECT COUNT(*) FROM message_threads) conversations,',
              '(SELECT COUNT(*) FROM agreements) agreements,': '(SELECT COUNT(*) FROM property_agreements) agreements,',
              "'conversations'=>Schema::hasTable('conversations')?DB::table('conversations')->count():null": "'conversations'=>Schema::hasTable('message_threads')?DB::table('message_threads')->count():null",
              "'agreements'=>Schema::hasTable('agreements')?DB::table('agreements')->count():null": "'agreements'=>Schema::hasTable('property_agreements')?DB::table('property_agreements')->count():null",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected pattern: {old}')
              s = s.replace(old, new)
          p.write_text(s)

          t = Path('backend-api-runtime/tests/Feature/GeneralManagerInsightsSchemaContractTest.php')
          t.write_text("""<?php

namespace Tests\\Feature;

use Tests\\TestCase;

class GeneralManagerInsightsSchemaContractTest extends TestCase
{
    public function test_general_manager_insights_use_canonical_journey_tables(): void
    {
        $source = file_get_contents(app_path('Http/Controllers/Api/GeneralManagerInsightsController.php'));

        $this->assertStringContainsString('FROM message_threads', $source);
        $this->assertStringContainsString('FROM property_agreements', $source);
        $this->assertStringContainsString("Schema::hasTable('message_threads')", $source);
        $this->assertStringContainsString("Schema::hasTable('property_agreements')", $source);
        $this->assertStringNotContainsString('FROM conversations)', $source);
        $this->assertStringNotContainsString('FROM agreements)', $source);
    }
}
""")
          PY
      - name: Commit focused hotfix
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-api-runtime/app/Http/Controllers/Api/GeneralManagerInsightsController.php backend-api-runtime/tests/Feature/GeneralManagerInsightsSchemaContractTest.php
          git commit -m "Fix General Manager journey table names"
          git push origin HEAD:hotfix/gm-insights-uat-table-names
