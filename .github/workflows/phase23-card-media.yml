name: Phase23 owned listing photo count
on:
  push:
    branches: [work/phase23-acceptance-20261111]
    paths:
      - .github/workflows/phase23-card-media.yml
      - mobile_app/lib/features/properties/presentation/my_listings_screen.dart
      - mobile_app/test/private_listing_card_photo_test.dart
permissions:
  contents: read
jobs:
  card-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve the existing approved dependencies
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Analyze the affected card and its real UI regression
        working-directory: mobile_app
        run: flutter analyze --fatal-infos lib/features/properties/presentation/my_listings_screen.dart test/private_listing_card_photo_test.dart
      - name: Verify physical photo count and preserved private-media boundaries
        working-directory: mobile_app
        run: flutter test --no-pub test/private_listing_card_photo_test.dart
