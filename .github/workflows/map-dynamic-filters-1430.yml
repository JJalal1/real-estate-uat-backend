name: Map dynamic filters on 1430
on:
  push:
    branches: [work/map-dynamic-filters-*]
permissions:
  contents: read
concurrency:
  group: map-filters-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Protect the accepted 1430 components
        run: python3 -B scripts/verify_map_filters_1430.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Existing locked dependencies
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Strict analysis without new diagnostics
        working-directory: mobile_app
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Dynamic controls, polygon, assistant and retained search regressions
        working-directory: mobile_app
        run: |
          flutter test --reporter expanded test/map_dynamic_filters_1430_test.dart test/wave2_home_search_test.dart test/wave3_search_only_1393_test.dart test/public_discovery_cancellation_test.dart test/smart_search_pagination_recovery_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-filters-1430-previews-${{ github.run_number }}
          path: mobile_app/build/owner-ux-preview/map-filters-1430-*.png
          if-no-files-found: warn
          retention-days: 7
