name: Temporary UAT Persistent DB Probe

# Second run intentionally repeats the identical probe after Apache workers have established persistent DB connections.
on:
  push:
    branches:
      - ops/uat-persistent-db-probe
    paths:
      - '.github/workflows/uat-persistent-db-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Health and concurrent nearby probe
        shell: bash
        env:
          UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api
        run: |
          set -euo pipefail
          health_url="${UAT_API_BASE_URL%/api}/api/health"
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 30 "$health_url")"
          printf '%s' "$response" > /tmp/health.json
          python3 - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('status') == 'ok', data
          assert data.get('database') is True, data
          assert data.get('postgis') is True, data
          print('HEALTH_BEFORE=OK')
          PY

          endpoint="${UAT_API_BASE_URL}/properties/nearby?latitude=15.3694&longitude=44.1910&radius_km=30"
          rm -rf /tmp/probe && mkdir -p /tmp/probe
          export endpoint
          seq 1 40 | xargs -P 20 -I{} bash -c '
            i="$1"
            curl --fail --silent --show-error --max-time 30 \
              -o "/tmp/probe/body-${i}.json" \
              -w "%{http_code} %{time_total}\n" \
              "$endpoint" > "/tmp/probe/result-${i}.txt"
          ' _ {}

          python3 - <<'PY'
          import glob, json, math
          from pathlib import Path
          rows=[]
          for path in sorted(glob.glob('/tmp/probe/result-*.txt')):
              code, total = Path(path).read_text().strip().split()
              rows.append((int(code), float(total)))
          assert len(rows) == 40, len(rows)
          assert all(code == 200 for code, _ in rows), rows
          for body in glob.glob('/tmp/probe/body-*.json'):
              payload=json.loads(Path(body).read_text())
              assert isinstance(payload.get('data'), list), payload
          times=sorted(t for _, t in rows)
          def percentile(q):
              idx=max(0, min(len(times)-1, math.ceil(len(times)*q)-1))
              return times[idx]
          print('REQUESTS=40/40_HTTP_200')
          print(f'P50_SECONDS={percentile(0.50):.3f}')
          print(f'P95_SECONDS={percentile(0.95):.3f}')
          print(f'MAX_SECONDS={max(times):.3f}')
          PY

          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 "$health_url")"
          printf '%s' "$response" > /tmp/health-after.json
          python3 - <<'PY'
          import json
          with open('/tmp/health-after.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('status') == 'ok', data
          assert data.get('database') is True, data
          assert data.get('postgis') is True, data
          print('HEALTH_AFTER=OK')
          PY
