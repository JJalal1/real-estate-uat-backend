name: Temporary GM v2 patch

on:
  push:
    branches:
      - admin/general-manager-command-center-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: admin/general-manager-command-center-v2
          fetch-depth: 0
      - name: Apply focused GM v2 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile_app/lib/features/admin/presentation/general_manager_pages.dart')
          s = p.read_text()
          s = s.replace("import '../../account/presentation/access_control_screen.dart';", "import 'general_manager_accounts_screen.dart';")
          s = s.replace("onTap: () => Navigator.of(context).push(MaterialPageRoute<void>(builder: (_) => const AccessControlScreen())),", "onTap: () => Navigator.of(context).push(MaterialPageRoute<void>(builder: (_) => const GeneralManagerAccountsScreen())),")
          s = s.replace("if (_insights == null) _insights = futures[index++] as GeneralManagerInsights;", "_insights ??= futures[index++] as GeneralManagerInsights;")
          p.write_text(s)
          t = Path('mobile_app/test/uat_three_role_workspaces_test.dart')
          ts = t.read_text()
          ts = ts.replace("expect(pages, contains('الحسابات والأدوار والصلاحيات'));", "expect(pages, contains('الحسابات والأدوار والصلاحيات'));\n    expect(pages, contains('GeneralManagerAccountsScreen'));\n    expect(pages, contains('general_manager_accounts_screen.dart'));")
          t.write_text(ts)
          PY
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile_app/lib/features/admin/presentation/general_manager_pages.dart mobile_app/test/uat_three_role_workspaces_test.dart
          git commit -m "Fix GM map lint and wire friendly account directory"
          git push origin HEAD:admin/general-manager-command-center-v2
