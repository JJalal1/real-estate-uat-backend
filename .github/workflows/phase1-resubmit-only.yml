name: Phase1 Android correction and resend
on:
  push:
    branches: [test/phase1-correction-20261106]
    paths:
      - '.github/workflows/phase1-resubmit-only.yml'
      - 'scripts/phase1_resubmit_only.py'
permissions:
  contents: read
concurrency:
  group: phase1-resubmit-only
  cancel-in-progress: false
env:
  AQER_PHASE1_NATIVE_ACCOUNT: 'true'
  AQER_PHASE1_RESUBMIT_ONLY: 'true'
  SOURCE_COMMIT: ${{ github.sha }}
  UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api
jobs:
  resubmit:
    if: github.repository == 'JJalal1/real-estate-uat-backend' && github.ref == 'refs/heads/test/phase1-correction-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify source and authorized test access
        env:
          AQER_PHASE1_TEST_ACCESS_JSON: ${{ secrets.AQER_PHASE1_TEST_ACCESS_JSON }}
        run: |
          set -euo pipefail
          python3 -B scripts/prepare_phase1_native_account.py --source-only
          test -c /dev/kvm
          python3 -B - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from phase1_native_account_readiness import SECRET_NAME, validate_access
          try:
              assert 'support' in validate_access(os.environ.get(SECRET_NAME, ''))['phones']
          except Exception:
              raise SystemExit('AUTHORIZED_BROKER_AND_SUPPORT_ACCESS_REQUIRED') from None
          PY
          curl --fail --silent --show-error --retry 2 --retry-delay 4 --retry-connrefused \
            --connect-timeout 8 --max-time 45 --output /dev/null "$UAT_API_BASE_URL/health"
          printf 'GRADLE_USER_HOME=%s\n' "$RUNNER_TEMP/aqer-native-account-gradle" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Prepare the pinned dependency graph
        working-directory: mobile_app
        run: |
          set -euo pipefail
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml
      - name: Restore public build dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
          key: aqer-phase1-public-gradle-v1-${{ runner.os }}-jdk17-flutter3273-api36-ad06237b7aceaaba2ea4833b822d61753244af41-${{ hashFiles('mobile_app/pubspec.lock', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties', 'mobile_app/android/settings.gradle*', 'mobile_app/android/build.gradle*', 'docs/ui-transplant-v3/pubspec_overrides.yaml') }}
      - name: Build the verified mobile source for this disposable emulator
        working-directory: mobile_app
        env:
          AQER_ALLOW_DEBUG_RELEASE_SIGNING: 'true'
          AQER_PHASE1_RELEASE_UI_TEST: 'true'
        run: |
          flutter build apk --flavor uat --release --build-number=1554 \
            --dart-define=APP_BUILD_NUMBER=1554 --dart-define=APP_ENVIRONMENT=uat \
            --dart-define=API_BASE_URL="$UAT_API_BASE_URL"
      - name: Verify APK and prepare one Android API 36 KVM image
        run: |
          set -euo pipefail
          test -c /dev/kvm
          python3 -m pip install --disable-pip-version-check Pillow==12.3.0
          python3 -B scripts/prepare_phase1_native_account.py
          sdkmanager --install 'emulator' 'system-images;android-36;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/aqer-native-account-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --force --name aqer-native-account --device pixel \
            --path "$ANDROID_AVD_HOME/aqer-native-account.avd" \
            --package 'system-images;android-36;google_apis;x86_64'
          python3 - "$ANDROID_AVD_HOME/aqer-native-account.avd/config.ini" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          selected = {'hw.lcd.width': '540', 'hw.lcd.height': '960',
                      'hw.lcd.density': '210', 'showDeviceFrame': 'no'}
          lines = [line for line in path.read_text().splitlines()
                   if line.split('=', 1)[0].strip() not in selected]
          path.write_text('\n'.join(lines + [key + '=' + value for key, value in selected.items()]) + '\n')
          PY
          sudo chmod 666 /dev/kvm
          printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\n' \
            "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
      - name: Save a correction and resend the same UAT listing from Android
        env:
          AQER_PHASE1_TEST_ACCESS_JSON: ${{ secrets.AQER_PHASE1_TEST_ACCESS_JSON }}
          QT_QPA_PLATFORM: offscreen
        run: python3 -B scripts/phase1_resubmit_only.py
      - name: Encrypt reviewed evidence for the existing recipient
        id: evidence
        if: ${{ !cancelled() && hashFiles('phase1-native-account-evidence/report.json') != '' }}
        run: python3 -B scripts/prepare_phase1_native_account.py --encrypt-evidence
      - name: Upload encrypted resubmission evidence and APK identity
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-resubmit-only-encrypted-${{ github.run_id }}
          path: |
            phase1-native-account-encrypted/evidence.cms
            phase1-native-account-encrypted/PUBLIC_RECEIPT.json
            phase1-native-account-private/APK_VERIFICATION.json
          retention-days: 3
          if-no-files-found: error
