name: AQER design verification

on:
  push:
    branches: ['تصميم']
    paths:
      - 'mobile_app/**'
      - '.github/workflows/aqer-design-preview.yml'

permissions:
  contents: read

concurrency:
  group: aqer-design-preview
  cancel-in-progress: true

jobs:
  design:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AQER_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the design baseline
        run: |
          test "$(git rev-parse HEAD)" = "$AQER_SOURCE_SHA"
          git merge-base --is-ancestor fd832497768aac67fdd32485f2af835f273111c8 HEAD
          git diff --exit-code fd832497768aac67fdd32485f2af835f273111c8 HEAD -- backend-api-runtime render.yaml
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve the approved package lock
        working-directory: mobile_app
        run: |
          # This manifest differs from UAT 1830 only by the Cairo font assets.
          test "$(git hash-object pubspec.yaml)" = '4583d88e975281d4d55c0622b48ae1249342d99c'
          git diff --exit-code fd832497768aac67fdd32485f2af835f273111c8 HEAD -- \
            pubspec.lock ../docs/ui-transplant-v3/pubspec_overrides.yaml
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          approved="$RUNNER_TEMP/aqer-approved-dependencies"
          git worktree add --detach --quiet "$approved" fd832497768aac67fdd32485f2af835f273111c8
          cp "$approved/docs/ui-transplant-v3/pubspec_overrides.yaml" "$approved/mobile_app/pubspec_overrides.yaml"
          python3 -B "$approved/scripts/verify_v3_dependency_lock.py" --resolved "$PWD/pubspec.lock" --approved-uat1829
          flutter pub get --enforce-lockfile
      - name: Verify the app theme and design journeys
        working-directory: mobile_app
        run: |
          python3 -B ../scripts/check_v3_analysis.py
          flutter test --no-pub --reporter expanded --timeout 45s \
            test/app_theme_test.dart test/phase23_dark_sections_test.dart \
            test/theme_preference_race_test.dart test/wave3_search_only_1393_test.dart \
            test/map_search_layout_1820_test.dart test/map_dynamic_filters_1430_test.dart \
            test/wave2_home_search_test.dart test/uat1822_ranked_map_entry_test.dart \
            test/assisted_search_entry_1820_test.dart test/wave01_acceptance_test.dart
