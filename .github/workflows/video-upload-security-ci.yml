name: Approved Video Security Gate

on:
  pull_request:
    branches: [work/wave2-review-current]
    paths:
      - 'backend-api-runtime/**'
      - '.github/workflows/video-upload-security-ci.yml'

permissions:
  contents: read

jobs:
  video-admission-and-private-storage:
    name: Video admission and private storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare testing configuration
        run: |
          printf 'APP_ENV=testing\nDB_CONNECTION=sqlite\nDB_DATABASE=:memory:\nAPP_KEY=\n' > .env
          php artisan key:generate --force
      - name: Install bounded FFmpeg test prerequisite
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          command -v ffprobe
          command -v ffmpeg
      - name: Video security and streamed private storage regression
        run: php artisan test tests/Feature/ListingVideoUploadPolicyTest.php tests/Feature/VideoPrivateStorageTest.php tests/Feature/ListingVideoProcessingPolicyTest.php tests/Feature/ListingVideoLaunchGateTest.php tests/Feature/ListingVideoTranscoderTest.php tests/Feature/ListingVideoApiTest.php tests/Feature/ListingVideoStreamTest.php --fail-on-warning --fail-on-risky --fail-on-skipped
