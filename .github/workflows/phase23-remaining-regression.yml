name: Phase23 remaining account and inbox regression
on:
  push:
    branches: [work/phase23-acceptance-20261111]
    paths:
      - .github/workflows/phase23-remaining-regression.yml
      - scripts/verify_phase23_account_regression.py
      - mobile_app/lib/features/discovery/data/smart_search_session.dart
      - mobile_app/lib/features/discovery/data/marketplace_search_session.dart
      - mobile_app/lib/features/support/data/support_workspace_repository.dart
      - mobile_app/lib/features/support/domain/support_workspace_models.dart
      - mobile_app/lib/features/support/presentation/support_tasks_screen.dart
      - mobile_app/test/search_account_boundary_test.dart
      - mobile_app/test/support_task_pagination_test.dart
permissions:
  contents: read
jobs:
  remaining-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve the existing approved dependency set
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Prove the old account boundary fails the new behavioral cases
        run: python3 -B scripts/verify_phase23_account_regression.py
      - name: Analyze the corrected account and inbox boundaries
        working-directory: mobile_app
        run: >-
          flutter analyze --fatal-infos
          lib/features/discovery/data/smart_search_session.dart
          lib/features/discovery/data/marketplace_search_session.dart
          lib/features/support/data/support_workspace_repository.dart
          lib/features/support/domain/support_workspace_models.dart
          lib/features/support/presentation/support_tasks_screen.dart
          test/search_account_boundary_test.dart test/support_task_pagination_test.dart
          test/phase23_listing_task_navigation_test.dart
      - name: Verify corrected behavior and existing private screen contracts
        working-directory: mobile_app
        run: >-
          flutter test --no-pub
          test/search_account_boundary_test.dart test/support_task_pagination_test.dart
          test/phase23_listing_task_navigation_test.dart
          test/owner_active_screen_states_test.dart
          test/smart_search_pagination_recovery_test.dart
          --reporter expanded
      - name: Verify no product files were changed by the evidence check
        if: always()
        run: git diff --exit-code -- mobile_app/lib mobile_app/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase23-account-regression-${{ github.run_id }}
          path: phase23-regression-evidence/
          retention-days: 30
          if-no-files-found: warn
