name: Alazzi broker preview

on:
  push:
    branches: ['العزي']
    paths:
      - 'mobile_app/**'
      - '.github/workflows/alazzi-broker-preview.yml'

permissions:
  contents: read

concurrency:
  group: alazzi-broker-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-ui:
    name: Broker screens and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve protected dependencies
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock --approved-uat1829
          flutter pub get --enforce-lockfile
      - name: Analyze Flutter
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Test broker journeys and message regressions
        run: >-
          flutter test --no-pub --reporter expanded
          test/broker_experience_ui_test.dart
          test/broker_convenience_test.dart
          test/message_inbox_pagination_test.dart
          test/my_listings_pagination_test.dart
          test/offline_message_outbox_test.dart
      - name: Upload synthetic screen previews
        uses: actions/upload-artifact@v4
        with:
          name: alazzi-broker-preview
          path: mobile_app/build/broker-preview/
          retention-days: 14
