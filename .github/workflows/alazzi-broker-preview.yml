name: Alazzi broker preview

on:
  push:
    branches: ['العزي', 'work/alazzi-marketplace-1847', 'work/alazzi-account-smart-search-1848', 'work/alazzi-ui-parity-1849']
    paths:
      - 'mobile_app/**'
      - 'backend-api-runtime/**'
      - '.github/workflows/alazzi-broker-preview.yml'

permissions:
  contents: read

concurrency:
  group: alazzi-broker-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-api:
    name: Broker stages, deal updates and dashboard counts
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: aqer_broker_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aqer_broker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Initialize disposable test credentials and database roles
        run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
          php artisan key:generate --force
          psql -h 127.0.0.1 -U postgres -d aqer_broker_test -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: Exercise the broker and messaging APIs on SQLite
        run: >-
          php artisan test tests/Feature/BrokerExperienceApiTest.php
          tests/Feature/Stage11MessagingNotificationsApiTest.php
          tests/Feature/Branch2RecoveryTest.php
          tests/Feature/ActiveWaveDiscoveryTest.php
          tests/Feature/Phase3BuyerDiscoveryFavoritesApiTest.php
          tests/Feature/ActiveWavePublicationAlertTest.php
          tests/Feature/ProductExperienceSavedSearchTest.php
          tests/Feature/NotificationPreferenceTest.php
          tests/Feature/Wave3MarketplaceApiTest.php
          tests/Feature/FinancialV1ApiTest.php
          tests/Feature/PropertySaiPolicyAcceptanceTest.php
          tests/Feature/Wave5ListingRefinementTest.php
          tests/Feature/UatFreeServicesHubApiTest.php
          tests/Feature/EmailLoginAndNameTest.php
          tests/Feature/SpokenSearchCityTest.php
          tests/Feature/Phase04GovernoratesTest.php
          tests/Feature/UatAccountTypesBrokerKycApiTest.php
          --display-warnings --fail-on-warning --fail-on-risky
      - name: Exercise the broker API on PostgreSQL and PostGIS
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aqer_broker_test
          DB_USERNAME: postgres
          DB_PASSWORD: ''
          DB_URL: ''
          DB_SEARCH_PATH: public,extensions
        run: >-
          php artisan test tests/Feature/BrokerExperienceApiTest.php
          tests/Feature/Branch2RecoveryTest.php
          tests/Feature/ActiveWaveDiscoveryTest.php
          tests/Feature/Phase3BuyerDiscoveryFavoritesApiTest.php
          tests/Feature/Wave3MarketplaceApiTest.php
          tests/Feature/PropertySaiPolicyAcceptanceTest.php
          tests/Feature/Wave5ListingRefinementTest.php
          tests/Feature/UatFreeServicesHubApiTest.php
          tests/Feature/EmailLoginAndNameTest.php
          tests/Feature/SpokenSearchCityTest.php
          tests/Feature/Phase04GovernoratesTest.php
          tests/Feature/UatAccountTypesBrokerKycApiTest.php
          --display-warnings --fail-on-warning --fail-on-risky

  broker-ui:
    name: Broker screens and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve protected dependencies
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock --approved-uat1829
          flutter pub get --enforce-lockfile
      - name: Analyze Flutter
        id: analyze
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Test broker screens, conversations and marketplace cards
        run: >-
          flutter test --no-pub --reporter expanded
          test/broker_experience_ui_test.dart
          test/listing_card_parity_test.dart
          test/private_listing_card_photo_test.dart
          test/listing_design_wave_test.dart
          test/ui_transplant_v3_template_test.dart
          test/ux_refinement_test.dart
          test/broker_listing_assistant_test.dart
          test/branch2_voice_test.dart
          test/broker_convenience_test.dart
          test/platform_dues_payment_test.dart
          test/wave3_personal_listing_test.dart
          test/branch2_recovery_test.dart
          test/wave02_autosave_test.dart
          test/active_wave_discovery_test.dart
          test/listing_direct_resume_test.dart
          test/message_inbox_pagination_test.dart
          test/my_listings_pagination_test.dart
          test/offline_message_outbox_test.dart
          test/wave02_assistant_entry_test.dart
          test/app_components_test.dart
          test/app_theme_test.dart
          test/compact_cards_email_login_test.dart
          test/owner_ux_gallery_filters_test.dart
          test/phase3_favorites_screen_test.dart
          test/wave3_search_only_1393_test.dart
      - name: Test account preferences, profile editing and regional search
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: >-
          flutter test --no-pub --reporter expanded
          test/stage6_auth_user_test.dart
          test/uat_account_types_kyc_models_test.dart
          test/account_tools_integration_test.dart
          test/uat_free_services_account_reorg_test.dart
          test/uat_services_hub_navigation_test.dart
          test/phase5_notification_destination_test.dart
          test/phase5_deep_links_test.dart
          test/broker_saved_search_navigation_test.dart
          test/notification_preferences_test.dart
          test/session_lifecycle_race_test.dart
          test/assisted_search_entry_1820_test.dart
          test/in_app_voice_search_test.dart
          test/live_dictation_test.dart
          test/search_query_wave_test.dart
          test/governorate_search_test.dart
          test/map_search_layout_1820_test.dart
          test/current_wave_contract_test.dart
          test/wave6_product_contract_test.dart
          test/wave2_home_search_test.dart
          test/home_dhamar_similar_cards_test.dart
          test/ui_transplant_v3_home_test.dart
          test/wave3_ai_design_ui_test.dart
          test/wave6_product_ui_test.dart
      - name: Upload synthetic screen previews
        id: preview-artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: alazzi-broker-preview
          path: mobile_app/build/broker-preview/
          retention-days: 14
      - name: Retain dashboard and customer previews when artifact upload fails
        if: steps.preview-artifact.outcome == 'failure'
        run: |
          for screen in dashboard customers; do
            printf '::group::Synthetic preview %s\n' "$screen"
            printf 'AQER_PREVIEW_BEGIN %s\n' "$screen"
            base64 -w 4096 "build/broker-preview/$screen.png"
            printf 'AQER_PREVIEW_END %s\n' "$screen"
            printf '::endgroup::\n'
          done
