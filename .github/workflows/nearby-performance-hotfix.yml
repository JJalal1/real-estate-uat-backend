name: Nearby performance hotfix

on:
  push:
    branches: [work/nearby-performance-hotfix]
    paths:
      - 'backend-api-runtime/**'
      - '.github/workflows/nearby-performance-hotfix.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Nearby and media regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated environment
        shell: bash
        run: |
          set -euo pipefail
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          printf 'APP_KEY=base64:%s\n' "$key" > .env
      - name: Syntax check hotfix
        run: |
          php -l app/Services/ListingWatermarkService.php
          php -l app/Models/Property.php
          php -l app/Http/Controllers/Api/PropertyController.php
          php -l tests/Feature/Stage5PropertyApiTest.php
      - name: Run property and discovery regressions
        run: >-
          php artisan test
          tests/Feature/Stage5PropertyApiTest.php
          tests/Feature/DiscoverySearchQualityTest.php
          --display-warnings --fail-on-warning --fail-on-risky
