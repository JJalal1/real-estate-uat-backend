name: Normalize advertiser price formatter

on:
  push:
    branches:
      - fix/advertiser-listing-journey-uat

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advertiser-listing-journey-uat
      - name: Reuse canonical Arabic price formatter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile_app/lib/features/properties/presentation/listing_editor_screen.dart')
          s = p.read_text()
          s = s.replace("import '../../../core/formatting/arabic_amount_words.dart';\n", '')
          marker = "import '../data/property_repository.dart';\n"
          if "../domain/arabic_price_words.dart" not in s:
              s = s.replace(marker, marker + "import '../domain/arabic_price_words.dart';\n")
          s = s.replace('final amountWords = arabicYemeniRialAmountWords(_price.text);', "final amountWords = arabicRiyalAmountInWords(_price.text) ?? '';")
          p.write_text(s)
          Path('mobile_app/lib/core/formatting/arabic_amount_words.dart').unlink(missing_ok=True)
          Path('mobile_app/test/arabic_amount_words_test.dart').unlink(missing_ok=True)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile_app/lib/features/properties/presentation/listing_editor_screen.dart mobile_app/lib/core/formatting/arabic_amount_words.dart mobile_app/test/arabic_amount_words_test.dart || true
          git commit -m "Reuse canonical Arabic price words formatter"
          git push origin HEAD:fix/advertiser-listing-journey-uat
