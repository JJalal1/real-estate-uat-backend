name: Property Identity Backend Repair

on:
  push:
    branches:
      - feature/property-identity-duplicate-prevention
    paths:
      - .github/workflows/property-identity-backend-repair.yml
      - .github/scripts/property_identity_backend_repair.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          printf 'APP_KEY=base64:%s\n' "$key" > .env
      - name: Apply deterministic repair
        working-directory: .
        run: python3 .github/scripts/property_identity_backend_repair.py
      - name: Validate PHP syntax
        run: |
          php -l app/Services/PropertyIdentityService.php
          php -l app/Http/Controllers/Api/PropertyController.php
      - name: Run targeted backend regressions
        run: php artisan test tests/Feature/Phase2ListingJourneyApiTest.php tests/Feature/PropertyIdentityV2Test.php tests/Feature/Stage9ListingReviewApiTest.php tests/Feature/UatChangePhase2ApiTest.php --display-warnings --fail-on-warning --fail-on-risky
      - name: Verify patch
        working-directory: .
        run: git diff --check
      - name: Commit repair and remove one-shot assets
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-api-runtime/app/Services/PropertyIdentityService.php \
                  backend-api-runtime/app/Http/Controllers/Api/PropertyController.php \
                  backend-api-runtime/tests/Feature/PropertyIdentityV2Test.php \
                  backend-api-runtime/tests/Feature/Phase2ListingJourneyApiTest.php
          git rm .github/scripts/property_identity_backend_repair.py .github/workflows/property-identity-backend-repair.yml
          git diff --cached --check
          git commit -m "Fix Property Identity backend regressions"
          git push origin HEAD:feature/property-identity-duplicate-prevention
