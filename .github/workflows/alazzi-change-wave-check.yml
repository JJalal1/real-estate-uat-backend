name: Alazzi change wave verification

on:
  push:
    branches: [work/alazzi-change-wave-check-20261126]
    paths:
      - '.github/workflows/alazzi-change-wave-check.yml'

permissions:
  contents: read

concurrency:
  group: alazzi-change-wave-check-${{ github.ref }}
  cancel-in-progress: true

env:
  AQER_VERIFIED_SOURCE: '49421753c7a0b60a38a355c85690201386327023'

jobs:
  broker-api:
    name: Broker activity, listing availability and public discovery
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: aqer_broker_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aqer_broker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AQER_VERIFIED_SOURCE }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Initialize disposable test credentials and database roles
        run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
          php artisan key:generate --force
          psql -h 127.0.0.1 -U postgres -d aqer_broker_test -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: Exercise the broker and messaging APIs on SQLite
        run: >-
          php artisan test tests/Feature/BrokerExperienceApiTest.php
          tests/Feature/Stage11MessagingNotificationsApiTest.php
          tests/Feature/FinancialV1ApiTest.php
          tests/Feature/Phase3BuyerDiscoveryFavoritesApiTest.php
          tests/Feature/BackgroundPreparationTest.php
          --display-warnings --fail-on-warning --fail-on-risky
      - name: Exercise the broker API on PostgreSQL and PostGIS
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aqer_broker_test
          DB_USERNAME: postgres
          DB_PASSWORD: ''
          DB_URL: ''
          DB_SEARCH_PATH: public,extensions
        run: >-
          php artisan test tests/Feature/BrokerExperienceApiTest.php
          tests/Feature/Phase3BuyerDiscoveryFavoritesApiTest.php
          --display-warnings --fail-on-warning --fail-on-risky

  broker-ui:
    name: Broker screens, Home and map navigation
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.AQER_VERIFIED_SOURCE }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve protected dependencies
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock --approved-uat1829
          flutter pub get --enforce-lockfile
      - name: Analyze Flutter
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Exercise Updates, My Activity, My Properties, Home and the map
        run: >-
          flutter test --no-pub --reporter expanded
          test/broker_experience_ui_test.dart
          test/broker_convenience_test.dart
          test/listing_direct_resume_test.dart
          test/message_inbox_pagination_test.dart
          test/my_listings_pagination_test.dart
          test/offline_message_outbox_test.dart
          test/wave02_assistant_entry_test.dart
          test/app_components_test.dart
          test/app_theme_test.dart
          test/compact_cards_email_login_test.dart
          test/owner_ux_gallery_filters_test.dart
          test/phase3_favorites_screen_test.dart
          test/wave3_search_only_1393_test.dart
          test/private_tail_pagination_test.dart
          test/ui_transplant_v3_home_test.dart
          test/map_search_layout_1820_test.dart
          test/map_dynamic_filters_1430_test.dart
          test/search_scope_lifecycle_1820_test.dart
          test/phase04_ranked_search_test.dart
          test/broker_activity_result_test.dart
          test/my_listings_layout_20261126_test.dart
          test/private_listing_card_photo_test.dart
          test/loading_recovery_test.dart
          test/ui_transplant_v3_template_test.dart
          test/uat1822_ranked_map_entry_test.dart
