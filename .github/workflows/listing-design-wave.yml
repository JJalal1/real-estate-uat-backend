name: Listing and Design Wave Acceptance
on:
  push:
    branches: [work/listing-design-1087, work/template-creation-menu, work/listing-flow-1092, work/compact-cards-email-login, work/new-wave-1102]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: listing-design-${{ github.ref }}
  cancel-in-progress: true
jobs:
  listing:
    name: Complete Arabic listing brief and AI boundaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer validate --no-check-publish
      - run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate --force
      - run: php artisan test tests/Feature/NewWaveHandoffTest.php tests/Feature/EmailLoginAndNameTest.php tests/Feature/Stage6IdentityApiTest.php tests/Feature/BrokerListingAssistantTest.php tests/Feature/Wave3AiAssistantTest.php --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
  flutter:
    name: Refreshed Arabic interface and voice contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Original locked dependencies
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Strict static analysis
        working-directory: mobile_app
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Focused interface and voice regression
        working-directory: mobile_app
        run: flutter test test/new_wave_handoff_test.dart test/compact_cards_email_login_test.dart test/active_wave_discovery_test.dart test/template_creation_menu_test.dart test/listing_design_wave_test.dart test/broker_listing_assistant_test.dart test/live_dictation_test.dart test/phase3_favorites_screen_test.dart test/uat_account_types_kyc_models_test.dart
      - name: Upload synthetic interface previews
        id: previews
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: listing-design-previews-${{ github.run_number }}
          path: |
            mobile_app/build/compact-cards-preview/
            mobile_app/build/listing-design-preview/
            mobile_app/build/broker-preview/assistant-complete-*.png
            mobile_app/build/broker-preview/new-wave-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Bounded preview fallback
        if: ${{ !cancelled() && steps.previews.outcome == 'failure' }}
        run: python3 -B scripts/emit_listing_design_previews.py
