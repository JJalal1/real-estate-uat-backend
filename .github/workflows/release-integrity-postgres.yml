name: Release Integrity PostgreSQL Regression

on:
  pull_request:
    branches: [work/wave2-review-current]
    paths:
      - 'backend-api-runtime/**'
      - '.github/workflows/release-integrity-postgres.yml'

permissions:
  contents: read

jobs:
  postgres-market-context:
    name: PostgreSQL market context integer safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: real_estate_audit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d real_estate_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: real_estate_audit
      DB_USERNAME: postgres
      DB_PASSWORD: ''
      DB_URL: ''
      DB_SEARCH_PATH: public,extensions
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_pgsql
          coverage: none
      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare disposable test environment
        run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
          php artisan key:generate --force
          psql -h 127.0.0.1 -U postgres -d real_estate_audit -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
          psql -h 127.0.0.1 -U postgres -d real_estate_audit -v ON_ERROR_STOP=1 -c 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated;'
      - name: Run full migration chain against PostgreSQL 17 / PostGIS
        run: php artisan migrate --force
      - name: Verify area band regressions in real PostgreSQL
        run: php artisan test tests/Postgres/PropertyMarketContextPostgresTest.php tests/Postgres/ListingVideoPostgresTest.php --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
