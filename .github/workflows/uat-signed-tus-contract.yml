name: UAT Signed TUS contract
on:
  pull_request:
    branches: [work/wave2-review-current]
    paths:
      - 'backend-api-runtime/app/Services/CloudAssetStorageService.php'
      - 'backend-api-runtime/config/services.php'
      - 'backend-api-runtime/tests/Feature/SignedTusCanaryContractTest.php'
      - '.github/workflows/uat-signed-tus-contract.yml'
permissions:
  contents: read
jobs:
  signed-tus-contract:
    name: Signed TUS protocol and failure-preservation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: |
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          printf 'APP_KEY=base64:%s\n' "$key" > .env
      - run: |
          php -l app/Services/CloudAssetStorageService.php
          php -l tests/Feature/SignedTusCanaryContractTest.php
          php artisan test tests/Feature/SignedTusCanaryContractTest.php --fail-on-warning --fail-on-risky
