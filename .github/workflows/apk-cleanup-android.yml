name: APK cleanup install, update and measured footprint
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      clean_artifact:
        required: true
        type: string
      compressed_artifact:
        required: true
        type: string
    outputs:
      artifact_name:
        description: Public emulator update and measurement receipt
        value: ${{ jobs.upgrade.outputs.artifact_name }}
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    name: Update 1817 to cleaned 1818 and compressed 1819
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      artifact_name: ${{ steps.context.outputs.artifact_name }}
    env:
      AQER_APK_CLEANUP_UPGRADE: 'true'
      UPGRADE_SOURCE_SHA: ${{ inputs.source_sha }}
      CLEAN_ARTIFACT: ${{ inputs.clean_artifact }}
      COMPRESSED_ARTIFACT: ${{ inputs.compressed_artifact }}
    steps:
      # The caller must not inherit signing secrets. This consumer receives
      # ordinary installers/public receipts only and never imports a key.
      - name: Require the explicit private cleanup source and current artifacts
        id: context
        run: |
          python3 -B - <<'PY'
          import os, re
          if (os.environ.get('GITHUB_ACTIONS') != 'true' or
              os.environ.get('GITHUB_REPOSITORY') != 'JJalal1/real-estate-uat-backend' or
              os.environ.get('GITHUB_REF') != 'refs/heads/work/apk-cleanup-1817-20261117' or
              os.environ.get('GITHUB_EVENT_NAME') != 'push' or
              os.environ.get('AQER_APK_CLEANUP_UPGRADE') != 'true'):
              raise RuntimeError('explicit_private_apk_cleanup_context_required')
          source = os.environ['UPGRADE_SOURCE_SHA']
          if not re.fullmatch(r'[a-f0-9]{40}', source) or source != os.environ['GITHUB_SHA']:
              raise RuntimeError('cleanup_source_mismatch')
          if (os.environ['CLEAN_ARTIFACT'] != 'apk-cleanup-1818-' + source or
              os.environ['COMPRESSED_ARTIFACT'] != 'apk-cleanup-1819-' + source):
              raise RuntimeError('exact_current_run_cleanup_artifacts_required')
          forbidden = ('AQER_UAT_KEYSTORE_BASE64', 'AQER_RELEASE_STORE_FILE',
                       'AQER_RELEASE_STORE_PASSWORD', 'AQER_RELEASE_KEY_ALIAS',
                       'AQER_RELEASE_KEY_PASSWORD', 'AQER_UAT_GOOGLE_SERVICES_JSON_BASE64',
                       'AQER_PHASE1_TEST_ACCESS_JSON', 'SUPABASE_SERVICE_ROLE_KEY', 'DATABASE_URL')
          if any(os.environ.get(name) for name in forbidden):
              raise RuntimeError('signing_or_account_material_forbidden_in_cleanup_probe')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('artifact_name=apk-cleanup-android-proof-' + source + '\n')
          print('AQER_APK_CLEANUP_PUBLIC_CONTEXT_VERIFIED')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the immutable verified 1817 baseline artifact
        uses: actions/download-artifact@v4
        with:
          # Historical name: connectivity-fix-1817-e91927e9d14994c9101d6f11b8886e666bb930d1
          artifact-ids: '14328756670'
          run-id: '44081151224'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: apk-cleanup-input/baseline
      - name: Download the cleaned uncompressed 1818 from the current run
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.clean_artifact }}
          path: apk-cleanup-input/clean
      - name: Download the independently built compressed 1819 from the current run
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.compressed_artifact }}
          path: apk-cleanup-input/compressed
      - name: Reject unexpected artifact files before starting Android
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          expected = {
              'baseline': {'AQER-UAT-1817-Durable-Update.apk', 'APK_VERIFICATION.json'},
              'clean': {'AQER-UAT-1818-Clean.apk', 'APK_VERIFICATION.json'},
              'compressed': {'AQER-UAT-1819-Clean.apk', 'APK_VERIFICATION.json'},
          }
          for name, filenames in expected.items():
              root = Path('apk-cleanup-input') / name
              entries = list(root.iterdir())
              if (root.is_symlink() or {path.name for path in entries} != filenames or
                  any(path.is_symlink() or not path.is_file() for path in entries)):
                  raise RuntimeError('only_verified_apk_and_public_receipt_allowed')
          print('AQER_APK_CLEANUP_ARTIFACT_CONTENTS_VERIFIED')
          PY
      - name: Reclaim unused SDK space on the disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Boot an empty disposable cleanup API36 emulator
        run: |
          test -c /dev/kvm
          sdkmanager --install 'emulator' 'system-images;android-36;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/apk-cleanup-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --force --name aqer-cleanup-upgrade --device pixel --path "$ANDROID_AVD_HOME/aqer-cleanup-upgrade.avd" --package 'system-images;android-36;google_apis;x86_64'
          python3 - "$ANDROID_AVD_HOME/aqer-cleanup-upgrade.avd/config.ini" <<'PYCONF'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          values = {'hw.lcd.width': '540', 'hw.lcd.height': '960', 'hw.lcd.density': '210',
                    'showDeviceFrame': 'no', 'hw.camera.back': 'none', 'hw.camera.front': 'none',
                    'disk.dataPartition.size': '2048M'}
          lines = [line for line in path.read_text().splitlines() if line.split('=', 1)[0].strip() not in values]
          path.write_text('\n'.join(lines + [key + '=' + value for key, value in values.items()]) + '\n')
          PYCONF
          export QT_QPA_PLATFORM=offscreen
          printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd aqer-cleanup-upgrade -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -accel on -memory 2048 -cores 2 > "$RUNNER_TEMP/apk-cleanup-emulator.log" 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS+250))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/apk-cleanup-emulator.log"; exit 1; fi
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null || true)" = 1 ] && [ "$(adb -s emulator-5554 shell getprop sys.user.0.ce_available 2>/dev/null || true)" = true ]; then break; fi
            sleep 2
          done
          if [ "$SECONDS" -ge "$deadline" ]; then cat "$RUNNER_TEMP/apk-cleanup-emulator.log"; adb -s emulator-5554 shell getprop sys.boot_completed || true; exit 1; fi
      - name: Install and update twice without uninstalling or clearing app data
        run: >-
          python3 -B scripts/probe_apk_cleanup_upgrade.py
          --baseline-apk apk-cleanup-input/baseline/AQER-UAT-1817-Durable-Update.apk
          --baseline-receipt apk-cleanup-input/baseline/APK_VERIFICATION.json
          --clean-apk apk-cleanup-input/clean/AQER-UAT-1818-Clean.apk
          --clean-receipt apk-cleanup-input/clean/APK_VERIFICATION.json
          --compressed-apk apk-cleanup-input/compressed/AQER-UAT-1819-Clean.apk
          --compressed-receipt apk-cleanup-input/compressed/APK_VERIFICATION.json
          --source "$UPGRADE_SOURCE_SHA" --serial emulator-5554
          --output apk-cleanup-android-proof
      - name: Preserve only the public update and measurement receipt
        uses: actions/upload-artifact@v4
        if: always() && steps.context.outcome == 'success' && github.event.repository.private
        with:
          name: ${{ steps.context.outputs.artifact_name }}
          path: apk-cleanup-android-proof/ANDROID_APK_CLEANUP_VERIFICATION.json
          retention-days: 14
          if-no-files-found: warn
      - name: Stop the disposable emulator
        if: always()
        run: adb -s emulator-5554 emu kill || true
