name: Search query and voice followup acceptance
on:
  push:
    branches: [work/search-query-wave-1081]
permissions:
  contents: read
env:
  SOURCE_COMMIT: ${{ github.sha }}
concurrency:
  group: search-query-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Resolve locked backend and test the actual spoken-city sequence
        working-directory: backend-api-runtime
        run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate --force
          php -l app/Services/SmartSearchService.php
          php -l tests/Feature/SpokenSearchCityTest.php
          php artisan test tests/Feature/SpokenSearchCityTest.php tests/Feature/Wave3AiAssistantTest.php --display-warnings --fail-on-warning --fail-on-risky
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve the reviewed backend scope, native voice and original dependencies
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '419db103490fabe43b2ca89f397fac82ea708a6b', 'HEAD', '--', 'backend-api-runtime'], text=True).splitlines())
          assert changed == {'backend-api-runtime/app/Services/SmartSearchService.php', 'backend-api-runtime/tests/Feature/SpokenSearchCityTest.php'}, changed
          PY
          git diff --exit-code 419db103490fabe43b2ca89f397fac82ea708a6b HEAD -- mobile_app/android mobile_app/ios mobile_app/pubspec.yaml mobile_app/pubspec.lock mobile_app/assets mobile_app/lib/core/platform mobile_app/lib/core/widgets/inline_voice_capture.dart
          git diff --check 419db103490fabe43b2ca89f397fac82ea708a6b HEAD
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve original locked packages
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Strict Flutter analysis
        working-directory: mobile_app
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Query, voice, cancellation, shared-map and stale-response contracts
        id: query_tests
        working-directory: mobile_app
        run: >-
          flutter test test/search_query_wave_test.dart test/wave3_ai_session_test.dart
          test/in_app_voice_search_test.dart test/live_dictation_test.dart
          test/wave6_product_contract_test.dart test/wave6_product_ui_test.dart
      - name: Save exact-source synthetic query previews
        id: preview_upload
        if: ${{ !cancelled() && (steps.query_tests.conclusion == 'success' || steps.query_tests.conclusion == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: search-query-ui-${{ github.run_number }}
          path: mobile_app/build/broker-preview/search-query-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Transport only the four synthetic query previews when storage is full
        if: ${{ !cancelled() && steps.preview_upload.outcome == 'failure' }}
        run: python3 -B scripts/emit_search_query_previews.py
