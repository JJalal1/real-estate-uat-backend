name: Property Identity V2 Apply

on:
  push:
    branches:
      - feature/property-identity-duplicate-prevention
    paths:
      - .github/workflows/property-identity-v2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/property-identity-duplicate-prevention
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 .github/scripts/property_identity_backend_apply.py
      - name: PHP syntax checks
        run: |
          php -l backend-api-runtime/app/Http/Controllers/Api/PropertyController.php
          php -l backend-api-runtime/app/Http/Controllers/Api/PropertyIdentityController.php
          php -l backend-api-runtime/app/Services/ListingWorkflowService.php
          php -l backend-api-runtime/app/Services/PropertyIdentityService.php
          php -l backend-api-runtime/app/Models/Property.php
          php -l backend-api-runtime/app/Models/PropertyAsset.php
          php -l backend-api-runtime/database/migrations/2026_09_13_030000_add_property_identity_v2.php
          php -l backend-api-runtime/routes/api.php
      - name: Commit applied backend integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/property_identity_backend_apply.py .github/workflows/property-identity-v2-apply.yml
          git add backend-api-runtime
          git diff --cached --check
          git commit -m "Integrate automated Property Identity V2 backend"
          git push origin HEAD:feature/property-identity-duplicate-prevention
