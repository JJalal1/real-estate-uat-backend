name: Broker Experience CI
on:
  push:
    branches: [work/broker-experience-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: broker-experience-${{ github.ref }}
  cancel-in-progress: true
env:
  SOURCE_COMMIT: ${{ github.sha }}
  UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api
jobs:
  source:
    name: Private source checkpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Package tracked source only
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|[^/]+\.keystore|[^/]+\.jks|id_rsa)$'; then
            echo "Unexpected private runtime file tracked"
            exit 1
          fi
          mkdir -p source-checkpoint
          git archive --format=zip --output=source-checkpoint/broker-source-${GITHUB_RUN_NUMBER}.zip HEAD
          git rev-parse HEAD > source-checkpoint/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: broker-private-source-${{ github.run_number }}
          path: source-checkpoint/
          retention-days: 3
          if-no-files-found: error

  laravel:
    name: Laravel original regression
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Create disposable local environment
        run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
      - name: Install original backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate temporary test key
        run: php artisan key:generate --force
      - name: Full Laravel regression
        run: php artisan test --display-warnings --fail-on-warning --fail-on-risky

  postgres:
    name: Disposable PostgreSQL 17 and PostGIS
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: real_estate_audit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d real_estate_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: real_estate_audit
      DB_USERNAME: postgres
      DB_PASSWORD: ''
      DB_URL: ''
      DB_SEARCH_PATH: public,extensions
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_pgsql
          coverage: none
      - name: Create disposable local environment
        run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
      - name: Install original backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate temporary test key
        run: php artisan key:generate --force
      - name: Prepare API roles in disposable database
        run: >-
          psql -h 127.0.0.1 -U postgres -d real_estate_audit -v ON_ERROR_STOP=1
          -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
          -c 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated;'
      - name: Apply original migration chain to disposable database
        run: php artisan migrate --force
      - name: PostgreSQL schema and access regression
        run: php artisan test tests/Postgres --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Broker ownership, followup and UTC date range on PostgreSQL
        run: >-
          php artisan test tests/Feature/BrokerExperienceApiTest.php
          --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Listing scope, customer commission and private editor contracts on PostgreSQL
        run: >-
          php artisan test tests/Feature/UxRefinementApiTest.php
          --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Wave3 account boundaries and floor identity on PostgreSQL
        run: >-
          php artisan test tests/Feature/Wave3MarketplaceApiTest.php tests/Feature/Wave3UatSeedTest.php
          --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: PostGIS original overlap contract
        run: >-
          php artisan test tests/Feature/Stage8RegionsBrokerApiTest.php
          --filter=test_postgis_rejects_interior_overlap_but_allows_touching_borders
          --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped

  runtime:
    name: UAT Docker PNG runtime
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Build the exact Render runtime image
        run: docker build -t real-estate-wave3-uat -f backend-api-runtime/Dockerfile.uat backend-api-runtime
      - name: Verify PNG fixture generation in the runtime
        run: >-
          docker run --rm --entrypoint php real-estate-wave3-uat
          -r '$image=imagecreatetruecolor(20,20); imagestring($image,1,0,0,"UAT",0); ob_start(); imagepng($image); $bytes=ob_get_clean(); imagedestroy($image); if(substr($bytes,0,8)!=="\x89PNG\r\n\x1a\n") exit(1); echo "Runtime PNG fixture support verified.\n";'

  flutter:    permissions:
      contents: write
    name: Flutter broker experience and UAT APK
    needs: [source, laravel, postgres, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Set up original Flutter 3.27.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve original locked packages
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Ensure original dependency declaration is unchanged
        run: git diff --exit-code -- mobile_app/pubspec.yaml
      - name: Static analysis with exact original INFO baseline
        working-directory: mobile_app
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Broker journeys, template components and navigation acceptance
        id: stage1_ui
        working-directory: mobile_app
        run: >-
          flutter test
          test/broker_experience_ui_test.dart
          test/broker_convenience_test.dart
          test/ux_refinement_test.dart
          test/wave3_personal_listing_test.dart
          test/ui_transplant_v3_home_test.dart
          test/ui_transplant_v3_template_test.dart
          test/app_components_test.dart
          test/app_theme_test.dart
          test/uat_comments_fix_test.dart
          test/uat_listing_publish_viewing_flow_test.dart
          test/startup_navigation_layout_test.dart
      - name: Upload rendered template screen previews
        continue-on-error: true
        if: ${{ !cancelled() && (steps.stage1_ui.conclusion == 'success' || steps.stage1_ui.conclusion == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: broker-ui-preview-${{ github.run_number }}
          path: |
            mobile_app/build/v3-preview/
            mobile_app/build/broker-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Full Flutter regression
        id: flutter_regression
        working-directory: mobile_app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find test -type f -name '*_test.dart' ! -path 'test/uat_compiled_environment_test.dart' -print0 | sort -z)
          test "${#tests[@]}" -gt 0
          flutter test "${tests[@]}"
      - name: Verify compiled Frankfurt endpoint
        id: compiled_environment
        if: ${{ !cancelled() && (steps.flutter_regression.conclusion == 'success' || steps.flutter_regression.conclusion == 'failure') }}
        working-directory: mobile_app
        run: >-
          flutter test
          --dart-define=APP_ENVIRONMENT=uat
          --dart-define=API_BASE_URL=${{ env.UAT_API_BASE_URL }}
          test/uat_compiled_environment_test.dart
      - name: Build tested broker UAT APK
        id: build_apk
        if: ${{ !cancelled() && steps.compiled_environment.conclusion == 'success' && steps.flutter_regression.conclusion == 'success' && steps.stage1_ui.conclusion == 'success' }}
        working-directory: mobile_app
        run: >-
          flutter build apk --release
          --build-number=$((1000 + GITHUB_RUN_NUMBER))
          --dart-define=APP_ENVIRONMENT=uat
          --dart-define=API_BASE_URL=${{ env.UAT_API_BASE_URL }}
      - name: Prepare APK evidence
        if: ${{ !cancelled() && steps.build_apk.conclusion == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="mobile_app/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk"
          cp "$apk" "dist/real-estate-broker-uat-${GITHUB_RUN_NUMBER}.apk"
          sha256sum dist/*.apk > dist/SHA256.txt
          cp mobile_app/pubspec.lock dist/RESOLVED_PUBSPEC.lock
          cp mobile_app/pubspec_overrides.yaml dist/BUILD_PUBSPEC_OVERRIDES.yaml
          sha256sum dist/RESOLVED_PUBSPEC.lock > dist/DEPENDENCY_SHA256.txt
          cat > dist/BUILD_INFO.txt <<EOF
          purpose=broker-experience-uat
          acceptance_status=not-approved
          stage1_ui=${{ steps.stage1_ui.conclusion }}
          flutter_regression=${{ steps.flutter_regression.conclusion }}
          source_commit=${SOURCE_COMMIT}
          template_reference=c2c7769f1114de434d10866a1032a84c086c1d47
          backend_expected_commit=${SOURCE_COMMIT}
          api_base_url=${UAT_API_BASE_URL}
          flutter_version=3.27.3
          android_application_id=com.example.real_estate_mobile
          signing=original-development-debug-key
          run_number=${GITHUB_RUN_NUMBER}
          EOF
      - name: Upload broker UAT APK and exact commit evidence
        id: apk_artifact
        continue-on-error: true
        if: ${{ !cancelled() && steps.build_apk.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: real-estate-broker-uat-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve tested APK if Actions artifact quota is full
        if: ${{ !cancelled() && steps.build_apk.conclusion == 'success' && steps.apk_artifact.outcome == 'failure' }}
        env:
          BUILD_CHECKPOINT_TOKEN: ${{ github.token }}
        run: python3 -B scripts/publish_uat_build_checkpoint.py
      - name: Verify and publish the tested private UAT installer
        if: ${{ !cancelled() && steps.build_apk.conclusion == 'success' }}
        env:
          BUILD_CHECKPOINT_TOKEN: ${{ github.token }}
        run: python3 -B scripts/publish_verified_uat_release.py
