name: Apply Financial V1 Flutter Finalization

on:
  push:
    branches: [feature/financial-v1-impl]
    paths:
      - '.github/workflows/apply-financial-v1-flutter-finalization.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/financial-v1-impl
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter 3.27.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Validate and normalize patch script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/finalize_financial_v1_flutter.py')
          s = p.read_text(encoding='utf-8')
          old = "replace_once(p, \"import '../../account/data/auth_controller.dart';\\n\", \"import '../../account/data/auth_controller.dart';\\nimport '../../financial/data/financial_repository.dart';\\n\")"
          new = "replace_once(p, \"import '../../regions/data/region_repository.dart';\\n\", \"import '../../financial/data/financial_repository.dart';\\nimport '../../regions/data/region_repository.dart';\\n\")"
          if old not in s:
              raise SystemExit('GM import repair anchor missing')
          s = s.replace(old, new, 1)
          marker = "print('Financial V1 Flutter finalization patch applied')"
          extra = '''replace_once(p,\n"class _DataRow { const _DataRow(this.label, this.value); final String label; final int value; }",\n"class _DataRow { const _DataRow(this.label, this.value); final String label; final Object value; }")\nreplace_once(p,\n"double? _asDouble(dynamic value){if(value is num)return value.toDouble();return double.tryParse(value?.toString()??'');}",\n"double? _asDouble(dynamic value){if(value is num)return value.toDouble();return double.tryParse(value?.toString()??'');}\\nString _formatMoney(double? value){final amount=(value??0).round().toString();final out=StringBuffer();for(var i=0;i<amount.length;i++){final remaining=amount.length-i;out.write(amount[i]);if(remaining>1&&remaining%3==1)out.write(',');}return '$out YER';}")\n\nprint('Financial V1 Flutter finalization patch applied')'''
          if marker not in s:
              raise SystemExit('script marker missing')
          s = s.replace(marker, extra, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/finalize_financial_v1_flutter.py
      - name: Apply guarded final patch
        shell: bash
        run: |
          python3 .github/scripts/finalize_financial_v1_flutter.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend-api-runtime/tests/Feature/FinancialV1ApiTest.php')
          s = p.read_text(encoding='utf-8')
          old1 = "/api/admin/support/tasks?scope=inbox&type=payment_review"
          old2 = "/api/admin/support/tasks/$taskId/claim"
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit('Financial support-route test anchors changed')
          s = s.replace(old1, "/api/admin/workspace/tasks?scope=inbox&type=payment_review")
          s = s.replace(old2, "/api/admin/workspace/tasks/$taskId/claim")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Format and resolve analyzer brace lints
        shell: bash
        run: |
          cd mobile_app
          flutter pub get
          dart format lib/features/properties/presentation/listing_editor_screen.dart lib/features/properties/presentation/my_listings_screen.dart lib/features/support/presentation/support_tasks_screen.dart lib/features/admin/presentation/general_manager_pages.dart lib/features/financial/data/financial_repository.dart lib/features/financial/domain/financial_models.dart
          flutter analyze --machine > /tmp/financial_v1_analyze.txt || true
          python3 - <<'PY'
          from pathlib import Path

          diagnostics = []
          for raw in Path('/tmp/financial_v1_analyze.txt').read_text(encoding='utf-8').splitlines():
              parts = raw.split('|')
              if len(parts) < 8:
                  continue
              if parts[2].upper() != 'CURLY_BRACES_IN_FLOW_CONTROL_STRUCTURES':
                  continue
              path = Path(parts[3])
              try:
                  path = path.resolve().relative_to(Path.cwd().resolve())
              except ValueError:
                  pass
              diagnostics.append((str(path), int(parts[4])))

          if not diagnostics:
              raise SystemExit('Expected brace lint diagnostics were not found in analyzer machine output')

          allowed = {
              'lib/features/admin/presentation/general_manager_pages.dart',
              'lib/features/financial/data/financial_repository.dart',
              'lib/features/properties/presentation/listing_editor_screen.dart',
              'lib/features/properties/presentation/my_listings_screen.dart',
              'lib/features/support/presentation/support_tasks_screen.dart',
          }
          unexpected = sorted({path for path, _ in diagnostics if path not in allowed})
          if unexpected:
              raise SystemExit(f'Unexpected brace-lint files: {unexpected}')

          def line_bounds(text, line_no):
              lines = text.splitlines(keepends=True)
              if line_no < 1 or line_no > len(lines):
                  raise SystemExit(f'line {line_no} outside file')
              start = sum(len(x) for x in lines[:line_no - 1])
              return start, start + len(lines[line_no - 1])

          def matching_paren(text, open_pos):
              depth = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = 0
              i = open_pos
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if ch == '/' and i > 0 and text[i - 1] == '*': block_comment -= 1
                      elif ch == '/' and nxt == '*': block_comment += 1; i += 1
                      i += 1; continue
                  if quote:
                      if escape: escape = False
                      elif ch == '\\': escape = True
                      elif ch == quote: quote = None
                      i += 1; continue
                  if ch == '/' and nxt == '/': line_comment = True; i += 2; continue
                  if ch == '/' and nxt == '*': block_comment = 1; i += 2; continue
                  if ch in "'\"": quote = ch
                  elif ch == '(': depth += 1
                  elif ch == ')':
                      depth -= 1
                      if depth == 0: return i
                  i += 1
              raise SystemExit('unmatched if condition')

          def statement_end(text, start):
              paren = bracket = brace = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = 0
              i = start
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if ch == '/' and i > 0 and text[i - 1] == '*': block_comment -= 1
                      elif ch == '/' and nxt == '*': block_comment += 1; i += 1
                      i += 1; continue
                  if quote:
                      if escape: escape = False
                      elif ch == '\\': escape = True
                      elif ch == quote: quote = None
                      i += 1; continue
                  if ch == '/' and nxt == '/': line_comment = True; i += 2; continue
                  if ch == '/' and nxt == '*': block_comment = 1; i += 2; continue
                  if ch in "'\"": quote = ch
                  elif ch == '(': paren += 1
                  elif ch == ')': paren -= 1
                  elif ch == '[': bracket += 1
                  elif ch == ']': bracket -= 1
                  elif ch == '{': brace += 1
                  elif ch == '}': brace -= 1
                  elif ch == ';' and paren == 0 and bracket == 0 and brace == 0: return i
                  i += 1
              raise SystemExit('unable to find unbraced statement end')

          def brace_if_at(path_str, line_no):
              p = Path(path_str)
              text = p.read_text(encoding='utf-8')
              start, end = line_bounds(text, line_no)
              line = text[start:end]
              rel = line.find('if')
              while rel >= 0:
                  before = line[rel - 1] if rel > 0 else ' '
                  after = line[rel + 2] if rel + 2 < len(line) else ' '
                  if not (before.isalnum() or before == '_') and not (after.isalnum() or after == '_'):
                      break
                  rel = line.find('if', rel + 2)
              if rel < 0:
                  raise SystemExit(f'{path_str}:{line_no}: analyzer pointed to a line without if')
              if_pos = start + rel
              open_pos = text.find('(', if_pos)
              if open_pos < 0:
                  raise SystemExit(f'{path_str}:{line_no}: missing if condition')
              close_pos = matching_paren(text, open_pos)
              j = close_pos + 1
              while j < len(text) and text[j].isspace(): j += 1
              if j < len(text) and text[j] == '{':
                  raise SystemExit(f'{path_str}:{line_no}: analyzer reported an already-braced if')
              for keyword in ('if', 'for', 'while', 'switch', 'try', 'do'):
                  if text.startswith(keyword, j) and (j + len(keyword) == len(text) or not (text[j + len(keyword)].isalnum() or text[j + len(keyword)] == '_')):
                      raise SystemExit(f'{path_str}:{line_no}: refusing complex unbraced body starting with {keyword}')
              end_pos = statement_end(text, j)
              line_start = text.rfind('\n', 0, if_pos) + 1
              indent = text[line_start:if_pos]
              text = text[:close_pos + 1] + ' {' + text[close_pos + 1:end_pos + 1] + '\n' + indent + '}' + text[end_pos + 1:]
              p.write_text(text, encoding='utf-8')

          grouped = {}
          for path, line in diagnostics:
              grouped.setdefault(path, []).append(line)
          for path, lines in grouped.items():
              for line in sorted(set(lines), reverse=True):
                  brace_if_at(path, line)

          print(f'Braced {len(diagnostics)} analyzer-reported if statements')
          PY
          dart format lib/features/properties/presentation/listing_editor_screen.dart lib/features/properties/presentation/my_listings_screen.dart lib/features/support/presentation/support_tasks_screen.dart lib/features/admin/presentation/general_manager_pages.dart lib/features/financial/data/financial_repository.dart lib/features/financial/domain/financial_models.dart
      - name: Validate final patch
        shell: bash
        run: |
          git diff --check
          cd mobile_app
          flutter analyze
      - name: Commit source and remove one-shot helpers
        shell: bash
        run: |
          rm -f .github/scripts/finalize_financial_v1_flutter.py
          rm -f .github/workflows/apply-financial-v1-flutter-finalization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Financial V1 Flutter experience'
          git push origin HEAD:feature/financial-v1-impl
