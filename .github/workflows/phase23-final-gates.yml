name: Phase23 final source regression
on:
  push:
    branches: [work/phase23-acceptance-20261111]
    paths:
      - .github/workflows/phase23-final-gates.yml
      - 'backend-api-runtime/**'
      - 'mobile_app/**'
permissions:
  contents: read
concurrency:
  group: phase23-final-source
  cancel-in-progress: false
env:
  SOURCE_COMMIT: ${{ github.sha }}
  UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api
jobs:
  laravel:
    name: Laravel original regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Create disposable local environment
        run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
      - name: Install original backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate temporary test key
        run: php artisan key:generate --force
      - name: Shared property schema consistency
        run: |
          python3 ../scripts/generate_property_schema.py --check
          python3 ../scripts/verify_aqer_brand.py
      - name: UAT startup probes are opt-in
        run: bash tests/Integration/UatStartupProbeGates.sh
      - name: Full Laravel regression
        run: php artisan test --display-warnings --fail-on-warning --fail-on-risky

  postgres:
    name: Disposable PostgreSQL 17 and PostGIS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: real_estate_audit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d real_estate_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: real_estate_audit
      DB_USERNAME: postgres
      DB_PASSWORD: ''
      DB_URL: ''
      DB_SEARCH_PATH: public,extensions
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_pgsql
          coverage: none
      - name: Create disposable local environment
        run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
      - name: Install original backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate temporary test key
        run: php artisan key:generate --force
      - name: Prepare API roles in disposable database
        run: >-
          psql -h 127.0.0.1 -U postgres -d real_estate_audit -v ON_ERROR_STOP=1
          -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
          -c 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated;'
      - name: Apply original migration chain to disposable database
        run: php artisan migrate --force
      # PropertyIdentityConcurrencyTest is local-only: its guard requires
      # loopback:55441/aqer_identity_race_test; this CI database uses 5432.
      - name: PostgreSQL schema and access regression
        run: php artisan test tests/Postgres --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Erasure, authentication and OTP lifecycle on PostgreSQL
        run: >-
          php artisan test tests/Feature/AccountErasureAuthRaceTest.php
          tests/Feature/AccountErasureLaunchTest.php
          --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Broker ownership, followup and UTC date range on PostgreSQL
        run: >-
          php artisan test tests/Feature/BrokerExperienceApiTest.php
          tests/Feature/Wave4ListingJourneyTest.php tests/Feature/Wave4VoiceContractTest.php
          tests/Feature/Wave5ListingRefinementTest.php tests/Feature/EmailLoginAndNameTest.php
          --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Account drafts, real photos and broker contact on PostgreSQL
        run: php artisan test tests/Feature/Wave2AccountSafetyTest.php tests/Feature/Wave2MediaTrustTest.php tests/Feature/PropertyIdentityV2Test.php tests/Feature/UserWorkMediaTest.php tests/Feature/NewWaveHandoffTest.php tests/Feature/Wave6EditorDiscoveryTest.php tests/Feature/UatCityDemoSeedTest.php --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Authenticated broker and support HTTP journey on PostgreSQL
        run: php artisan test tests/Feature/BrokerSupportHttpJourneyTest.php --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Stable private queue pages and permission boundaries on PostgreSQL
        run: php artisan test tests/Feature/Phase23PrivateQueuePaginationTest.php tests/Feature/Phase23InboxPaginationTest.php tests/Feature/AccountVerificationPaginationApiTest.php --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Listing scope, customer commission and private editor contracts on PostgreSQL
        run: >-
          php artisan test tests/Feature/UxRefinementApiTest.php
          --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Wave3 account boundaries and floor identity on PostgreSQL
        run: >-
          php artisan test tests/Feature/Wave3MarketplaceApiTest.php tests/Feature/Wave3UatSeedTest.php
          --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: PostGIS original overlap contract
        run: >-
          php artisan test tests/Feature/Stage8RegionsBrokerApiTest.php
          --filter=test_postgis_rejects_interior_overlap_but_allows_touching_borders
          --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Wave1 exact viewport and real area suggestions on PostGIS
        run: |
          php artisan test tests/Feature/Wave1ViewportDiscoveryTest.php tests/Feature/Wave2PublishedSuggestionsTest.php tests/Feature/Wave3MarketplacePurposeTest.php tests/Feature/Branch2RecoveryTest.php tests/Feature/Branch2CompletionTest.php tests/Feature/Branch2LocationTest.php --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
          php artisan test tests/Feature/Stage8RegionsBrokerApiTest.php --filter=test_wave1_autocomplete --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Wave01 multi-type public discovery, saved search and AI on PostGIS
        run: php artisan test tests/Feature/Wave01SharedFiltersTest.php --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Corrected explicit search amendments on PostgreSQL
        run: php artisan test tests/Feature/ExplicitSearchAmendmentsTest.php --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Gemini boundaries and marketplace presentation on PostgreSQL
        run: >-
          php artisan test tests/Feature/Wave3AiAssistantTest.php tests/Feature/BrokerListingAssistantTest.php tests/Feature/Wave3DesignApiTest.php
          tests/Feature/SpokenSearchCityTest.php
          --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Exact discovery, saved alerts, public profiles and authorized contact on PostgreSQL
        run: >-
          php artisan test tests/Feature/ActiveWaveDiscoveryTest.php tests/Feature/ActiveWavePublicationAlertTest.php
          tests/Feature/ProductExperienceSavedSearchTest.php tests/Feature/NotificationPreferenceTest.php
          --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped

  runtime:
    name: UAT Docker PNG runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Build the exact Render runtime image
        run: docker build -t real-estate-wave3-uat -f backend-api-runtime/Dockerfile.uat backend-api-runtime
      - name: Verify PNG, JPEG, WebP and EXIF support in the runtime
        run: >-
          docker run --rm --entrypoint php real-estate-wave3-uat
          -r '$image=imagecreatetruecolor(20,20); foreach(["png"=>IMAGETYPE_PNG,"jpeg"=>IMAGETYPE_JPEG,"webp"=>IMAGETYPE_WEBP] as $format=>$type) { ob_start(); ("image".$format)($image); $bytes=ob_get_clean(); if(getimagesizefromstring($bytes)[2]!==$type) exit(1); } imagedestroy($image); if(!function_exists("exif_read_data")) exit(1); echo "Runtime PNG/JPEG/WebP codecs and EXIF support verified.\n";'

  flutter:
    name: Final Flutter analysis and regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve approved locked dependencies
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Original analysis baseline
        working-directory: mobile_app
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Full Flutter regression once on the corrected source
        working-directory: mobile_app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find test -type f -name '*_test.dart' ! -path 'test/uat_compiled_environment_test.dart' -print0 | sort -z)
          test "${#tests[@]}" -gt 0
          flutter test --no-pub --timeout=60s "${tests[@]}"
      - name: Compiled UAT contract
        working-directory: mobile_app
        run: >-
          flutter test --no-pub
          --dart-define=APP_ENVIRONMENT=uat
          --dart-define=API_BASE_URL=${{ env.UAT_API_BASE_URL }}
          --dart-define=APP_BUILD_NUMBER=1573
          test/uat_compiled_environment_test.dart test/push_registration_guard_test.dart
      - name: Source remains unchanged
        run: git diff --exit-code -- mobile_app/lib mobile_app/android mobile_app/assets mobile_app/pubspec.yaml
