name: Apply Financial V1 Flutter Finalization V2

on:
  push:
    branches: [feature/financial-v1-impl]
    paths:
      - '.github/workflows/apply-financial-v1-flutter-finalization-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/financial-v1-impl
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true

      - name: Prepare guarded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/finalize_financial_v1_flutter.py')
          s=p.read_text(encoding='utf-8')
          old="replace_once(p, \"import '../../account/data/auth_controller.dart';\\n\", \"import '../../account/data/auth_controller.dart';\\nimport '../../financial/data/financial_repository.dart';\\n\")"
          new="replace_once(p, \"import '../../regions/data/region_repository.dart';\\n\", \"import '../../financial/data/financial_repository.dart';\\nimport '../../regions/data/region_repository.dart';\\n\")"
          if old not in s: raise SystemExit('GM import repair anchor missing')
          s=s.replace(old,new,1)
          marker="print('Financial V1 Flutter finalization patch applied')"
          extra='''replace_once(p,\n"class _DataRow { const _DataRow(this.label, this.value); final String label; final int value; }",\n"class _DataRow { const _DataRow(this.label, this.value); final String label; final Object value; }")\nreplace_once(p,\n"double? _asDouble(dynamic value){if(value is num)return value.toDouble();return double.tryParse(value?.toString()??'');}",\n"double? _asDouble(dynamic value){if(value is num)return value.toDouble();return double.tryParse(value?.toString()??'');}\\nString _formatMoney(double? value){final amount=(value??0).round().toString();final out=StringBuffer();for(var i=0;i<amount.length;i++){final remaining=amount.length-i;out.write(amount[i]);if(remaining>1&&remaining%3==1)out.write(',');}return '$out YER';}")\n\nprint('Financial V1 Flutter finalization patch applied')'''
          if marker not in s: raise SystemExit('script marker missing')
          p.write_text(s.replace(marker,extra,1),encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/finalize_financial_v1_flutter.py

      - name: Apply final source patch
        shell: bash
        run: |
          python3 .github/scripts/finalize_financial_v1_flutter.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend-api-runtime/tests/Feature/FinancialV1ApiTest.php')
          s=p.read_text(encoding='utf-8')
          pairs={
            '/api/admin/support/tasks?scope=inbox&type=payment_review':'/api/admin/workspace/tasks?scope=inbox&type=payment_review',
            '/api/admin/support/tasks/$taskId/claim':'/api/admin/workspace/tasks/$taskId/claim',
          }
          for old,new in pairs.items():
              if s.count(old)!=1: raise SystemExit(f'test route anchor changed: {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Resolve exact brace lints reported by Dart analyzer
        shell: bash
        run: |
          cd mobile_app
          flutter pub get
          FILES='lib/features/properties/presentation/listing_editor_screen.dart lib/features/properties/presentation/my_listings_screen.dart lib/features/support/presentation/support_tasks_screen.dart lib/features/admin/presentation/general_manager_pages.dart lib/features/financial/data/financial_repository.dart lib/features/financial/domain/financial_models.dart'
          dart format $FILES
          dart analyze --format=machine > /tmp/analyze.machine || true
          python3 - <<'PY'
          from pathlib import Path

          root=Path.cwd().resolve()
          diagnostics=[]
          for raw in Path('/tmp/analyze.machine').read_text(encoding='utf-8').splitlines():
              parts=raw.split('|')
              if len(parts)<8 or parts[2].upper()!='CURLY_BRACES_IN_FLOW_CONTROL_STRUCTURES': continue
              p=Path(parts[3])
              if p.is_absolute(): p=p.resolve().relative_to(root)
              diagnostics.append((str(p),int(parts[4])))
          if not diagnostics:
              print(Path('/tmp/analyze.machine').read_text(encoding='utf-8')[:4000])
              raise SystemExit('No brace diagnostics parsed from dart analyze --format=machine')
          allowed={
            'lib/features/admin/presentation/general_manager_pages.dart',
            'lib/features/financial/data/financial_repository.dart',
            'lib/features/properties/presentation/listing_editor_screen.dart',
            'lib/features/properties/presentation/my_listings_screen.dart',
            'lib/features/support/presentation/support_tasks_screen.dart',
          }
          bad=sorted({p for p,_ in diagnostics if p not in allowed})
          if bad: raise SystemExit(f'Unexpected lint files: {bad}')

          def line_start(text,n):
              lines=text.splitlines(keepends=True)
              if n<1 or n>len(lines): raise SystemExit(f'bad line {n}')
              return sum(map(len,lines[:n-1])),sum(map(len,lines[:n]))

          def close_paren(text,op):
              depth=0; quote=None; esc=False
              for i in range(op,len(text)):
                  c=text[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      continue
                  if c in "'\"": quote=c
                  elif c=='(': depth+=1
                  elif c==')':
                      depth-=1
                      if depth==0: return i
              raise SystemExit('unmatched condition')

          def stmt_end(text,start):
              par=brk=brc=0; quote=None; esc=False
              for i in range(start,len(text)):
                  c=text[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      continue
                  if c in "'\"": quote=c
                  elif c=='(': par+=1
                  elif c==')': par-=1
                  elif c=='[': brk+=1
                  elif c==']': brk-=1
                  elif c=='{': brc+=1
                  elif c=='}': brc-=1
                  elif c==';' and par==0 and brk==0 and brc==0: return i
              raise SystemExit('statement end not found')

          def brace(path,line_no):
              p=Path(path); text=p.read_text(encoding='utf-8')
              a,b=line_start(text,line_no); line=text[a:b]
              rel=line.find('if')
              while rel>=0:
                  before=line[rel-1] if rel else ' '
                  after=line[rel+2] if rel+2<len(line) else ' '
                  if not(before.isalnum() or before=='_') and not(after.isalnum() or after=='_'): break
                  rel=line.find('if',rel+2)
              if rel<0: raise SystemExit(f'{path}:{line_no}: no if token')
              ip=a+rel; op=text.find('(',ip); cp=close_paren(text,op)
              j=cp+1
              while j<len(text) and text[j].isspace(): j+=1
              if text[j]=='{': raise SystemExit(f'{path}:{line_no}: already braced')
              for kw in ('if','for','while','switch','try','do'):
                  if text.startswith(kw,j) and (j+len(kw)==len(text) or not(text[j+len(kw)].isalnum() or text[j+len(kw)]=='_')):
                      raise SystemExit(f'{path}:{line_no}: complex body {kw}')
              end=stmt_end(text,j)
              indent=text[text.rfind('\n',0,ip)+1:ip]
              p.write_text(text[:cp+1]+' {'+text[cp+1:end+1]+'\n'+indent+'}'+text[end+1:],encoding='utf-8')

          grouped={}
          for p,n in diagnostics: grouped.setdefault(p,[]).append(n)
          for p,lines in grouped.items():
              for n in sorted(set(lines),reverse=True): brace(p,n)
          print(f'Braced {len(diagnostics)} analyzer-reported if statements')
          PY
          dart format $FILES
          flutter analyze

      - name: Commit finalized source and remove helpers
        shell: bash
        run: |
          git diff --check
          rm -f .github/scripts/finalize_financial_v1_flutter.py
          rm -f .github/workflows/apply-financial-v1-flutter-finalization.yml
          rm -f .github/workflows/apply-financial-v1-flutter-finalization-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Financial V1 Flutter experience'
          git push origin HEAD:feature/financial-v1-impl
