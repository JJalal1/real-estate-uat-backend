name: Phase23 ordinary-main native prefetch1611
# One ordinary main.dart UAT installer and a bounded idle-to-browse prefetch pass.
# Let the real 60-second foreground estimate expire before one uncached zoom89.
# Do not alter policy thresholds, inject throughput, or replay accepted journeys.
# Reuses the reviewed2ec3a81 product components and the already verified review recipient.
# No replay of accepted erasure, notifications, upgrade or private-page journeys.
on:
  push:
    branches: [work/phase23-acceptance-20261111]
    paths:
      - .github/workflows/phase23-native-prefetch.yml
permissions:
  contents: read
concurrency:
  group: phase23-native
  cancel-in-progress: false
env:
  UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api
  PHASE23_PREFETCH_ON: 'true'
  PHASE23_REVIEWED_SOURCE: '2ec3a81c1b047aa011a035d5f1eaecf06e3bf0a0'
  PHASE23_RECIPIENT_SHA256: 'b53bdbc6d97e75db5a95207e198ebbd9900af017690585e26ccb79c599008070'
jobs:
  collector-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Verify the existing recipient and base review channel
        env:
          AQER_PHASE1_TEST_ACCESS_JSON: ${{ secrets.AQER_PHASE1_TEST_ACCESS_JSON }}
          AQER_PHASE23_ACTOR_ALLOWLIST_ATTESTATION: ''
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from run_phase23_native import native_access
          from phase1_native_account_readiness import SECRET_NAME
          cert=Path('scripts/phase23_recipient.pem')
          assert hashlib.sha256(cert.read_bytes()).hexdigest()==os.environ['PHASE23_RECIPIENT_SHA256'], 'review_recipient_changed'
          base=native_access({SECRET_NAME:os.environ.get(SECRET_NAME,'')})
          assert {'broker','support','regular'} <= set(base['phones'])
          receipt={'schema':1,'purpose':'phase23 ordinary-main prefetch review channel',
                   'source_sha':os.environ['GITHUB_SHA'],'base_aliases':sorted(base['phones']),
                   'recipient_sha256':os.environ['PHASE23_RECIPIENT_SHA256'],'no_login_performed':True}
          del base
          out=Path('phase23-channel-sealed');out.mkdir(mode=0o700)
          plain=out/'probe.json';plain.write_text(json.dumps(receipt,sort_keys=True)+'\n')
          cipher=out/'probe.cms'
          subprocess.run(['openssl','cms','-encrypt','-aes-256-cbc','-binary','-outform','DER',
                          '-in',str(plain),'-out',str(cipher),'scripts/phase23_recipient.pem'],check=True)
          plain.unlink()
          public={'source_sha':receipt['source_sha'],'cipher_sha256':hashlib.sha256(cipher.read_bytes()).hexdigest(),
                  'base_roster_ready':True,'recipient_sha256':receipt['recipient_sha256'],'no_login_performed':True}
          (out/'CHANNEL_RECEIPT.json').write_text(json.dumps(public,sort_keys=True)+'\n')
          print(json.dumps(public,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase23-channel-${{ github.run_id }}
          path: phase23-channel-sealed/
          retention-days: 30
          if-no-files-found: error
  native:
    if: ${{ contains(github.event.head_commit.message, '[run-native-prefetch]') && !contains(github.event.head_commit.message, '[collector-only]') }}
    needs: collector-safety
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify reviewed product components and secure channel
        env:
          AQER_PHASE1_TEST_ACCESS_JSON: ${{ secrets.AQER_PHASE1_TEST_ACCESS_JSON }}
        run: |
          python3 -B - <<'PY'
          import hashlib,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from phase23_preflight import guard,http
          from phase1_native_account_readiness import SECRET_NAME,validate_access
          guard(os.environ)
          assert hashlib.sha256(Path('scripts/phase23_recipient.pem').read_bytes()).hexdigest()==os.environ['PHASE23_RECIPIENT_SHA256'], 'review_recipient_changed'
          for component in ('mobile_app','backend-api-runtime'):
              actual=subprocess.check_output(['git','rev-parse','HEAD:'+component],text=True).strip()
              reviewed=subprocess.check_output(['git','rev-parse',os.environ['PHASE23_REVIEWED_SOURCE']+':'+component],text=True).strip()
              assert actual==reviewed, 'reviewed_product_component_changed'
          access=validate_access(os.environ.pop(SECRET_NAME,''))
          assert {'broker','support','regular'} <= set(access['phones'])
          del access
          code,body=http('GET','/properties?per_page=2')
          assert code == 200, 'public_discovery_readiness_required'
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('PHASE23_BUILD='+str(1611)+'\n')
              env.write('GRADLE_USER_HOME='+os.environ['RUNNER_TEMP']+'/aqer-native-account-gradle\n')
          print('AQER_PHASE23_CHANNEL_AND_SOURCE_READY')
          PY
          test -c /dev/kvm
          curl --fail --silent --show-error --max-time 45 --output /dev/null "$UAT_API_BASE_URL/health"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install only the existing pinned evidence dependencies
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.3.0 cryptography==50.0.2
          npm ci --ignore-scripts --omit=dev --prefix .github/actions/phase1-review
      - name: Reuse only reviewed public Gradle dependencies
        id: gradle-deps
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
          key: aqer-phase1-public-gradle-v1-${{ runner.os }}-jdk17-flutter3273-api36-ad06237b7aceaaba2ea4833b822d61753244af41-${{ hashFiles('mobile_app/pubspec.lock', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties', 'mobile_app/android/settings.gradle*', 'mobile_app/android/build.gradle*', 'docs/ui-transplant-v3/pubspec_overrides.yaml') }}
      - name: Reuse the validated optional UAT Firebase client importer
        env:
          AQER_UAT_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.AQER_UAT_GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 -B scripts/import_ci_uat_firebase.py
      - name: Build one ordinary-main UAT installer from the reviewed components
        working-directory: mobile_app
        env:
          AQER_ALLOW_DEBUG_RELEASE_SIGNING: 'true'
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
          # Reuse full green source gates; verify only this build's compiled experiment boundary.
          flutter test --no-pub test/conditional_prefetch_test.dart \
            --plain-name 'compiled prefetch experiment stays within the selected UAT configuration' \
            --dart-define=APP_ENVIRONMENT=uat --dart-define=AQER_CONDITIONAL_PREFETCH=true \
            --dart-define=AQER_PREFETCH_EXPECT_ENABLED=true
          flutter build apk --target lib/main.dart --flavor uat --release --no-pub --build-number="$PHASE23_BUILD" \
            --dart-define=APP_BUILD_NUMBER="$PHASE23_BUILD" --dart-define=APP_ENVIRONMENT=uat \
            --dart-define=API_BASE_URL="$UAT_API_BASE_URL" \
            --dart-define=APP_SHARE_BASE_URL=https://real-estate-uat-api-frankfurt.onrender.com \
            --dart-define=AQER_CONDITIONAL_PREFETCH="$PHASE23_PREFETCH_ON" \
            --dart-define=AQER_NATIVE_NETWORK_TRACE=true
          git diff --exit-code -- lib android assets pubspec.yaml
      - name: Verify and encrypt the ordinary-main installer
        run: |
          python3 -B scripts/prepare_phase23_native.py
          python3 -B - <<'PYVERIFY'
          import json,zipfile
          from pathlib import Path
          root=Path('phase23-native-private')
          receipt=json.loads((root/'APK_VERIFICATION.json').read_text())
          assert receipt['version_code']==1611
          experiments=receipt['experiments']
          assert experiments.get('conditional_prefetch') is True
          assert not any(experiments.get(k) for k in ('callback_harness','private_pages'))
          with zipfile.ZipFile(root/'target.apk') as apk:
              libs=[name for name in apk.namelist() if name.endswith('/libapp.so')]
              for name in libs:
                  content=apk.read(name)
                  assert b'AQER_PHASE23_PRIVATE_PAGES_READ_ONLY_V1' not in content
                  assert b'AQER_PHASE23_CALLBACK_READ_ONLY_V1' not in content
          print('AQER_PHASE23_ORDINARY_MAIN_1611_VERIFIED')
          PYVERIFY
      - name: Preserve only public dependencies before the native session
        if: steps.gradle-deps.outputs.cache-hit != 'true' && steps.gradle-deps.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
          key: ${{ steps.gradle-deps.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: phase23-installer-${{ github.run_id }}
          path: phase23-installer-sealed/
          retention-days: 30
          if-no-files-found: error
      - name: Prepare one disposable API36 KVM device
        run: |
          (cd mobile_app/android && ./gradlew --stop --gradle-user-home "$GRADLE_USER_HOME")
          sdkmanager --install 'emulator' 'system-images;android-36;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/phase23-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --force --name aqer-phase23 --device pixel \
            --package 'system-images;android-36;google_apis;x86_64'
          python3 - "$ANDROID_AVD_HOME/aqer-phase23.avd/config.ini" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1]); settings={'hw.lcd.width':'1080','hw.lcd.height':'1920','hw.lcd.density':'420','showDeviceFrame':'no'}
          lines=[s for s in path.read_text().splitlines() if s.split('=',1)[0].strip() not in settings]
          path.write_text('\n'.join(lines+[k+'='+v for k,v in settings.items()])+'\n')
          PY
          sudo chmod 666 /dev/kvm
          printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\n' \
            "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/emulator/emulator" -avd aqer-phase23 -port 5554 -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader -accel on -memory 2048 -cores 2 \
            > "$RUNNER_TEMP/phase23-emulator.log" 2>&1 &
          deadline=$((SECONDS+250))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null || true)" = 1 ] && \
               [ "$(adb -s emulator-5554 shell getprop sys.user.0.ce_available 2>/dev/null || true)" = true ]; then break; fi
            sleep 2
          done
          test "$SECONDS" -lt "$deadline"
      - name: Prepare synthetic media before the reviewed native session
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          from PIL.TiffImagePlugin import IFDRational as R
          import subprocess
          folder=Path('phase23-native-private')
          image=Image.new('RGB',(1280,960),'#dbeaf1'); draw=ImageDraw.Draw(image)
          draw.rectangle((0,720,1280,960),fill='#baa980')
          draw.rectangle((260,210,1020,780),fill='#e7d5b9',outline='#6c5137',width=8)
          for y in (290,440,590):
            for x in (330,560,790): draw.rectangle((x,y,x+120,y+90),fill='#536d81',outline='white',width=6)
          draw.rectangle((570,650,710,780),fill='#72573f')
          draw.text((25,25),'AQER UAT SYNTHETIC PROPERTY - NOT A REAL LISTING',fill='black')
          image.save(folder/'phase23-property.jpg',quality=90)
          exif=Image.Exif(); exif[274]=6; exif[271]='AQER_SYNTHETIC_TEST'
          exif[34853]={1:'N',2:(R(15),R(20),R(0)),3:'E',4:(R(44),R(10),R(0))}
          image.save(folder/'phase23-rotated-exif.jpg',quality=90,exif=exif)
          wrong=Image.new('RGB',(800,600),'#9e1b65'); pen=ImageDraw.Draw(wrong)
          for x in range(0,800,40): pen.line((x,0,800-x,600),fill='#ffff00',width=8)
          pen.text((30,30),'SYNTHETIC UNSUITABLE MEDIA TEST',fill='white')
          wrong.save(folder/'phase23-unsuitable.jpg',quality=85)
          large=Image.effect_noise((2048,1536),80).convert('RGB')
          large.save(folder/'phase23-large.jpg',quality=94)
          PY
      - name: Review and execute bounded UAT native commands
        uses: ./.github/actions/phase1-review
        with:
          owner-timeout-seconds: '7000'
          cleanup-grace-seconds: '180'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AQER_PHASE1_TEST_ACCESS_JSON: ${{ secrets.AQER_PHASE1_TEST_ACCESS_JSON }}
          # Public guest navigation only is planned; no login or private mutation is needed.
          # Existing base credentials remain confined to the unchanged executor's redaction boundary.
          AQER_PHASE23_ACTOR_ALLOWLIST_ATTESTATION: ''
      - name: Stop the disposable device
        if: always()
        run: adb -s emulator-5554 emu kill || true
