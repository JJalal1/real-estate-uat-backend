name: Wave2 Home and map search
on:
  pull_request:
    branches: [work/wave1-experience-20261028, work/owner-ux-wave-20261027, work/wave2-review-current]
    paths: ['mobile_app/**', 'backend-api-runtime/**', 'scripts/probe_wave2_public_search.py', '.github/workflows/wave2-home-search.yml']
permissions:
  contents: read
concurrency:
  group: wave2-search-${{ github.ref }}
  cancel-in-progress: true
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Existing locked dependencies
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Strict original analysis gate
        working-directory: mobile_app
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Inline Home and published suggestions behavioral acceptance
        if: ${{ !cancelled() }}
        working-directory: mobile_app
        run: |
          flutter test test/wave2_home_search_test.dart test/wave1_experience_ui_test.dart \
            test/public_discovery_cancellation_test.dart test/smart_search_pagination_recovery_test.dart \
            test/ui_transplant_v3_home_test.dart test/wave3_ai_design_ui_test.dart --reporter expanded
      - name: Actual loopback HTTP media loading regression
        if: ${{ !cancelled() }}
        working-directory: mobile_app
        run: >-
          flutter test test/viewport_network_measurement_test.dart test/discovery_http_acceptance_test.dart
          --dart-define=AQER_VIEWPORT_HTTP_PROBE=true --dart-define=AQER_DISCOVERY_HTTP_PROBE=true
          --name='count actual home HTTP requests|fast ballistic scrolling|actual HTTP delayed load'
          --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave2-search-previews-and-http
          path: |
            mobile_app/build/owner-ux-preview/w2-*.png
            mobile_app/viewport-*-metrics.json
          if-no-files-found: warn
          retention-days: 7
  public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: aqer-free-uat-http-measurements
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Existing real UAT public API compatibility without writes
        run: python3 -B scripts/probe_wave2_public_search.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave2-public-search-uat
          path: wave2-public-search-uat.json
          if-no-files-found: error
          retention-days: 7
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 425f019070db73253ff77181c77623d28225cc25
          persist-credentials: false
      - name: Verify and read pinned original eBroker source without building it
        run: |
          test "$(git rev-parse HEAD)" = 425f019070db73253ff77181c77623d28225cc25
          python3 scripts/restore_reference.py --destination verified-reference
          mkdir -p reference-evidence
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          source = Path('verified-reference')
          files = ['app/lib/ui/screens/home/home_screen.dart', 'app/lib/ui/screens/home/search_screen.dart',
                   'app/lib/ui/screens/map/property_map_screen.dart', 'app/lib/ui/screens/filter_screen.dart',
                   'app/lib/ui/screens/home/widgets/property_horizontal_card.dart',
                   'app/lib/ui/screens/widgets/interactive_property_map.dart']
          receipt = {'reference_sha': '425f019070db73253ff77181c77623d28225cc25', 'build_executed': False, 'files': []}
          for name in files:
              body = (source / name).read_bytes()
              target = Path('reference-evidence') / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(body)
              receipt['files'].append({'path':name,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()})
          Path('reference-evidence/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave2-pinned-reference-reading
          path: reference-evidence/
          retention-days: 3
