name: APK cleanup with measured update and offline preservation
'on':
  push:
    branches:
    - work/apk-cleanup-1817-20261117
    paths:
    - mobile_app/**
    - scripts/import_ci_uat_signing.py
    - scripts/verify_v3_dependency_lock.py
    - scripts/verify_apk_cleanup.py
    - scripts/probe_apk_cleanup_upgrade.py
    - scripts/tests/test_apk_cleanup*.py
    - scripts/tests/test_uat_signing_configuration.py
    - docs/apk-cleanup-dependency-policy.json
    - .github/workflows/apk-cleanup*.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: apk-cleanup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signing_readiness:
    name: Public approval policy and boolean signing presence only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      compatible: ${{ steps.readiness.outputs.compatible }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Read the public identity; pending approval is not delivery approval
      id: identity
      run: python3 -B scripts/uat_signing_identity.py --github-output
    - name: Emit readiness without reading secret values
      id: readiness
      env:
        HAS_KEYSTORE: ${{ secrets.AQER_UAT_KEYSTORE_BASE64 != '' }}
        HAS_STORE_PASSWORD: ${{ secrets.AQER_RELEASE_STORE_PASSWORD != '' }}
        HAS_KEY_ALIAS: ${{ secrets.AQER_RELEASE_KEY_ALIAS != '' }}
        HAS_KEY_PASSWORD: ${{ secrets.AQER_RELEASE_KEY_PASSWORD != '' }}
        HAS_CERTIFICATE_PIN: ${{ secrets.AQER_UAT_SIGNING_CERT_SHA256 != '' }}
        APPROVED_CERTIFICATE_PIN_MATCHES: ${{ secrets.AQER_UAT_SIGNING_CERT_SHA256 == steps.identity.outputs.certificate_sha256
          }}
      run: |
        python3 -B - <<'PY'
        import json, os, sys
        from pathlib import Path
        sys.path.insert(0, 'scripts')
        from uat_signing_identity import PRESENCE_NAMES, load_public_identity, signing_readiness
        present = {name: os.environ['HAS_' + name.upper()] == 'true' for name in PRESENCE_NAMES}
        pin_matches = os.environ['APPROVED_CERTIFICATE_PIN_MATCHES'] == 'true'
        receipt = signing_readiness(load_public_identity(), present, pin_matches)
        receipt['source_commit'] = os.environ['GITHUB_SHA']
        output = Path('apk-cleanup-readiness')
        output.mkdir()
        (output / 'SIGNING_READINESS.json').write_text(json.dumps(receipt, indent=2) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
            stream.write('compatible=' + str(receipt['compatible']).lower() + '\n')
        print(json.dumps(receipt, sort_keys=True))
        PY
    - uses: actions/upload-artifact@v4
      with:
        name: apk-cleanup-signing-readiness-${{ github.sha }}
        path: apk-cleanup-readiness/SIGNING_READINESS.json
        retention-days: 14
        if-no-files-found: error
  tests:
    name: Cleanup contracts and affected app regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Existing signing importer contracts with synthetic fixtures only
      env:
        AQER_TEST_RUNNER_SIGNING: 'true'
        AQER_SIGNING_ENVIRONMENT: uat
      run: python3 -B -m unittest discover -s scripts/tests -p test_uat_signing_configuration.py -v
    - name: Public durable signing identity and approval contracts
      run: python3 -B -m unittest discover -s scripts/tests -p test_uat_signing_identity.py -v
    - name: Bounded dependency, APK and Android cleanup guards
      run: python3 -B -m unittest discover -s scripts/tests -p 'test_apk_cleanup*.py' -v
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.27.3
        channel: stable
        cache: true
    - name: Resolve original locked dependencies
      working-directory: mobile_app
      run: |
        cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
        flutter pub get
        python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock --cleanup1818
    - name: Strict analysis
      working-directory: mobile_app
      run: python3 -B ../scripts/check_v3_analysis.py
    - name: Connection detection and affected offline contracts
      working-directory: mobile_app
      run: flutter test test/offline_connection_detection_test.dart test/offline_http_storage_test.dart test/offline_message_outbox_test.dart
        test/offline_photo_and_draft_test.dart test/offline_search_restore_test.dart test/offline_coordinator_intent_test.dart
        test/offline_conversation_loading_test.dart test/private_journey_actor_scope_test.dart test/wave1_public_photo_cache_test.dart
        test/adaptive_image_quality_test.dart test/private_listing_card_photo_test.dart test/message_inbox_pagination_test.dart
        test/session_lifecycle_race_test.dart test/stage6_auth_user_test.dart test/owner_auth_boundary_test.dart
        test/compact_cards_email_login_test.dart test/phase23_draft_network_recovery_test.dart test/phase04_ranked_search_test.dart
        test/phase04_governorates_test.dart test/property_marker_cluster_test.dart test/map_dynamic_filters_1430_test.dart
        test/smart_search_pagination_recovery_test.dart test/public_discovery_cancellation_test.dart --reporter
        expanded --timeout 2m
  build:
    name: Build measured clean and compressed APKs with the durable signer
    needs:
    - tests
    - signing_readiness
    if: ${{ needs.tests.result == 'success' && needs.signing_readiness.outputs.compatible == 'true' && github.event.repository.private
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AQER_SIGNING_ENVIRONMENT: uat
      AQER_ALLOW_DEBUG_RELEASE_SIGNING: 'false'
      ORG_GRADLE_PROJECT_AQER_UAT_APPLICATION_ID: com.aqer.yemen.uat.offline
      ORG_GRADLE_PROJECT_AQER_UAT_APP_NAME: عقار أوفلاين اختبار
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Download the exact verified 1817 baseline
      uses: actions/download-artifact@v4
      with:
        name: connectivity-fix-1817-e91927e9d14994c9101d6f11b8886e666bb930d1
        run-id: 44081151224
        github-token: ${{ github.token }}
        path: apk-cleanup-baseline
    - name: Require approved identity and verified GitHub secret storage
      run: python3 -B scripts/uat_signing_identity.py --require-delivery-approval
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
        packages: platform-tools platforms;android-36 build-tools;36.0.0
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.27.3
        channel: stable
        cache: true
    - name: Reuse existing reviewed public Gradle dependencies
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper/dists
        key: aqer-phase1-public-gradle-v1-${{ runner.os }}-jdk17-flutter3273-api36-ad06237b7aceaaba2ea4833b822d61753244af41-${{
          hashFiles('mobile_app/pubspec.lock', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties', 'mobile_app/android/settings.gradle*',
          'mobile_app/android/build.gradle*', 'docs/ui-transplant-v3/pubspec_overrides.yaml') }}
        restore-keys: aqer-phase1-public-gradle-v1-${{ runner.os }}-jdk17-flutter3273-api36-ad06237b7aceaaba2ea4833b822d61753244af41-
    - name: Resolve original locked dependencies
      working-directory: mobile_app
      run: |
        cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
        flutter pub get
        python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock --cleanup1818
    - name: Validate and stage the GitHub-configured durable UAT key
      env:
        AQER_UAT_KEYSTORE_BASE64: ${{ secrets.AQER_UAT_KEYSTORE_BASE64 }}
        AQER_RELEASE_STORE_PASSWORD: ${{ secrets.AQER_RELEASE_STORE_PASSWORD }}
        AQER_RELEASE_KEY_ALIAS: ${{ secrets.AQER_RELEASE_KEY_ALIAS }}
        AQER_RELEASE_KEY_PASSWORD: ${{ secrets.AQER_RELEASE_KEY_PASSWORD }}
        AQER_UAT_SIGNING_CERT_SHA256: ${{ secrets.AQER_UAT_SIGNING_CERT_SHA256 }}
      run: python3 -B scripts/import_ci_uat_signing.py --required
    - name: Require the imported certificate to match the approved public identity
      run: python3 -B scripts/uat_signing_identity.py --require-delivery-approval --verify-imported-environment
    - name: 'Build 1818: cleaned libraries, native compression false'
      working-directory: mobile_app
      env:
        AQER_RELEASE_STORE_PASSWORD: ${{ secrets.AQER_RELEASE_STORE_PASSWORD }}
        AQER_RELEASE_KEY_ALIAS: ${{ secrets.AQER_RELEASE_KEY_ALIAS }}
        AQER_RELEASE_KEY_PASSWORD: ${{ secrets.AQER_RELEASE_KEY_PASSWORD }}
        ORG_GRADLE_PROJECT_AQER_UAT_COMPRESS_NATIVE_LIBS: 'false'
      run: flutter build apk --flavor uat --release --no-pub --build-number=1818 --dart-define=APP_ENVIRONMENT=uat
        --dart-define=APP_BUILD_NUMBER=1818 --dart-define=APP_PACKAGE_ID=com.aqer.yemen.uat.offline --dart-define=API_BASE_URL=https://real-estate-uat-api-frankfurt.onrender.com/api
        --dart-define=APP_SHARE_BASE_URL=https://real-estate-uat-api-frankfurt.onrender.com --dart-define=AQER_RANKED_DISCOVERY=true
    - name: Verify actual 1818 identity, baseline preservation and packaging
      run: python3 -B scripts/verify_apk_cleanup.py --version 1818 --baseline-apk apk-cleanup-baseline/AQER-UAT-1817-Durable-Update.apk
        --baseline-receipt apk-cleanup-baseline/APK_VERIFICATION.json
    - uses: actions/upload-artifact@v4
      if: success() && github.event.repository.private
      with:
        name: apk-cleanup-1818-${{ github.sha }}
        path: |-
          mobile_app/apk-cleanup-proof/1818/AQER-UAT-1818-Clean.apk
          mobile_app/apk-cleanup-proof/1818/APK_VERIFICATION.json
        retention-days: 14
        if-no-files-found: error
    - name: 'Build 1819: cleaned libraries, native compression true'
      working-directory: mobile_app
      env:
        AQER_RELEASE_STORE_PASSWORD: ${{ secrets.AQER_RELEASE_STORE_PASSWORD }}
        AQER_RELEASE_KEY_ALIAS: ${{ secrets.AQER_RELEASE_KEY_ALIAS }}
        AQER_RELEASE_KEY_PASSWORD: ${{ secrets.AQER_RELEASE_KEY_PASSWORD }}
        ORG_GRADLE_PROJECT_AQER_UAT_COMPRESS_NATIVE_LIBS: 'true'
      run: flutter build apk --flavor uat --release --no-pub --build-number=1819 --dart-define=APP_ENVIRONMENT=uat
        --dart-define=APP_BUILD_NUMBER=1819 --dart-define=APP_PACKAGE_ID=com.aqer.yemen.uat.offline --dart-define=API_BASE_URL=https://real-estate-uat-api-frankfurt.onrender.com/api
        --dart-define=APP_SHARE_BASE_URL=https://real-estate-uat-api-frankfurt.onrender.com --dart-define=AQER_RANKED_DISCOVERY=true
    - name: Verify actual 1819 identity, baseline preservation and packaging
      run: python3 -B scripts/verify_apk_cleanup.py --version 1819 --baseline-apk apk-cleanup-baseline/AQER-UAT-1817-Durable-Update.apk
        --baseline-receipt apk-cleanup-baseline/APK_VERIFICATION.json
    - uses: actions/upload-artifact@v4
      if: success() && github.event.repository.private
      with:
        name: apk-cleanup-1819-${{ github.sha }}
        path: |-
          mobile_app/apk-cleanup-proof/1819/AQER-UAT-1819-Clean.apk
          mobile_app/apk-cleanup-proof/1819/APK_VERIFICATION.json
        retention-days: 14
        if-no-files-found: error
    - name: Remove staged signing key even after failure or cancellation
      if: always()
      run: |
        python3 -B - <<'PY'
        import os
        from pathlib import Path
        directory = Path(os.environ['RUNNER_TEMP']) / 'aqer-uat-signing'
        if directory.is_symlink():
            raise RuntimeError('refuse_unexpected_signing_directory_symlink')
        (directory / 'uat-release.keystore').unlink(missing_ok=True)
        if directory.exists():
            directory.rmdir()
        print('AQER_UAT_SIGNING_MATERIAL_REMOVED')
        PY
  offline_native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AQER_OFFLINE_NATIVE_PROBE: 'true'
      AQER_ALLOW_DEBUG_RELEASE_SIGNING: 'true'
      ORG_GRADLE_PROJECT_AQER_UAT_APPLICATION_ID: com.aqer.yemen.uat.offlineprobe
      ORG_GRADLE_PROJECT_AQER_UAT_APP_NAME: Offline Native Probe
      ORG_GRADLE_PROJECT_AQER_UAT_COMPRESS_NATIVE_LIBS: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Reclaim unused SDK space on disposable runner
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-36 build-tools;36.0.0
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.27.3
        channel: stable
        cache: true
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper/dists
        key: aqer-phase1-public-gradle-v1-${{ runner.os }}-jdk17-flutter3273-api36-ad06237b7aceaaba2ea4833b822d61753244af41-${{
          hashFiles('mobile_app/pubspec.lock', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties', 'mobile_app/android/settings.gradle*',
          'mobile_app/android/build.gradle*', 'docs/ui-transplant-v3/pubspec_overrides.yaml') }}
        restore-keys: aqer-phase1-public-gradle-v1-${{ runner.os }}-jdk17-flutter3273-api36-ad06237b7aceaaba2ea4833b822d61753244af41-
    - name: Build isolated synthetic probe with unchanged product components
      working-directory: mobile_app
      run: |
        cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
        flutter pub get
        python3 ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock --cleanup1818
        test ! -e lib/offline_unified_native_main.dart
        cp ../scripts/offline_unified_native_main.dart lib/offline_unified_native_main.dart
        flutter analyze --fatal-infos lib/offline_unified_native_main.dart
        flutter build apk --flavor uat --release --no-pub --target=lib/offline_unified_native_main.dart --target-platform=android-x64 --build-number=1815 \
          --dart-define=APP_ENVIRONMENT=uat --dart-define=AQER_OFFLINE_NATIVE_PROBE=true \
          --dart-define=APP_PACKAGE_ID=com.aqer.yemen.uat.offlineprobe --dart-define=API_BASE_URL=https://synthetic.invalid/api
        rm lib/offline_unified_native_main.dart
        git diff --exit-code -- lib android assets
    - name: Boot a disposable API36 emulator
      run: |
        test -c /dev/kvm
        (cd mobile_app/android && ./gradlew --stop)
        sdkmanager --install 'emulator' 'system-images;android-36;google_apis;x86_64'
        export ANDROID_USER_HOME="$RUNNER_TEMP/offline-native-android"
        export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
        export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
        mkdir -p "$ANDROID_AVD_HOME"
        avdmanager create avd --force --name aqer-offline-native --device pixel --path "$ANDROID_AVD_HOME/aqer-offline-native.avd" --package 'system-images;android-36;google_apis;x86_64'
        python3 - "$ANDROID_AVD_HOME/aqer-offline-native.avd/config.ini" <<'PYCONF'
        from pathlib import Path
        import sys
        path=Path(sys.argv[1]); values={'hw.lcd.width':'540','hw.lcd.height':'960','hw.lcd.density':'210','showDeviceFrame':'no','hw.camera.back':'none','hw.camera.front':'none','disk.dataPartition.size':'2048M'}
        lines=[line for line in path.read_text().splitlines() if line.split('=',1)[0].strip() not in values]
        path.write_text('\n'.join(lines+[key+'='+value for key,value in values.items()])+'\n')
        PYCONF
        export QT_QPA_PLATFORM=offscreen
        printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
        df -h "$RUNNER_TEMP"
        sudo chmod 666 /dev/kvm
        "$ANDROID_HOME/emulator/emulator" -avd aqer-offline-native -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -accel on -memory 2048 -cores 2 > "$RUNNER_TEMP/offline-native-emulator.log" 2>&1 &
        emulator_pid=$!
        deadline=$((SECONDS+250))
        while [ "$SECONDS" -lt "$deadline" ]; do
          if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/offline-native-emulator.log"; exit 1; fi
          if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null || true)" = 1 ] && [ "$(adb -s emulator-5554 shell getprop sys.user.0.ce_available 2>/dev/null || true)" = true ]; then break; fi
          sleep 2
        done
        if [ "$SECONDS" -ge "$deadline" ]; then cat "$RUNNER_TEMP/offline-native-emulator.log"; adb -s emulator-5554 shell getprop sys.boot_completed || true; exit 1; fi
    - name: Restart offline and reconnect with real encrypted Android storage
      run: python3 -B scripts/run_offline_unified_native.py --apk mobile_app/build/app/outputs/flutter-apk/app-uat-release.apk
    - uses: actions/upload-artifact@v4
      if: always() && github.event.repository.private
      with:
        name: apk-cleanup-offline-native-${{ github.sha }}
        path: offline-native-proof/OFFLINE_NATIVE_RECEIPT.json
        retention-days: 14
        if-no-files-found: warn
    - name: Stop disposable emulator
      if: always()
      run: adb -s emulator-5554 emu kill || true
    name: Existing offline services after dependency cleanup and compressed native loading
    needs:
    - tests
  android_compare:
    name: Compare 1817 to cleaned and compressed updates
    needs:
    - build
    - offline_native
    if: ${{ needs.build.result == 'success' && needs.offline_native.result == 'success' && github.event.repository.private
      }}
    uses: ./.github/workflows/apk-cleanup-android.yml
    with:
      source_sha: ${{ github.sha }}
      clean_artifact: apk-cleanup-1818-${{ github.sha }}
      compressed_artifact: apk-cleanup-1819-${{ github.sha }}
