name: Phase23 new private large-image receipt
on:
  push:
    branches: [work/phase23-acceptance-20261111]
    paths:
      - scripts/phase23_new_large_media.py
      - .github/workflows/phase23-new-large-media.yml
permissions:
  contents: read
jobs:
  fixture-media:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the existing pinned image-inspection dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Read only the new large synthetic draft image and close sessions
        env:
          AQER_PHASE1_TEST_ACCESS_JSON: ${{ secrets.AQER_PHASE1_TEST_ACCESS_JSON }}
        run: python3 -B scripts/phase23_new_large_media.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase23-new-large-media-${{ github.run_id }}
          path: phase23-private-media-evidence/RECEIPT.json
          retention-days: 30
          if-no-files-found: error
