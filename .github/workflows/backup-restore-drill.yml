name: Encrypted synthetic database and media restore
on:
  pull_request:
    branches: [work/wave2-review-current]
    paths:
      - 'scripts/backup_restore_drill.py'
      - '.github/workflows/backup-restore-drill.yml'
permissions:
  contents: read
concurrency:
  group: encrypted-restore-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  restore:
    name: Independent encrypted PostgreSQL and media recovery
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install age without accessing any cloud service
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
      - name: Restore synthetic database and actual media bytes in isolated containers
        run: python3 -B scripts/backup_restore_drill.py --evidence dist/SYNTHETIC_RESTORE_DRILL.json
      - name: Save safe evidence only
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-restore-evidence-${{ github.run_number }}
          path: dist/SYNTHETIC_RESTORE_DRILL.json
          if-no-files-found: error
          retention-days: 14
