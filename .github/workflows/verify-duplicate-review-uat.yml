name: Verify Frankfurt UAT listing duplicate review

on:
  push:
    branches: [work/uat-listing-duplicate-live-20261120]
    paths: [scripts/uat_listing_duplicate_deploy_receipt.json]
permissions:
  contents: read
concurrency:
  group: frankfurt-uat-listing-duplicate-review
  cancel-in-progress: false

jobs:
  synthetic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check three synthetic listings and clean them up
        env:
          AQER_PHASE1_TEST_ACCESS_JSON: ${{ secrets.AQER_PHASE1_TEST_ACCESS_JSON }}
        run: |
          python3 -B scripts/verify_duplicate_review_uat.py \
            --deployment-receipt scripts/uat_listing_duplicate_deploy_receipt.json \
            --photo scripts/uat_listing_duplicate_synthetic_apartment.png
