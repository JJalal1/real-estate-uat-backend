name: Temporary Support Finalize

on:
  push:
    branches:
      - fix/support-inbox-completed-assignment-flow
    paths:
      - .github/workflows/temp-support-followup-check.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/support-inbox-completed-assignment-flow
          fetch-depth: 0
      - name: Apply verified repair-path alignment
        run: python3 tools/temp_align_support_repair_path.py
      - name: Remove temporary verification files and commit
        run: |
          rm -f tools/temp_align_support_repair_path.py
          rm -f .github/workflows/temp-support-followup-check.yml
          rm -f backend_support_diagnostic.txt flutter_analyze_diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize support completed inbox workflow"
          git push origin HEAD:fix/support-inbox-completed-assignment-flow
