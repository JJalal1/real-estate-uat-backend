name: Temporary Support Followup Check

on:
  push:
    branches:
      - fix/support-inbox-completed-assignment-flow
    paths:
      - .github/workflows/temp-support-followup-check.yml
      - tools/temp_align_support_repair_path.py

permissions:
  contents: write

env:
  UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/support-inbox-completed-assignment-flow
          fetch-depth: 0
      - name: Align repair path
        run: python3 tools/temp_align_support_repair_path.py
      - name: Commit repair-path alignment
        run: |
          rm tools/temp_align_support_repair_path.py
          rm -f backend_support_diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align support completed workflow repair path"
          git push origin HEAD:fix/support-inbox-completed-assignment-flow
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Backend dependencies
        working-directory: backend-api-runtime
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Backend targeted checks
        working-directory: backend-api-runtime
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: php artisan test tests/Feature/UatSupportCompletedInboxFlowApiTest.php tests/Feature/UatSupportManagerAgentWorkflowApiTest.php tests/Feature/UatAdminSupportWorkspaceApiTest.php --display-warnings --fail-on-warning --fail-on-risky
      - name: Full Laravel suite
        working-directory: backend-api-runtime
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: php artisan test --display-warnings --fail-on-warning --fail-on-risky
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - working-directory: mobile_app
        run: flutter pub get
      - working-directory: mobile_app
        run: flutter analyze
      - working-directory: mobile_app
        run: flutter test test/support_completed_inbox_flow_test.dart test/support_manager_agent_workflow_test.dart
      - name: Full Flutter suite
        working-directory: mobile_app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test -maxdepth 1 -type f -name '*_test.dart' ! -name 'uat_compiled_environment_test.dart' | sort)
          flutter test "${tests[@]}"
      - name: Verify Frankfurt endpoint contract
        working-directory: mobile_app
        run: flutter test --dart-define=APP_ENVIRONMENT=uat --dart-define=API_BASE_URL=${{ env.UAT_API_BASE_URL }} test/uat_compiled_environment_test.dart
