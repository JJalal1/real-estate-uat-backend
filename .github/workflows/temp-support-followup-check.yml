name: Temporary Support Followup Check

on:
  push:
    branches:
      - fix/support-inbox-completed-assignment-flow
    paths:
      - .github/workflows/temp-support-followup-check.yml
      - backend-api-runtime/tests/Feature/UatSupportCompletedInboxFlowApiTest.php

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/support-inbox-completed-assignment-flow
          fetch-depth: 0
      - name: Backend targeted checks
        working-directory: backend-api-runtime
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        shell: bash
        run: |
          set +e
          cp .env.example .env || true
          composer install --no-interaction --prefer-dist --no-progress
          php artisan test tests/Feature/UatSupportCompletedInboxFlowApiTest.php tests/Feature/UatSupportManagerAgentWorkflowApiTest.php tests/Feature/UatAdminSupportWorkspaceApiTest.php --display-warnings --fail-on-warning --fail-on-risky > /tmp/backend-support.txt 2>&1
          code=$?
          cat /tmp/backend-support.txt
          if [ $code -ne 0 ]; then
            cp /tmp/backend-support.txt ../backend_support_diagnostic.txt
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f backend_support_diagnostic.txt
            git commit -m "Capture support backend diagnostic"
            git push origin HEAD:fix/support-inbox-completed-assignment-flow
          fi
          exit $code
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - working-directory: mobile_app
        run: flutter pub get
      - working-directory: mobile_app
        run: flutter analyze
      - working-directory: mobile_app
        run: flutter test test/support_completed_inbox_flow_test.dart test/support_manager_agent_workflow_test.dart
