name: Temporary Support Followup Check

on:
  push:
    branches:
      - fix/support-inbox-completed-assignment-flow
    paths:
      - .github/workflows/temp-support-followup-check.yml

permissions:
  contents: read

jobs:
  diagnose-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/support-inbox-completed-assignment-flow
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - working-directory: mobile_app
        run: flutter pub get
      - name: Capture analyze output
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          cd mobile_app
          flutter analyze > ../flutter_analyze_diagnostic.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-diagnostic
          path: flutter_analyze_diagnostic.txt
      - name: Fail if analyze failed
        if: steps.analyze.outcome != 'success'
        run: exit 1
