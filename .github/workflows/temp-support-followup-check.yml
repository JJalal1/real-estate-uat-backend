name: Temporary Support Followup Check

on:
  push:
    branches:
      - fix/support-inbox-completed-assignment-flow
    paths:
      - .github/workflows/temp-support-followup-check.yml

permissions:
  contents: write

jobs:
  diagnose-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/support-inbox-completed-assignment-flow
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - working-directory: mobile_app
        run: flutter pub get
      - name: Capture analyze output
        shell: bash
        run: |
          set +e
          cd mobile_app
          flutter analyze > ../flutter_analyze_diagnostic.txt 2>&1
          code=$?
          cat ../flutter_analyze_diagnostic.txt
          if [ $code -ne 0 ]; then
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f flutter_analyze_diagnostic.txt
            git commit -m "Capture Flutter support diagnostic"
            git push origin HEAD:fix/support-inbox-completed-assignment-flow
          fi
          exit $code
