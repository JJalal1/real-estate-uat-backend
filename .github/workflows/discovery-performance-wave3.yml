name: Discovery Performance Wave 3

on:
  push:
    branches: [work/discovery-performance-wave3]
    paths:
      - 'backend-api-runtime/**'
      - 'mobile_app/**'
      - '.github/workflows/discovery-performance-wave3.yml'
concurrency:
  group: discovery-performance-wave3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Laravel discovery regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install locked backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated Laravel test environment
        shell: bash
        run: |
          set -euo pipefail
          key="$(php -r 'echo base64_encode(random_bytes(32));')"
          printf 'APP_KEY=base64:%s\n' "$key" > .env
      - name: Syntax check discovery changes
        run: |
          php -l app/Services/PropertyDiscoveryFilterService.php
          php -l app/Http/Controllers/Api/PropertyController.php
          php -l tests/Feature/DiscoverySearchQualityTest.php
      - name: Run discovery and property regressions
        run: php artisan test tests/Feature/DiscoverySearchQualityTest.php tests/Feature/Stage5PropertyApiTest.php --display-warnings --fail-on-warning --fail-on-risky

  mobile:
    name: Flutter discovery regression
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
      - name: Format changed Dart files with project SDK
        working-directory: mobile_app
        run: dart format lib/features/properties/data/property_repository.dart lib/features/map/domain/property_marker_cluster.dart lib/features/map/presentation/map_screen.dart lib/features/discovery/presentation/assisted_search_screen.dart test/property_marker_cluster_test.dart test/search_query_wave_test.dart
      - name: Persist formatter-only changes
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- mobile_app/lib mobile_app/test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile_app/lib/features/properties/data/property_repository.dart \
              mobile_app/lib/features/map/domain/property_marker_cluster.dart \
              mobile_app/lib/features/map/presentation/map_screen.dart \
              mobile_app/lib/features/discovery/presentation/assisted_search_screen.dart \
              mobile_app/test/property_marker_cluster_test.dart \
              mobile_app/test/search_query_wave_test.dart
            git commit -m "Format discovery wave Dart changes [skip ci]"
            git push origin HEAD:work/discovery-performance-wave3
          fi
      - name: Strict Flutter analysis
        working-directory: mobile_app
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Run discovery behavior tests
        working-directory: mobile_app
        run: flutter test test/property_marker_cluster_test.dart test/search_query_wave_test.dart test/active_wave_discovery_test.dart test/uat_map_location_picker_test.dart --reporter expanded
