name: Phase23 draft reconnect regression
on:
  push:
    branches: [work/phase23-draft-recovery-20261112]
    paths:
      - .github/workflows/phase23-draft-recovery.yml
      - mobile_app/lib/features/properties/presentation/listing_editor_screen.dart
      - mobile_app/test/phase23_draft_network_recovery_test.dart
permissions:
  contents: read
jobs:
  draft-reconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve the approved locked dependencies
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
      - name: Analyze the editor and network regression
        working-directory: mobile_app
        run: flutter analyze --fatal-infos lib/features/properties/presentation/listing_editor_screen.dart test/phase23_draft_network_recovery_test.dart
      - name: Verify loss before write, loss after write, and a real competing device
        working-directory: mobile_app
        run: flutter test --no-pub test/phase23_draft_network_recovery_test.dart
