name: User work and media acceptance
on:
  push:
    branches: [work/user-work-media-batch1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: user-work-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Draft retries and private image derivatives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate --force
      - run: php artisan test tests/Feature/UserWorkMediaTest.php tests/Feature/Wave6EditorDiscoveryTest.php --display-warnings --fail-on-warning --fail-on-risky
  flutter:
    name: Editor analysis and recovery regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
      - run: python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
      - run: python3 -B ../scripts/check_v3_analysis.py
      - run: flutter test --reporter expanded test/wave6_product_contract_test.dart test/wave6_product_ui_test.dart test/new_wave_handoff_test.dart test/user_work_media_test.dart test/current_wave_contract_test.dart test/current_wave_ui_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-work-media-previews
          path: mobile_app/build/broker-preview/
          if-no-files-found: ignore
          retention-days: 3
