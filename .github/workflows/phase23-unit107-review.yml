name: Phase23 scoped synthetic unit107 support review
on:
  push:
    branches: [work/phase23-acceptance-20261111]
    paths:
      - scripts/phase23_unit107_review.py
      - .github/workflows/phase23-unit107-review.yml
permissions:
  contents: read
concurrency:
  group: phase23-unit107-review
  cancel-in-progress: false
jobs:
  known-unit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Run reviewed support stage for existing synthetic listing107
        env:
          AQER_PHASE1_TEST_ACCESS_JSON: ${{ secrets.AQER_PHASE1_TEST_ACCESS_JSON }}
        run: python3 -B scripts/phase23_unit107_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase23-unit107-review-${{ github.run_id }}
          path: phase23-unit107-review-sealed/
          retention-days: 30
          if-no-files-found: error
