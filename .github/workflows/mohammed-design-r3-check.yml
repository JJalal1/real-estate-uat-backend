name: R3 design with the original app colors

on:
  push:
    branches: [work/mohammed-design-r3]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mohammed-design-r3-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve the UAT dependencies
        run: |
          baseline=fd832497768aac67fdd32485f2af835f273111c8
          test "$(git hash-object pubspec.yaml)" = 4583d88e975281d4d55c0622b48ae1249342d99c
          git diff --exit-code "$baseline" HEAD -- pubspec.lock ../docs/ui-transplant-v3/pubspec_overrides.yaml
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          approved="$RUNNER_TEMP/aqer-approved-dependencies"
          git worktree add --detach --quiet "$approved" "$baseline"
          cp "$approved/docs/ui-transplant-v3/pubspec_overrides.yaml" "$approved/mobile_app/pubspec_overrides.yaml"
          python3 -B "$approved/scripts/verify_v3_dependency_lock.py" --resolved "$PWD/pubspec.lock" --approved-uat1829
          flutter pub get --enforce-lockfile
      - name: Analyze the mobile app
        run: python3 -B ../scripts/check_v3_analysis.py
      - name: Check the theme, home, property cards, map and search journeys
        run: |
          flutter test --no-pub --reporter expanded \
            test/app_theme_test.dart test/phase23_dark_sections_test.dart \
            test/compact_cards_email_login_test.dart test/owner_ux_gallery_filters_test.dart \
            test/map_search_layout_1820_test.dart test/map_dynamic_filters_1430_test.dart \
            test/wave2_home_search_test.dart test/uat1822_ranked_map_entry_test.dart \
            test/assisted_search_entry_1820_test.dart test/ui_transplant_v3_home_test.dart \
            test/ui_transplant_v3_template_test.dart test/wave3_search_only_1393_test.dart
