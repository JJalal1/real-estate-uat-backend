name: Build UAT Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build-uat-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-estate-uat-android-${{ github.ref }}
  cancel-in-progress: true

env:
  UAT_API_BASE_URL: https://real-estate-uat-api.onrender.com/api
  FLUTTER_VERSION: '3.27.3'

jobs:
  build-uat-apk:
    name: Analyze, test and build UAT APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter 3.27.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true

      - name: Verify accepted mobile baseline
        shell: bash
        run: |
          set -euo pipefail
          echo '82516ed55490f1a2d903c00023a363b1f9e825e459fe5be71b370ac6afc39462  mobile_app/lib/core/network/api_client.dart' | sha256sum -c -
          echo '30dd91c657eb1e38b5a5dffe79dc5945480ed1f077964121bf03003c97b15870  mobile_app/lib/router/app_router.dart' | sha256sum -c -
          echo 'a655654af86da6477748a4ed6d715e22fd5e24c97ee46cf109b93432250f61b2  mobile_app/lib/features/services/presentation/services_screen.dart' | sha256sum -c -
          echo '369a4c431f3fe73b1455a4920cd1a7ab771c32d43296e8e87e6b552fa13ee2c1  mobile_app/test/uat_cloud_readiness_test.dart' | sha256sum -c -
          ! grep -q "path: '/projects'" mobile_app/lib/router/app_router.dart
          ! grep -q "features/projects" mobile_app/lib/router/app_router.dart
          test ! -f mobile_app/android/local.properties

      - name: Flutter version
        run: flutter --version

      - name: Resolve packages
        working-directory: mobile_app
        run: flutter pub get

      - name: Static analysis
        working-directory: mobile_app
        run: flutter analyze

      - name: Cloud-readiness tests
        working-directory: mobile_app
        run: flutter test test/uat_cloud_readiness_test.dart

      - name: Full Flutter test suite
        working-directory: mobile_app
        run: flutter test

      - name: Verify compile-time UAT endpoint
        working-directory: mobile_app
        run: >-
          flutter test
          --dart-define=APP_ENVIRONMENT=uat
          --dart-define=API_BASE_URL=${{ env.UAT_API_BASE_URL }}
          test/uat_compiled_environment_test.dart

      - name: Verify live Render health before APK build
        shell: bash
        run: |
          set -euo pipefail
          rm -f health.json
          for attempt in {1..8}; do
            if curl -fsS --connect-timeout 20 --max-time 100 "${UAT_API_BASE_URL}/health" -o health.json; then
              break
            fi
            echo "Health attempt ${attempt} failed; waiting for possible Render cold start..."
            sleep 15
          done
          test -s health.json
          python3 - <<'PY'
          import json
          with open('health.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('status') == 'ok', data
          assert data.get('database') is True, data
          assert data.get('postgis') is True, data
          print('Render health verified: database=true, postgis=true')
          PY

      - name: Build release UAT APK
        working-directory: mobile_app
        run: >-
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=APP_ENVIRONMENT=uat
          --dart-define=API_BASE_URL=${{ env.UAT_API_BASE_URL }}

      - name: Prepare verified APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk "dist/real-estate-uat-${GITHUB_RUN_NUMBER}.apk"
          (cd dist && sha256sum "real-estate-uat-${GITHUB_RUN_NUMBER}.apk" > SHA256.txt)
          {
            echo "environment=uat"
            echo "api_base_url=${UAT_API_BASE_URL}"
            echo "git_commit=${GITHUB_SHA}"
            echo "github_run_number=${GITHUB_RUN_NUMBER}"
            echo "flutter_version=${FLUTTER_VERSION}"
            echo "application_id=com.example.real_estate_mobile"
            echo "secrets_embedded=false"
          } > dist/BUILD_INFO.txt

      - name: Upload UAT APK
        uses: actions/upload-artifact@v4
        with:
          name: real-estate-uat-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
