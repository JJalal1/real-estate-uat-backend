# Authoritative Gate 1: exact candidate source, validation and UAT APK identity.
# No deployment or current live runtime checks participate in qualification.
name: Unified UAT Gate
'on':
  pull_request:
    branches:
    - reconciliation/unified-uat
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: unified-uat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_REF: ${{ github.head_ref || github.ref_name }}
  UAT_APP_ENVIRONMENT: uat
  UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api
defaults:
  run:
    shell: bash
jobs:
  source-provenance:
    name: Source provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout exact candidate SHA
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_SHA }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify source, accepted guards and preserved migration history
      run: bash .github/ci/verify-source.sh
    - name: Test fail-closed skip accounting and aggregate behavior
      run: python3 .github/ci/test_release_gate.py
  backend-tests:
    name: Backend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
    - source-provenance
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
    - name: Checkout exact candidate SHA
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_SHA }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up PHP 8.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
        coverage: none
    - name: PHP and Composer versions
      run: |-
        php --version
        composer --version
    - name: Validate Composer metadata
      run: composer validate --strict --no-check-publish
    - name: Prepare isolated test environment
      run: |-
        install -m 600 /dev/null .env
        php -r 'file_put_contents(".env", "APP_KEY=base64:".base64_encode(random_bytes(32)).PHP_EOL);'
    - name: Install locked backend dependencies
      run: composer install --no-interaction --prefer-dist --no-progress
    - name: Run full Laravel suite and record exact skips
      run: php artisan test --display-warnings --display-skipped --fail-on-warning --fail-on-risky --fail-on-incomplete --log-junit=backend-results.xml
        --log-events-text=backend-events.txt
    - name: Reject new skips; account only for the PostgreSQL-only regression
      run: python3 ../.github/ci/verify-test-results.py backend backend-results.xml backend-events.txt
  postgres-audit:
    name: PostgreSQL and PostGIS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
    - source-provenance
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: real_estate_audit
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d real_estate_audit" --health-interval 10s --health-timeout 5s --health-retries
          5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: real_estate_audit
      DB_USERNAME: postgres
      DB_PASSWORD: ci-disposable-only
      DB_URL: ''
      DB_SEARCH_PATH: public,extensions
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
    - name: Checkout exact candidate SHA
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_SHA }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up PHP 8.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_pgsql
        coverage: none
    - name: Validate Composer metadata
      run: composer validate --strict --no-check-publish
    - name: Prepare isolated test environment
      run: |-
        install -m 600 /dev/null .env
        php -r 'file_put_contents(".env", "APP_KEY=base64:".base64_encode(random_bytes(32)).PHP_EOL);'
    - name: Install locked backend dependencies
      run: composer install --no-interaction --prefer-dist --no-progress
    - name: Prepare API roles in disposable PostgreSQL
      env:
        PGPASSWORD: ci-disposable-only
      run: psql -h 127.0.0.1 -U postgres -d real_estate_audit -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE
        authenticated NOLOGIN;' -c 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated;'
    - name: Apply complete current migration chain to disposable PostgreSQL
      run: php artisan migrate --force
    - name: Log disposable PostgreSQL and PostGIS versions
      env:
        PGPASSWORD: ci-disposable-only
      run: psql -h 127.0.0.1 -U postgres -d real_estate_audit -v ON_ERROR_STOP=1 -c 'SELECT version(); SELECT postgis_full_version();
        SELECT count(*) AS migrations FROM migrations;'
    - name: Run all tests/Postgres without required skips
      run: php artisan test tests/Postgres --display-warnings --fail-on-warning --fail-on-risky --fail-on-incomplete --fail-on-skipped
    - name: Run the required PostGIS overlap regression without skips
      run: php artisan test tests/Feature/Stage8RegionsBrokerApiTest.php --filter=test_postgis_rejects_interior_overlap_but_allows_touching_borders
        --display-warnings --fail-on-warning --fail-on-risky --fail-on-incomplete --fail-on-skipped
    - name: Run PostGIS property identity regression without skips
      run: php artisan test tests/Feature/PropertyIdentityV2Test.php --display-warnings --fail-on-warning --fail-on-risky
        --fail-on-incomplete --fail-on-skipped
  flutter-validation:
    name: Flutter analyze and full tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
    - source-provenance
    steps:
    - name: Checkout exact candidate SHA
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_SHA }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Flutter 3.27.3
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.27.3
        channel: stable
        cache: true
    - name: Flutter version
      run: flutter --version
    - name: Resolve locked Flutter dependencies
      working-directory: mobile_app
      run: |-
        flutter pub get
        git diff --exit-code -- pubspec.lock
    - name: Flutter analyze
      working-directory: mobile_app
      run: flutter analyze
    - name: Run full recursive Flutter behavioral suite with zero skips
      run: bash .github/ci/flutter-tests.sh
    - name: Verify compiled Frankfurt endpoint and reject unintended UAT endpoints
      run: bash .github/ci/verify-uat-endpoints.sh
  build-uat-apk:
    name: Build and identify UAT APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs:
    - source-provenance
    - backend-tests
    - postgres-audit
    - flutter-validation
    steps:
    - name: Checkout exact candidate SHA
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_SHA }}
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Prepare empty isolated Android SDK root
      run: |-
        w2_sdk="$RUNNER_TEMP/w2-android-sdk"
        test ! -e "$w2_sdk"
        mkdir -p "$w2_sdk"
        printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$w2_sdk" "$w2_sdk" >> "$GITHUB_ENV"
    - name: Set up exact Android SDK packages without legacy tools
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      with:
        cmdline-tools-version: '12266719'
        log-accepted-android-sdk-licenses: false
        packages: platform-tools platforms;android-35 build-tools;34.0.0 ndk;28.1.13356709
    - name: Set up Flutter 3.27.3
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.27.3
        channel: stable
        cache: true
    - name: Log non-secret toolchain versions
      run: |-
        java -version
        flutter --version
        sdkmanager --version
        sdkmanager --list_installed
        adb version
        cat mobile_app/android/gradle/wrapper/gradle-wrapper.properties
        cat "$ANDROID_HOME/build-tools/34.0.0/source.properties"
        cat "$ANDROID_HOME/ndk/28.1.13356709/source.properties"
    - name: Resolve locked Flutter dependencies
      working-directory: mobile_app
      run: |-
        flutter pub get
        git diff --exit-code -- pubspec.lock
    - name: Build actual release UAT APK from this exact candidate
      working-directory: mobile_app
      run: flutter build apk --release --no-pub --build-number="$GITHUB_RUN_NUMBER" --dart-define=APP_ENVIRONMENT="$UAT_APP_ENVIRONMENT"
        --dart-define=API_BASE_URL="$UAT_API_BASE_URL"
    - name: Log actual Gradle version
      working-directory: mobile_app/android
      run: ./gradlew --version | tee ../../gradle-version.txt
    - name: Verify APK package and candidate identity; generate SHA256 and BUILD_INFO
      run: python3 .github/ci/package-apk.py
    - name: Upload actual APK bytes and identity files
      id: apk-artifact
      uses: actions/upload-artifact@v4
      with:
        name: real-estate-unified-uat-${{ github.run_number }}-${{ github.run_attempt }}-${{ env.CANDIDATE_SHA }}
        path: dist/
        if-no-files-found: error
        retention-days: 30
  unified-uat-gate:
    name: Unified UAT Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
    - source-provenance
    - backend-tests
    - postgres-audit
    - flutter-validation
    - build-uat-apk
    steps:
    - name: Checkout exact candidate SHA
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_SHA }}
        fetch-depth: 0
        persist-credentials: false
    - name: Require every candidate job to finish successfully
      env:
        REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
      run: python3 .github/ci/verify-test-results.py aggregate
