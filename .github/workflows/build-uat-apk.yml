name: Unified UAT Gate

on:
  pull_request:
    branches:
      - reconciliation/unified-uat

permissions:
  contents: read

env:
  ORIGINAL_SHA: dc2805c9215dcd500fc7034effa953a4c3751761
  UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api

jobs:
  build-original-apk:
    name: Build exact original dc2805 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact original source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ORIGINAL_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact original source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORIGINAL_SHA"
          echo "Original source: $ORIGINAL_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare isolated Android SDK root
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/original-android-sdk"
          rm -rf "$sdk"
          mkdir -p "$sdk"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"

      - name: Install exact Android SDK packages without legacy tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-35 build-tools;34.0.0 ndk;28.1.13356709

      - name: Set up Flutter 3.27.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve Flutter packages
        working-directory: mobile_app
        run: flutter pub get

      - name: Verify live original Render health
        shell: bash
        run: |
          set -euo pipefail
          health_url="${UAT_API_BASE_URL%/api}/api/health"
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 90 "$health_url")"
          printf '%s' "$response" > /tmp/original-health.json
          python3 - <<'PY'
          import json
          with open('/tmp/original-health.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('status') == 'ok', data
          assert data.get('database') is True, data
          assert data.get('postgis') is True, data
          print('Original Render health: OK')
          PY

      - name: Build exact original release APK
        working-directory: mobile_app
        run: >-
          flutter build apk --release
          --build-number=165
          --dart-define=APP_ENVIRONMENT=uat
          --dart-define=API_BASE_URL=${{ env.UAT_API_BASE_URL }}

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="mobile_app/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk"
          mkdir -p dist
          cp "$apk" dist/real-estate-original-dc2805.apk
          sha256sum dist/real-estate-original-dc2805.apk | tee dist/SHA256.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging dist/real-estate-original-dc2805.apk | head -n 5 | tee dist/APK_BADGING.txt
          grep -q "package: name='com.example.real_estate_mobile'" dist/APK_BADGING.txt
          cat > dist/BUILD_INFO.txt <<EOF
          environment=uat
          api_base_url=${UAT_API_BASE_URL}
          original_source_sha=${ORIGINAL_SHA}
          android_application_id=com.example.real_estate_mobile
          version_name=0.1.0
          version_code=165
          flutter_version=3.27.3
          EOF

      - name: Upload original APK
        uses: actions/upload-artifact@v4
        with:
          name: real-estate-original-dc2805-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
