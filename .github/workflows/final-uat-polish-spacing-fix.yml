name: Final UAT Polish Spacing Fix

on:
  push:
    branches:
      - experience/final-uat-polish-pass
    paths:
      - .github/workflows/final-uat-polish-spacing-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experience/final-uat-polish-pass
          fetch-depth: 0
      - name: Repair spacing tokens
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile_app/lib/features/properties/presentation/property_details_screen.dart')
          s = p.read_text()
          if 'AppSpacing.s44' not in s:
              raise SystemExit('Expected s44 repair marker not found')
          p.write_text(s.replace('AppSpacing.s44', 'AppSpacing.s24'))
          PY
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile_app/lib/features/properties/presentation/property_details_screen.dart
          git commit -m "fix: restore accepted spacing tokens"
          git push origin HEAD:experience/final-uat-polish-pass
