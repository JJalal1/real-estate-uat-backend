name: Final Aqer source and deployed UAT acceptance
on:
  pull_request:
    branches: [work/wave2-review-current]
    paths:
      - 'docs/AQER_FINAL_32_MATRIX_2026-10-27_AR.md'
      - 'docs/evidence/2026-10-27-final-32-matrix.json'
      - '.github/workflows/phase32-handoff-validation.yml'
permissions:
  contents: read
jobs:
  deployed-acceptance:
    name: Verify source equivalence and bounded deployed UAT without account writes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: aqer-free-uat-http-measurements
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate complete matrix, evidence and exact tested application components
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          matrix=json.loads(Path('docs/evidence/2026-10-27-final-32-matrix.json').read_text())
          receipt=json.loads(Path('docs/evidence/2026-10-27-engineering-ci-receipt.json').read_text())
          assert [row['id'] for row in matrix['items']]==list(range(1,33))
          assert {str(s):sum(row['state_id']==s for row in matrix['items']) for s in [1,2,3]}=={'1':5,'2':20,'3':7}
          assert matrix['handset_tested'] is False and matrix['real_fcm_delivered'] is False
          assert matrix['production_store_decision']=='NO-GO'
          for row in matrix['items']:
              for field in ['requirements','previous_state','work_now','files_reviewed','source_shas','flutter_tests','laravel_tests','postgresql_storage_tests','ci_results','uat_results','android','new_state','completion_evidence','final_blocker','activation_resource','post_resource_test']:
                  assert field in row
              if row['included_in_unified_branch']:
                  for path in row['files_reviewed']+row['files_changed_now']:
                      assert Path(path).is_file(),path
          for path,expected in receipt['application_tree_ids'].items():
              actual=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
              assert actual==expected,(path,actual,expected)
          for suite in receipt['ci']:
              assert all(check['status']=='completed' and check['conclusion'] in ['success','skipped'] for check in suite['checks'])
          current=json.loads(Path('docs/evidence/2026-10-27-APK_VERIFICATION.json').read_text())
          previous=json.loads(Path('docs/evidence/2026-10-27-upgrade-predecessor-APK_VERIFICATION.json').read_text())
          assert current['package']==previous['package']=='com.aqer.yemen.uat'
          assert current['certificate_sha256']==previous['certificate_sha256']
          assert current['version_code']==1359 and previous['version_code']==1358
          assert current['firebase']['client_configured'] is False
          print('32 records;5 approved,20 owner-ready,7 external;tested application components match;no handset/FCM/Production claim.')
          PY
      - name: Existing unchanged bounded warm measurements after the official deploy
        run: |
          mkdir -p dist
          python3 -B scripts/probe_uat_performance.py --output dist/POST_DEPLOY_UAT_PERFORMANCE.json
      - name: Public release and diagnostic API contracts (synthetic GET only)
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          origin='https://real-estate-uat-api-frankfurt.onrender.com'
          def get(path):
              req=urllib.request.Request(origin+path,headers={'Accept':'application/json','X-Aqer-Diagnostics':'perf-109'})
              with urllib.request.urlopen(req,timeout=20) as res:
                  assert res.status==200
                  return json.loads(res.read(2*1024*1024)),dict(res.headers)
          health,_=get('/api/health')
          assert health['database'] is True
          release,_=get('/api/release');android=release['data']
          assert android['platform']=='android'
          assert 1<=android['minimum_supported_build']<=android['latest_build']
          page,headers=get('/api/properties?per_page=20')
          normalized={key.lower():value for key,value in headers.items()}
          assert isinstance(page['data'],list) and len(page['data'])<=20
          assert int(normalized['x-aqer-db-queries'])<=25
          assert normalized['x-aqer-storage-requests']=='0'
          report={'application_get_writes_requested':False,'health_database':True,'release_minimum':android['minimum_supported_build'],'release_latest':android['latest_build'],'store_url_configured':bool(android['store_url']),'page_rows':len(page['data']),'page_db_queries':int(normalized['x-aqer-db-queries']),'page_storage_requests':0,'physical_handset_tested':False,'real_fcm_delivery_tested':False}
          Path('dist/POST_DEPLOY_API_CONTRACTS.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Safe evidence only
        uses: actions/upload-artifact@v4
        with:
          name: final-deployed-uat-evidence-${{ github.run_number }}
          path: dist/POST_DEPLOY_*.json
          if-no-files-found: error
          retention-days: 14
