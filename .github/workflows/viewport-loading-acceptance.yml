name: Viewport and loading acceptance
on:
  pull_request:
    branches: [work/wave2-review-current]
permissions:
  contents: read
jobs:
  measurement:
    name: Actual HTTP viewport and UAT image measurements
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Verify viewport scheduling and existing media behavior
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/check_v3_analysis.py
          flutter test test/loading_recovery_test.dart test/viewport_media_test.dart test/adaptive_image_quality_test.dart test/user_work_media_test.dart test/wave2_trust_account_media_test.dart --reporter expanded
      - name: Measure repaired viewport over actual HTTP and UAT Storage
        working-directory: mobile_app
        run: flutter test test/viewport_network_measurement_test.dart test/discovery_http_acceptance_test.dart --dart-define=AQER_VIEWPORT_HTTP_PROBE=true --dart-define=AQER_DISCOVERY_HTTP_PROBE=true --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewport-http-measurements
          path: mobile_app/viewport-*-metrics.json
          retention-days: 14
