name: Viewport and loading acceptance
on:
  push:
    branches: [work/viewport-loading-acceptance]
permissions:
  contents: read
jobs:
  measurement:
    name: Actual HTTP viewport and UAT image measurements
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Measure current implementation before viewport repair
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          flutter test test/viewport_network_measurement_test.dart --dart-define=AQER_VIEWPORT_HTTP_PROBE=true --dart-define=AQER_EXPECT_VIEWPORT_GATING=false --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewport-http-measurements
          path: mobile_app/viewport-*-metrics.json
          retention-days: 14
