name: Property Identity V2 Flutter Apply

on:
  push:
    branches: [feature/property-identity-duplicate-prevention]
    paths:
      - '.github/workflows/property-identity-flutter-apply.yml'
      - '.github/scripts/property_identity_flutter_repair.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/property-identity-duplicate-prevention
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Apply Flutter integration
        run: |
          python3 .github/scripts/property_identity_flutter_apply.py
          python3 .github/scripts/property_identity_flutter_repair.py
      - name: Format changed Dart
        working-directory: mobile_app
        run: dart format lib/features/properties/domain/property_details.dart lib/features/properties/domain/property_identity.dart lib/features/properties/data/property_repository.dart lib/features/properties/presentation/listing_editor_screen.dart lib/features/properties/presentation/property_land_boundary_picker_screen.dart
      - name: Resolve packages
        working-directory: mobile_app
        run: flutter pub get
      - name: Analyze
        working-directory: mobile_app
        run: flutter analyze
      - name: Test
        working-directory: mobile_app
        run: flutter test
      - name: Commit applied Flutter integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/property_identity_flutter_apply.py .github/scripts/property_identity_flutter_repair.py .github/workflows/property-identity-flutter-apply.yml
          git add mobile_app
          git diff --cached --check
          git commit -m "Integrate Property Identity V2 advertiser UX"
          git push origin HEAD:feature/property-identity-duplicate-prevention
