name: Migrate Supabase to Frankfurt

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: 'Type FRANKFURT to confirm the target database may be replaced'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Backup Mumbai and restore Frankfurt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLD_DB_URL: ${{ secrets.OLD_SUPABASE_DB_URL }}
      NEW_DB_URL: ${{ secrets.NEW_SUPABASE_DB_URL }}
      OLD_PROJECT_REF: xjoeikrzvpnblyiknpdb
      NEW_PROJECT_REF: ipxsgxsqzthpgthwvdno

    steps:
      - name: Safety checks
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_target }}" != "FRANKFURT" ]; then
            echo "Confirmation text is incorrect. Nothing changed."
            exit 1
          fi

          if [ -z "${OLD_DB_URL:-}" ] || [ -z "${NEW_DB_URL:-}" ]; then
            echo "Required database URL secrets are missing. Nothing changed."
            exit 1
          fi

          case "$OLD_DB_URL" in
            *"$OLD_PROJECT_REF"*) ;;
            *) echo "Source URL does not match Mumbai. Nothing changed."; exit 1 ;;
          esac

          case "$NEW_DB_URL" in
            *"$NEW_PROJECT_REF"*) ;;
            *) echo "Target URL does not match Frankfurt. Nothing changed."; exit 1 ;;
          esac

          if [ "$OLD_DB_URL" = "$NEW_DB_URL" ]; then
            echo "Source and target URLs must be different. Nothing changed."
            exit 1
          fi

          source_postgis_schema=$(psql "$OLD_DB_URL" -Atc "select extnamespace::regnamespace::text from pg_extension where extname='postgis';")
          if [ "$source_postgis_schema" != "extensions" ]; then
            echo "Unexpected source PostGIS schema: $source_postgis_schema. Nothing changed."
            exit 1
          fi

          echo "Safety checks passed. Source is Mumbai; target is Frankfurt."

      - name: Check tools
        shell: bash
        run: |
          set -euo pipefail
          psql --version
          npx --yes supabase@latest --version

      - name: Backup application public schema and data
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest db dump --db-url "$OLD_DB_URL" --schema public -f schema.sql
          npx --yes supabase@latest db dump --db-url "$OLD_DB_URL" --schema public -f data.sql --use-copy --data-only
          test -s schema.sql
          test -s data.sql
          echo "Mumbai public schema/data backup completed."

      - name: Restore application database to Frankfurt
        shell: bash
        run: |
          set -euo pipefail
          cat > prepare_target.sql <<'SQL'
          DROP EXTENSION IF EXISTS postgis CASCADE;
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public AUTHORIZATION postgres;
          GRANT USAGE ON SCHEMA public TO postgres, anon, authenticated, service_role;
          GRANT CREATE ON SCHEMA public TO postgres;
          CREATE EXTENSION IF NOT EXISTS postgis WITH SCHEMA extensions;
          SQL

          psql \
            --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file prepare_target.sql \
            --file schema.sql \
            --command 'SET session_replication_role = replica' \
            --file data.sql \
            --command 'SET session_replication_role = DEFAULT' \
            --dbname "$NEW_DB_URL"

          echo "Frankfurt public schema/data restore completed."

      - name: Verify all public tables and row counts
        shell: bash
        run: |
          set -euo pipefail

          source_tables=$(psql "$OLD_DB_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename;")
          target_tables=$(psql "$NEW_DB_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename;")

          if [ "$source_tables" != "$target_tables" ]; then
            echo "Verification failed: public table lists differ."
            diff -u <(printf '%s\n' "$source_tables") <(printf '%s\n' "$target_tables") || true
            exit 1
          fi

          psql "$OLD_DB_URL" -Atc "select format('select %L, count(*) from public.%I;', tablename, tablename) from pg_tables where schemaname='public' order by tablename;" | psql "$OLD_DB_URL" -AtF '|' > source_counts.txt
          psql "$NEW_DB_URL" -Atc "select format('select %L, count(*) from public.%I;', tablename, tablename) from pg_tables where schemaname='public' order by tablename;" | psql "$NEW_DB_URL" -AtF '|' > target_counts.txt

          if ! diff -u source_counts.txt target_counts.txt; then
            echo "Verification failed: one or more public table row counts differ."
            exit 1
          fi

          source_schema_stats=$(psql "$OLD_DB_URL" -Atc "select (select count(*) from pg_indexes where schemaname='public')||','||(select count(*) from pg_constraint c join pg_namespace n on n.oid=c.connamespace where n.nspname='public');")
          target_schema_stats=$(psql "$NEW_DB_URL" -Atc "select (select count(*) from pg_indexes where schemaname='public')||','||(select count(*) from pg_constraint c join pg_namespace n on n.oid=c.connamespace where n.nspname='public');")

          if [ "$source_schema_stats" != "$target_schema_stats" ]; then
            echo "Verification failed: index/constraint totals differ."
            exit 1
          fi

          target_postgis_schema=$(psql "$NEW_DB_URL" -Atc "select extnamespace::regnamespace::text from pg_extension where extname='postgis';")
          if [ "$target_postgis_schema" != "extensions" ]; then
            echo "Verification failed: Frankfurt PostGIS is not in extensions schema."
            exit 1
          fi

          echo "Verification passed for all public tables, row counts, indexes, constraints, and PostGIS placement."
