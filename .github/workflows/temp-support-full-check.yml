name: Temporary Support Full Check

on:
  push:
    branches:
      - support/manager-agent-workflow
    paths:
      - .github/workflows/temp-support-full-check.yml

permissions:
  contents: read

env:
  UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api

jobs:
  laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: install -m 600 /dev/null .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Support workflow regression
        run: php artisan test tests/Feature/UatSupportManagerAgentWorkflowApiTest.php tests/Feature/UatThreeRoleSupportWorkspaceApiTest.php --display-warnings --fail-on-warning --fail-on-risky
      - name: Full Laravel suite
        run: php artisan test --display-warnings --fail-on-warning --fail-on-risky

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: real_estate_audit
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d real_estate_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: real_estate_audit
      DB_USERNAME: postgres
      DB_PASSWORD: ci-disposable-only
      DB_URL: ''
      DB_SEARCH_PATH: public,extensions
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_pgsql
          coverage: none
      - run: install -m 600 /dev/null .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare API roles
        env:
          PGPASSWORD: ci-disposable-only
        run: >-
          psql -h 127.0.0.1 -U postgres -d real_estate_audit -v ON_ERROR_STOP=1
          -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
          -c 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated;'
      - run: php artisan migrate --force
      - name: Support workflow PostgreSQL regression
        run: php artisan test tests/Feature/UatSupportManagerAgentWorkflowApiTest.php tests/Feature/UatThreeRoleSupportWorkspaceApiTest.php --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: PostgreSQL security suite
        run: php artisan test tests/Postgres --display-warnings --fail-on-warning --fail-on-risky --fail-on-skipped

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: mobile_app
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile_app
        run: flutter analyze
      - name: Support mobile regression
        working-directory: mobile_app
        run: flutter test test/support_manager_agent_workflow_test.dart
      - name: Full Flutter suite
        working-directory: mobile_app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test -maxdepth 1 -type f -name '*_test.dart' ! -name 'uat_compiled_environment_test.dart' | sort)
          test "${#tests[@]}" -gt 0
          flutter test "${tests[@]}"
      - name: Verify Frankfurt compile-time endpoint
        working-directory: mobile_app
        run: >-
          flutter test
          --dart-define=APP_ENVIRONMENT=uat
          --dart-define=API_BASE_URL=${{ env.UAT_API_BASE_URL }}
          test/uat_compiled_environment_test.dart

# final rerun after manager regression alignment and FK index coverage