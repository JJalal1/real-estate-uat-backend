name: Current-wave rollout evidence
on:
  push:
    branches: [work/current-wave-1081-evidence]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify evidence-only scope and deployed application trees
        run: |
          set -euo pipefail
          git diff --check 7b94ee51440afbcb72dcfd88452db6aa41f5b738 HEAD
          test "$(git rev-parse HEAD:mobile_app)" = cc83e2a5ddfb47b5297d99164c17b749c6887d8f
          test "$(git rev-parse HEAD:backend-api-runtime)" = fa8c534e67625eb03192222e6b465e7ffbd4c116
          python3 - <<'PY'
          import pathlib, subprocess
          expected = {'AGENTS.md', 'docs/AI_PROJECT_STATE.md', 'docs/CURRENT_WAVE_1076_AR.md', '.github/workflows/current-wave-rollout-evidence.yml'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '7b94ee51440afbcb72dcfd88452db6aa41f5b738', 'HEAD'], text=True).splitlines())
          assert changed == expected, changed
          for name in ['AGENTS.md', 'docs/AI_PROJECT_STATE.md', 'docs/CURRENT_WAVE_1076_AR.md']:
              text = pathlib.Path(name).read_text()
              for evidence in ['1081', 'dep-dba92o61egvs739qrf4g', '39115720072', '7b94ee51440afbcb72dcfd88452db6aa41f5b738']:
                  assert evidence in text, (name, evidence)
          print('Evidence-only diff verified; approved mobile and deployed backend trees are unchanged.')
          PY
