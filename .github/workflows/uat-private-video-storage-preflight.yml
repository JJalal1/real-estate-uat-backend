name: UAT Private Video Storage Preflight
on:
  pull_request:
    branches: [work/wave2-review-current]
    paths:
      - 'backend-api-runtime/app/Services/CloudAssetStorageService.php'
      - 'backend-api-runtime/routes/console.php'
      - 'backend-api-runtime/docker/uat-entrypoint.sh'
      - 'backend-api-runtime/tests/Feature/VideoCloudStorageProtocolTest.php'
      - 'backend-api-runtime/tests/Feature/VideoPrivateStorageTest.php'
      - '.github/workflows/uat-private-video-storage-preflight.yml'
permissions:
  contents: read
jobs:
  private-video-storage-protocol:
    name: Private Storage protocol and existing image regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite
          coverage: none
      - name: Install Laravel dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure isolated disposable test database
        run: |
          printf 'APP_ENV=testing\nDB_CONNECTION=sqlite\nDB_DATABASE=:memory:\nAPP_KEY=\n' > .env
          php artisan key:generate --force
      - name: Private video storage wire contract
        run: php artisan test tests/Feature/VideoCloudStorageProtocolTest.php tests/Feature/VideoPrivateStorageTest.php --fail-on-warning --fail-on-risky --fail-on-skipped
      - name: Legacy image storage remains unaffected
        run: php artisan test tests/Feature/Wave2MediaTrustTest.php --fail-on-warning --fail-on-risky --fail-on-skipped
