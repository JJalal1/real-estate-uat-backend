name: Private active wave build evidence
on:
  push:
    branches: [delivery/active-wave-69-evidence]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    name: Verify active wave APK1069 metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read bounded tested build metadata
        env:
          APK_READ_TOKEN: ${{ github.token }}
        run: python3 -B scripts/read_active_wave_evidence.py
  preview:
    name: Preview ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        file: [home-top.png, wave5-home-large.png, active-wave-details-1.0.png, active-wave-details-2.4.png, active-wave-advertiser-1.0.png, active-wave-advertiser-2.4.png, active-wave-compare-1.0.png, active-wave-compare-2.4.png, active-wave-save-1.0.png, active-wave-save-2.4.png, active-wave-directory-1.0.png, active-wave-directory-2.4.png]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read one bounded synthetic preview
        env:
          APK_READ_TOKEN: ${{ github.token }}
        run: python3 -B scripts/read_active_wave_evidence.py --preview '${{ matrix.file }}'
