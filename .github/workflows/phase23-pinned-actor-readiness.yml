name: Phase23 verified existing actor readiness
on:
  push:
    branches: [work/phase23-acceptance-20261111]
    paths:
      - .github/workflows/phase23-pinned-actor-readiness.yml
permissions:
  contents: read
jobs:
  pinned-actors:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check only pinned existing actors and close each test session
        env:
          AQER_PHASE1_TEST_ACCESS_JSON: ${{ secrets.AQER_PHASE1_TEST_ACCESS_JSON }}
          AQER_PHASE23_ACTOR_ALLOWLIST_ATTESTATION: ${{ secrets.AQER_PHASE23_ACTOR_ALLOWLIST_ATTESTATION }}
          AQER_PHASE23_PINNED_ACTORS: erasure
        run: python3 -B scripts/phase23_actor_readiness.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase23-pinned-actors-${{ github.run_id }}
          path: phase23-pinned-actors-sealed/
          retention-days: 30
          if-no-files-found: warn
