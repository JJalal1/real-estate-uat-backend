name: Listing duplicate review API checks

on:
  push:
    branches: [work/listing-duplicate-review-uat-20261120]
  pull_request:
    paths:
      - 'backend-api-runtime/app/Services/ListingDuplicateAssessment.php'
      - 'backend-api-runtime/app/Services/ListingWorkflowService.php'
      - 'backend-api-runtime/app/Services/PropertyAssetService.php'
      - 'backend-api-runtime/app/Services/PropertyIdentityService.php'
      - 'backend-api-runtime/app/Services/GeminiClient.php'
      - 'backend-api-runtime/app/Http/Controllers/Api/ListingReviewController.php'
      - 'backend-api-runtime/tests/Feature/PropertyIdentityV2Test.php'
      - 'backend-api-runtime/tests/Feature/Stage9ListingReviewApiTest.php'
      - '.github/workflows/listing-duplicate-review-backend.yml'

permissions:
  contents: read

jobs:
  review-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: aqer_duplicate_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aqer_duplicate_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Set up disposable test environment
        run: |
          printf 'APP_KEY=\n' > .env
          php artisan key:generate --force
          psql -h 127.0.0.1 -U postgres -d aqer_duplicate_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: Check SQLite review and assistant contracts
        run: >-
          php artisan test
          tests/Feature/PropertyIdentityV2Test.php
          tests/Feature/Stage9ListingReviewApiTest.php
          tests/Feature/UatListingSupportClaimApiTest.php
          tests/Feature/Wave3AiAssistantTest.php
          tests/Feature/BrokerListingAssistantTest.php
          --display-warnings --fail-on-warning --fail-on-risky
      - name: Check review with PostgreSQL and PostGIS
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aqer_duplicate_test
          DB_USERNAME: postgres
          DB_PASSWORD: ''
          DB_URL: ''
          DB_SEARCH_PATH: public,extensions
        run: >-
          php artisan test
          tests/Feature/PropertyIdentityV2Test.php
          tests/Feature/Stage9ListingReviewApiTest.php
          tests/Feature/UatListingSupportClaimApiTest.php
          --display-warnings --fail-on-warning --fail-on-risky
