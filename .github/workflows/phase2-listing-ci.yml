name: Phase 2 Listing Journey CI

on:
  push:
    branches: [phase2/listing-journey-hardening]
  pull_request:
    branches: [phase1/ux-product-foundation]

env:
  UAT_API_BASE_URL: https://real-estate-uat-api.onrender.com/api

permissions:
  contents: read

jobs:
  backend-tests:
    name: Laravel listing regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          : > .env
          php artisan key:generate --force
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Run Laravel test suite
        run: php artisan test --display-warnings --fail-on-warning --fail-on-risky

  flutter-validation:
    name: Flutter analysis tests and UAT APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter 3.27.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: mobile_app
        run: flutter pub get
      - name: Static analysis
        working-directory: mobile_app
        run: flutter analyze
      - name: Full Flutter test suite
        working-directory: mobile_app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test -maxdepth 1 -type f -name '*_test.dart' ! -name 'uat_compiled_environment_test.dart' | sort)
          test "${#tests[@]}" -gt 0
          flutter test "${tests[@]}"
      - name: Verify compile-time UAT endpoint
        working-directory: mobile_app
        run: flutter test --dart-define=APP_ENVIRONMENT=uat --dart-define=API_BASE_URL=${{ env.UAT_API_BASE_URL }} test/uat_compiled_environment_test.dart
      - name: Build UAT APK
        working-directory: mobile_app
        run: flutter build apk --release --dart-define=APP_ENVIRONMENT=uat --dart-define=API_BASE_URL=${{ env.UAT_API_BASE_URL }}
      - name: Upload UAT APK
        uses: actions/upload-artifact@v4
        with:
          name: real-estate-phase2-uat-apk-${{ github.run_number }}
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
