name: Temporary Support Followup Patch

on:
  push:
    branches:
      - support/manager-agent-workflow
    paths:
      - .github/workflows/temp-support-followup-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support/manager-agent-workflow
          fetch-depth: 0
      - run: python3 tools/temp_support_followup_patch.py
      - run: |
          rm tools/temp_support_followup_patch.py
          rm .github/workflows/temp-support-followup-patch.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix support workflow permissions and mobile contracts"
          git push origin HEAD:support/manager-agent-workflow
