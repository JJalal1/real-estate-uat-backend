name: Wave2 trust identity and media acceptance
on:
  push:
    branches: [work/wave2-brand-trust-account, work/wave2-review-current]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wave2-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Account safety and identity regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate --force
      - run: php artisan test tests/Feature/Wave2AccountSafetyTest.php tests/Feature/Wave2MediaTrustTest.php tests/Feature/UserWorkMediaTest.php tests/Feature/PropertyIdentityV2Test.php tests/Feature/Stage10CommunitySupportApiTest.php tests/Feature/Stage11MessagingNotificationsApiTest.php --display-warnings --fail-on-warning --fail-on-risky
  flutter:
    name: Account safety and editor regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
      - run: python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
      - run: python3 -B ../scripts/check_v3_analysis.py
      - run: flutter test --reporter expanded test/wave2_trust_account_media_test.dart test/compact_cards_email_login_test.dart test/user_work_media_test.dart test/new_wave_handoff_test.dart test/ui_transplant_v3_template_test.dart test/broker_experience_ui_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave2-review-previews
          path: mobile_app/build/wave2-preview/
          retention-days: 3
          if-no-files-found: ignore
