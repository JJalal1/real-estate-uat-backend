name: Alazzi backend UAT verification

on:
  push:
    branches: ['work/alazzi-broker-uat-20261124']
    paths:
      - 'backend-api-runtime/**'
      - '.github/workflows/alazzi-backend-uat-verification.yml'

permissions:
  contents: read

jobs:
  broker-api:
    name: Broker workspace, messaging and public listing APIs
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: aqer_broker_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aqer_broker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-api-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Initialize disposable test credentials and database roles
        run: |
          install -m 600 /dev/null .env
          printf 'APP_KEY=\n' > .env
          php artisan key:generate --force
          psql -h 127.0.0.1 -U postgres -d aqer_broker_test -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: Exercise the broker, messaging and public listing APIs on SQLite
        run: >-
          php artisan test tests/Feature/BrokerExperienceApiTest.php
          tests/Feature/Stage11MessagingNotificationsApiTest.php
          tests/Feature/FinancialV1ApiTest.php
          tests/Feature/Phase3BuyerDiscoveryFavoritesApiTest.php
          --display-warnings --fail-on-warning --fail-on-risky
      - name: Exercise the broker and public listing APIs on PostgreSQL and PostGIS
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: aqer_broker_test
          DB_USERNAME: postgres
          DB_PASSWORD: ''
          DB_URL: ''
          DB_SEARCH_PATH: public,extensions
        run: >-
          php artisan test tests/Feature/BrokerExperienceApiTest.php
          tests/Feature/Phase3BuyerDiscoveryFavoritesApiTest.php
          --display-warnings --fail-on-warning --fail-on-risky

