name: Phase1 native account draft recovery
on:
  push:
    branches: [work/phase1-native-account-20261103]
    paths:
      - .github/workflows/phase1-native-account.yml
      - scripts/phase1_native_account_readiness.py
      - scripts/prepare_phase1_native_account.py
      - scripts/probe_phase1_native_account.py
      - scripts/phase1_native_fixture_api.py
      - scripts/phase1_device_input/Phase1Input.java
      - scripts/tests/test_phase1_native_account*.py
      - scripts/run_phase1_native_bridge.py
      - scripts/phase1_bridge/**
      - .github/actions/phase1-review/**
permissions:
  contents: read
concurrency:
  group: phase1-native-account-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_COMMIT: ${{ github.sha }}
  AQER_PHASE1_NATIVE_ACCOUNT: 'true'
  UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api
jobs:
  secure-channel:
    if: github.repository == 'JJalal1/real-estate-uat-backend' && github.ref == 'refs/heads/work/phase1-native-account-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify secure test channel without printing credentials
        env:
          AQER_PHASE1_TEST_ACCESS_JSON: ${{ secrets.AQER_PHASE1_TEST_ACCESS_JSON }}
        run: python3 -B scripts/phase1_native_account_readiness.py
      - name: Upload sanitized missing-channel receipt if blocked
        if: ${{ failure() && hashFiles('phase1-native-account-readiness/readiness.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-native-account-readiness-${{ github.run_id }}
          path: phase1-native-account-readiness/readiness.json
          retention-days: 3
          if-no-files-found: error
  collector-safety:
    if: github.repository == 'JJalal1/real-estate-uat-backend' && github.ref == 'refs/heads/work/phase1-native-account-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use the reviewed Python3.12 test runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Guard exact unchanged product components
        run: python3 -B scripts/prepare_phase1_native_account.py --source-only
      - name: Run only native collector safety tests
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.3.0 cryptography==50.0.2
          python3 -B -m unittest discover -s scripts/tests -p 'test_phase1_native_account*.py' -q
          python3 -B scripts/run_phase1_native_bridge.py --offline-tests
  native:
    needs: [secure-channel, collector-safety]
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use the reviewed Python3.12 native runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Guard exact unchanged mobile and backend components
        run: |
          python3 -B scripts/prepare_phase1_native_account.py --source-only
          printf 'GRADLE_USER_HOME=%s\n' "$RUNNER_TEMP/aqer-native-account-gradle" >> "$GITHUB_ENV"
      - name: Set up Java17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up pinned Android36 tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Set up Flutter3.27.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true
      - name: Set up Node24 for the pinned checkpoint client
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned collector and checkpoint dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow==12.3.0 cryptography==50.0.2
          npm ci --ignore-scripts --omit=dev --prefix .github/actions/phase1-review
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffprobe >/dev/null
      - name: Resolve approved locked graph
        working-directory: mobile_app
        run: |
          set -euo pipefail
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml
      - name: Restore only public Gradle dependency archives
        id: gradle-deps
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
          key: aqer-phase1-public-gradle-v1-${{ runner.os }}-jdk17-flutter3273-api36-ef562ae410023046b4abee283f09707051a0e7b6-${{ hashFiles('mobile_app/pubspec.lock', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties', 'mobile_app/android/settings.gradle*', 'mobile_app/android/build.gradle*', 'docs/ui-transplant-v3/pubspec_overrides.yaml') }}
      - name: Build unchanged release for actual account journey
        working-directory: mobile_app
        env:
          AQER_ALLOW_DEBUG_RELEASE_SIGNING: 'true'
          AQER_PHASE1_RELEASE_UI_TEST: 'true'
        run: |
          set -euo pipefail
          native_account_version=$((1466 + GITHUB_RUN_NUMBER))
          flutter build apk --flavor uat --release --build-number="$native_account_version" \
            --dart-define=APP_BUILD_NUMBER="$native_account_version" --dart-define=APP_ENVIRONMENT=uat \
            --dart-define=API_BASE_URL="$UAT_API_BASE_URL"
      - name: Verify release and compile self-targeted input helper
        id: prepare
        run: python3 -B scripts/prepare_phase1_native_account.py
      - name: Save only public Gradle dependencies before disposable cleanup
        if: steps.gradle-deps.outputs.cache-hit != 'true' && steps.gradle-deps.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/wrapper/dists
          key: ${{ steps.gradle-deps.outputs.cache-primary-key }}
      - name: Prepare one fresh disposable API36 KVM image
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = JJalal1/real-estate-uat-backend
          test "$GITHUB_REF" = refs/heads/work/phase1-native-account-20261103
          test -f phase1-native-account-private/APK_VERIFICATION.json
          test -c /dev/kvm
          rm -rf mobile_app/build "$RUNNER_TEMP/aqer-native-account-gradle"
          sdkmanager --install 'emulator' 'system-images;android-36;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/aqer-native-account-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --force --name aqer-native-account --device pixel \
            --path "$ANDROID_AVD_HOME/aqer-native-account.avd" \
            --package 'system-images;android-36;google_apis;x86_64'
          python3 - "$ANDROID_AVD_HOME/aqer-native-account.avd/config.ini" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          selected = {'hw.lcd.width': '540', 'hw.lcd.height': '960',
                      'hw.lcd.density': '210', 'showDeviceFrame': 'no'}
          lines = [line for line in path.read_text().splitlines()
                   if line.split('=', 1)[0].strip() not in selected]
          path.write_text('\n'.join(lines + [key + '=' + value for key, value in selected.items()]) + '\n')
          PY
          sudo chmod 666 /dev/kvm
          printf 'ANDROID_USER_HOME=%s\nANDROID_EMULATOR_HOME=%s\nANDROID_AVD_HOME=%s\n' \
            "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
      - name: Verify frozen same-job tool bundle
        run: python3 -B scripts/run_phase1_native_bridge.py --source-only --github-env
      - name: Execute one bounded native session with actual Root review checkpoints
        id: native
        timeout-minutes: 108
        uses: ./.github/actions/phase1-review
        with:
          owner-timeout-seconds: '6200'
          cleanup-grace-seconds: '180'
        env:
          AQER_PHASE1_TEST_ACCESS_JSON: ${{ secrets.AQER_PHASE1_TEST_ACCESS_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
          QT_QPA_PLATFORM: offscreen
      - name: Encrypt private account evidence to current task recipient
        id: evidence
        if: ${{ !cancelled() && hashFiles('phase1-native-account-evidence/report.json') != '' }}
        run: python3 -B scripts/prepare_phase1_native_account.py --encrypt-evidence --include-installer
      - name: Upload ciphertext and minimal public identity only
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-native-account-encrypted-${{ github.run_id }}
          path: |
            phase1-native-account-encrypted/evidence.cms
            phase1-native-account-encrypted/PUBLIC_RECEIPT.json
            phase1-native-account-private/APK_VERIFICATION.json
          retention-days: 3
          if-no-files-found: error
      - name: Upload the separately verified encrypted installer
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase1-native-installer-encrypted-${{ github.run_id }}
          path: phase1-native-account-encrypted/installer.cms
          retention-days: 3
          if-no-files-found: error
# Credentials use only standard runtime Actions secrets. No public git transport.
# Native report/media stays private and leaves the runner only as ciphertext.
