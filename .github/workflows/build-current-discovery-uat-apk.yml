name: Build current discovery UAT APK

on:
  pull_request:
    branches: [work/wave2-review-current]
    paths:
      - '.github/workflows/build-current-discovery-uat-apk.yml'
  push:
    branches: [work/wave2-review-current]
    paths:
      - '.github/workflows/build-current-discovery-uat-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-current-discovery-uat-apk
  cancel-in-progress: true

env:
  UAT_API_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com/api
  # PR160's accepted merge is application-identical to the fully tested
  # source of the encrypted 1358/1359 pair. Keep this guard explicit.
  ACCEPTED_SOURCE_SHA: 04b28182645af61c3c7aa11dfbfdaed4c9e86454
  UAT_BUILD_NUMBER: '1359'
  AQER_ALLOW_DEBUG_RELEASE_SIGNING: 'true'
  APP_SHARE_BASE_URL: https://real-estate-uat-api-frankfurt.onrender.com

jobs:
  build:
    name: Verify and build current UAT APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Preserve the existing 40 reads / concurrency20 assertions, while keeping
    # this historical discovery check isolated from other Free-UAT probes.
    concurrency:
      group: aqer-free-uat-http-measurements
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify application source is the accepted merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${ACCEPTED_SOURCE_SHA}:mobile_app")" = "$(git rev-parse HEAD:mobile_app)"
          test "$(git rev-parse "${ACCEPTED_SOURCE_SHA}:backend-api-runtime")" = "$(git rev-parse HEAD:backend-api-runtime)"
          git diff --check "${ACCEPTED_SOURCE_SHA}..HEAD"
          echo "Application trees match the tested PR160 merge: ${ACCEPTED_SOURCE_SHA}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
          cache: true

      - name: Resolve protected Flutter dependencies
        working-directory: mobile_app
        run: |
          cp ../docs/ui-transplant-v3/pubspec_overrides.yaml pubspec_overrides.yaml
          flutter pub get
          python3 -B ../scripts/verify_v3_dependency_lock.py --resolved pubspec.lock

      - name: Strict Flutter analysis
        working-directory: mobile_app
        run: python3 -B ../scripts/check_v3_analysis.py

      - name: Run discovery and UAT environment tests
        working-directory: mobile_app
        run: |
          flutter test test/property_marker_cluster_test.dart test/search_query_wave_test.dart test/active_wave_discovery_test.dart test/uat_map_location_picker_test.dart test/uat_cloud_readiness_test.dart --reporter expanded
          flutter test \
            --dart-define=APP_ENVIRONMENT=uat \
            --dart-define=API_BASE_URL=${UAT_API_BASE_URL} \
            test/uat_compiled_environment_test.dart

      - name: Verify live UAT health and discovery read load
        shell: bash
        run: |
          set -euo pipefail
          health_url="${UAT_API_BASE_URL%/api}/api/health"
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 90 "$health_url")"
          printf '%s' "$response" > /tmp/uat-health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/uat-health.json',encoding='utf-8'))
          assert data.get('status') == 'ok', data
          assert data.get('database') is True, data
          assert data.get('postgis') is True, data
          print('Render UAT health OK')
          PY

          endpoint="${UAT_API_BASE_URL}/properties/nearby?latitude=15.3694&longitude=44.1910&radius_km=30"
          rm -rf /tmp/uat-load && mkdir -p /tmp/uat-load
          export endpoint
          seq 1 40 | xargs -P 20 -I{} bash -c '
            i="$1"
            curl --fail --silent --show-error --max-time 30 \
              -o "/tmp/uat-load/body-${i}.json" \
              -w "%{http_code} %{time_total}\n" \
              "$endpoint" > "/tmp/uat-load/result-${i}.txt"
          ' _ {}
          python3 - <<'PY'
          import glob,json
          from pathlib import Path
          results=[]
          for p in glob.glob('/tmp/uat-load/result-*.txt'):
              code,t=Path(p).read_text().strip().split()
              results.append((int(code),float(t)))
          assert len(results)==40, len(results)
          assert all(c==200 for c,_ in results), results
          for p in glob.glob('/tmp/uat-load/body-*.json'):
              assert isinstance(json.loads(Path(p).read_text()).get('data'),list)
          times=sorted(t for _,t in results)
          print(f'40/40 nearby reads OK; p50={times[len(times)//2]:.3f}s; p95={times[max(0,int(len(times)*.95)-1)]:.3f}s')
          PY

      - name: Reuse the validated optional UAT Firebase importer
        env:
          AQER_UAT_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.AQER_UAT_GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 -B scripts/import_ci_uat_firebase.py

      - name: Build release UAT APK
        working-directory: mobile_app
        run: >-
          flutter build apk --flavor uat --release
          --build-number=${UAT_BUILD_NUMBER}
          --dart-define=APP_ENVIRONMENT=uat
          --dart-define=API_BASE_URL=${UAT_API_BASE_URL}
          --dart-define=APP_BUILD_NUMBER=${UAT_BUILD_NUMBER}
          --dart-define=APP_SHARE_BASE_URL=${APP_SHARE_BASE_URL}

      - name: Verify current identity and prepare evidence without a plaintext installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="mobile_app/build/app/outputs/flutter-apk/app-uat-release.apk"
          test -f "$src"
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,zipfile
          from pathlib import Path
          apk=Path('mobile_app/build/app/outputs/flutter-apk/app-uat-release.apk')
          sdk=Path(os.environ.get('ANDROID_SDK_ROOT') or os.environ['ANDROID_HOME'])
          versions=sorted((p for p in (sdk/'build-tools').iterdir() if (p/'aapt').is_file() and (p/'apksigner').is_file()),key=lambda p:tuple(int(n) for n in re.findall(r'\d+',p.name)))
          assert versions,'Android verification tools unavailable'
          tools=versions[-1]
          badging=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
          identity=re.search(r"package: name='([^']+)' versionCode='([0-9]+)'",badging)
          assert identity and identity.group(1)=='com.aqer.yemen.uat'
          assert int(identity.group(2))==int(os.environ['UAT_BUILD_NUMBER'])
          signature=subprocess.check_output([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(apk)],text=True)
          certificate=re.search(r'certificate SHA-256 digest: ([0-9a-fA-F]{64})',signature)
          assert certificate,'No verified signing certificate'
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
          report={'source_commit':os.environ['GITHUB_SHA'],'accepted_application_source':os.environ['ACCEPTED_SOURCE_SHA'],'package':identity.group(1),'version_code':int(identity.group(2)),'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'certificate_sha256':certificate.group(1).lower(),'apksigner':'passed','zip_crc':'passed','purpose':'CI verification only; canonical owner APK delivery is the recipient-encrypted broker workflow','plaintext_apk_uploaded':False}
          Path('dist/DISCOVERY_APK_VERIFICATION.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: discovery-uat-verification-${{ github.run_number }}
          path: dist/DISCOVERY_APK_VERIFICATION.json
          if-no-files-found: error
          retention-days: 14
