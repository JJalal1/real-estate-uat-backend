name: Apply advertiser listing fixes

on:
  push:
    branches:
      - fix/advertiser-listing-journey-uat

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advertiser-listing-journey-uat
          fetch-depth: 0
      - name: Prepare focused patch without workflow mutation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tools/apply_advertiser_listing_fixes.py').read_text()
          source = source.split('# Update accepted mobile baseline hashes', 1)[0]
          Path('/tmp/apply_advertiser_listing_fixes.py').write_text(source)
          PY
      - name: Apply focused fixes
        run: python3 /tmp/apply_advertiser_listing_fixes.py
      - name: Remove temporary patch helper
        run: rm -f tools/apply_advertiser_listing_fixes.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix advertiser listing journey and decision tools"
          git push origin HEAD:fix/advertiser-listing-journey-uat
