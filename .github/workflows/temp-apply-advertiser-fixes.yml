name: Apply advertiser listing fixes

on:
  push:
    branches:
      - fix/advertiser-listing-journey-uat

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advertiser-listing-journey-uat
          fetch-depth: 0
      - name: Apply focused fixes
        run: python3 tools/apply_advertiser_listing_fixes.py
      - name: Remove temporary patch helpers
        run: rm -f tools/apply_advertiser_listing_fixes.py .github/workflows/temp-apply-advertiser-fixes.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix advertiser listing journey and decision tools"
          git push origin HEAD:fix/advertiser-listing-journey-uat
