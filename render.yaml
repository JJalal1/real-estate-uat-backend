services:
  - type: web
    name: real-estate-uat-api-frankfurt
    runtime: docker
    plan: free
    region: frankfurt
    branch: work/wave2-review-current
    rootDir: backend-api-runtime
    dockerfilePath: ./Dockerfile.uat
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: APP_NAME
        value: Real Estate UAT
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      # Render assigns the public HTTPS URL; mirror it into Laravel APP_URL.
      - key: APP_URL
        fromService:
          name: real-estate-uat-api-frankfurt
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # Supabase PostgreSQL session-pooler connection string. Keep secret in Render.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_PERSISTENT
        value: "false"
      - key: DB_SEARCH_PATH
        value: public,gis,extensions

      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local

      # Supabase Storage is accessed by Laravel only through the Storage REST API.
      - key: UAT_CLOUD_STORAGE_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_SERVER_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: real-estate-uat
      - key: UAT_PUBLIC_STORAGE_PREFIX
        value: public
      - key: UAT_PRIVATE_STORAGE_PREFIX
        value: private
      - key: UAT_STORAGE_CONNECT_TIMEOUT
        value: "15"
      - key: UAT_STORAGE_TIMEOUT
        value: "90"

      # Test OTP is staging-only and allowlisted. Never expose these in Flutter.
      - key: UAT_TEST_OTP_ENABLED
        value: "true"
      - key: UAT_TEST_OTP_CODE
        sync: false
      - key: UAT_TEST_PHONE_NUMBERS
        sync: false

      # Prevent any historical/demo seed from running as a deploy side effect.
      - key: UAT_DEMO_SEED_ENABLED
        value: "false"
      - key: UAT_CITY_DEMO_SEED_ENABLED
        value: "false"
      - key: UAT_WAVE3_FIXTURES_ENABLED
        value: "false"

      # Controlled on the existing service through Render. A Blueprint sync must
      # preserve the live rollout decision instead of silently resetting it.
      - key: LISTING_WATERMARK_ENABLED
        sync: false
      - key: LISTING_WATERMARK_APPROVED_SHA256
        value: bf7611483e0689ad9ccd73458442745ff9fc4c91a07d60cf2c3521be90698b6e

      # A real full backup and independent restore are required before new DDL.
      - key: UAT_RUN_MIGRATIONS
        value: "false"
