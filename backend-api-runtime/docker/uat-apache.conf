<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # No query strings, referrers, tokens or client IPs. Apache duration also
    # covers work outside the Laravel timer; proxy wake-up is outside both.
    LogFormat "aqer_access method=%m path=%U status=%>s bytes=%B duration_us=%D request_id=%{X-Request-ID}o" aqer_timed
    CustomLog ${APACHE_LOG_DIR}/access.log aqer_timed
</VirtualHost>
