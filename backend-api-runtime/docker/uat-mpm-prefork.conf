<IfModule mpm_prefork_module>
    # Supabase UAT currently uses the session-mode pooler, which caps the
    # database user at 15 concurrent sessions. Keep Apache below that limit
    # while leaving three sessions of headroom for Render health checks, CLI
    # migrations, and maintenance. Twelve workers is the highest UAT ceiling
    # we allow without risking the historical EMAXCONNSESSION failure.
    StartServers 3
    MinSpareServers 3
    MaxSpareServers 6
    MaxRequestWorkers 12
    MaxConnectionsPerChild 250
</IfModule>
