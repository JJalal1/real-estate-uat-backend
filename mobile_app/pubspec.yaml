name: real_estate_mobile
description: Map-first real estate application starter.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  go_router: ^15.1.2
  url_launcher: ^6.3.1
  maplibre_gl: 0.22.0
  geolocator: ^13.0.4
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.0

  cupertino_icons: ^1.0.8
  flutter_svg: 2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  drift_dev: ^2.26.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/payments/
    - assets/ebroker/svg/
    - assets/ebroker/svg/agent/
    - assets/ebroker/svg/MultiColorSvg/
    - assets/ebroker/svg/Fallback/
    - assets/ebroker/chat_background/
    - assets/ebroker/images/
    - assets/fonts/OFL-Manrope.txt
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

    - family: PrimaryFont
      fonts:
        - asset: assets/ebroker/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/ebroker/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/ebroker/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/ebroker/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/ebroker/fonts/Manrope-ExtraBold.ttf
          weight: 800
