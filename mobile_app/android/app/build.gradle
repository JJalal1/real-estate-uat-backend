plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.real_estate_mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.1.13356709"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Replace before any production/mobile-store release.
        applicationId = "com.example.real_estate_mobile"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    def uatSigningRequired = System.getenv("UAT_ANDROID_SIGNING_REQUIRED") == "true"
    def uatKeystorePath = System.getenv("UAT_ANDROID_KEYSTORE_PATH")
    def uatKeystorePassword = System.getenv("UAT_ANDROID_KEYSTORE_PASSWORD")
    def uatKeyAlias = System.getenv("UAT_ANDROID_KEY_ALIAS")
    def uatKeyPassword = System.getenv("UAT_ANDROID_KEY_PASSWORD")
    def hasUatSigningConfig = [
        uatKeystorePath,
        uatKeystorePassword,
        uatKeyAlias,
        uatKeyPassword,
    ].every { value -> value != null && !value.trim().isEmpty() }

    if (uatSigningRequired && !hasUatSigningConfig) {
        throw new GradleException(
            "UAT Android signing is required but one or more UAT_ANDROID_* signing values are missing."
        )
    }

    signingConfigs {
        if (hasUatSigningConfig) {
            uat {
                storeFile = file(uatKeystorePath)
                storePassword = uatKeystorePassword
                keyAlias = uatKeyAlias
                keyPassword = uatKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // CI must provide the dedicated UAT signing identity. Local release builds may
            // continue to use the debug identity unless UAT_ANDROID_SIGNING_REQUIRED=true.
            signingConfig = hasUatSigningConfig ? signingConfigs.uat : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
