plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def aqerStoreFile = System.getenv("AQER_RELEASE_STORE_FILE")
def aqerStorePassword = System.getenv("AQER_RELEASE_STORE_PASSWORD")
def aqerKeyAlias = System.getenv("AQER_RELEASE_KEY_ALIAS")
def aqerKeyPassword = System.getenv("AQER_RELEASE_KEY_PASSWORD")
def aqerAllowDebugRelease = (System.getenv("AQER_ALLOW_DEBUG_RELEASE_SIGNING") ?: "false").toBoolean()
def aqerHasReleaseSigning = [aqerStoreFile, aqerStorePassword, aqerKeyAlias, aqerKeyPassword].every { it != null && !it.trim().isEmpty() }
def aqerBuildingRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
def aqerPushEnabled = (project.findProperty("AQER_PUSH_ENABLED") ?: System.getenv("AQER_PUSH_ENABLED") ?: "false").toBoolean()
def aqerFirebaseApiKey = project.findProperty("AQER_FIREBASE_API_KEY") ?: System.getenv("AQER_FIREBASE_API_KEY") ?: ""
def aqerFirebaseAppId = project.findProperty("AQER_FIREBASE_APP_ID") ?: System.getenv("AQER_FIREBASE_APP_ID") ?: ""
def aqerFirebaseProjectId = project.findProperty("AQER_FIREBASE_PROJECT_ID") ?: System.getenv("AQER_FIREBASE_PROJECT_ID") ?: ""
def aqerFirebaseSenderId = project.findProperty("AQER_FIREBASE_SENDER_ID") ?: System.getenv("AQER_FIREBASE_SENDER_ID") ?: ""
def aqerBuildConfigString = { value -> "\"" + value.toString().replace("\\", "\\\\").replace("\"", "\\\"") + "\"" }
def aqerUatFirebase = new Properties()
def aqerUatFirebaseFile = rootProject.file('firebase-uat.properties')
if (aqerUatFirebaseFile.isFile()) {
    aqerUatFirebaseFile.withInputStream { aqerUatFirebase.load(it) }
}
def aqerProductionApplicationId = project.findProperty('AQER_PRODUCTION_APPLICATION_ID') ?: System.getenv('AQER_PRODUCTION_APPLICATION_ID') ?: ''
def aqerBuildingProduction = gradle.startParameter.taskNames.any { it.toLowerCase().contains('production') }
if (aqerBuildingProduction && (!aqerProductionApplicationId || !aqerHasReleaseSigning)) {
    throw new GradleException('Production requires its approved application ID and release signing. UAT credentials cannot replace them.')
}
if (aqerBuildingProduction) {
    def aqerDartDefines = [:]
    (project.findProperty('dart-defines') ?: '').split(',').findAll { it }.each { encoded ->
        def entry = new String(encoded.decodeBase64(), 'UTF-8').split('=', 2)
        if (entry.length == 2) aqerDartDefines[entry[0]] = entry[1]
    }
    def aqerApi = new URI(aqerDartDefines['API_BASE_URL'] ?: '')
    if (aqerDartDefines['APP_ENVIRONMENT'] != 'production' ||
        aqerDartDefines['APP_PACKAGE_ID'] != aqerProductionApplicationId ||
        aqerProductionApplicationId in ['com.example.real_estate_mobile', 'com.aqer.yemen.uat'] ||
        aqerApi.scheme != 'https' || !aqerApi.host || aqerApi.userInfo ||
        aqerApi.host == 'real-estate-uat-api-frankfurt.onrender.com') {
        throw new GradleException('Production requires matching compiled identity and a separate HTTPS API; UAT fallbacks are forbidden.')
    }
}
def aqerUatClientEnabled = aqerUatFirebase.getProperty('aqer.uat.firebase.enabled', 'false').toBoolean()
if (aqerUatClientEnabled && (aqerUatFirebase.getProperty('aqer.uat.firebase.projectId') != 'aqer-yemen' ||
    aqerUatFirebase.getProperty('aqer.uat.firebase.senderId') != '982331876719' ||
    !aqerUatFirebase.getProperty('aqer.uat.firebase.apiKey') || !aqerUatFirebase.getProperty('aqer.uat.firebase.appId'))) {
    throw new GradleException('UAT Firebase client configuration is incomplete; run the validated configuration importer.')
}

android {
    namespace = "com.example.real_estate_mobile"
    // Google Play new-app submissions require API 36 as of 2026-08-31.
    compileSdk = 36
    ndkVersion = "28.1.13356709"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = project.findProperty("AQER_APPLICATION_ID") ?: "com.example.real_estate_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = Math.max(flutter.minSdkVersion, 23)
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders["aqerAppLinkHost"] = project.findProperty("AQER_APP_LINK_HOST") ?: "real-estate-uat-api-frankfurt.onrender.com"
        manifestPlaceholders["aqerAppLinkAutoVerify"] = project.findProperty("AQER_APP_LINK_AUTO_VERIFY") ?: "false"
        buildConfigField "boolean", "AQER_PUSH_ENABLED", aqerPushEnabled.toString()
        buildConfigField "String", "AQER_FIREBASE_API_KEY", aqerBuildConfigString(aqerFirebaseApiKey)
        buildConfigField "String", "AQER_FIREBASE_APP_ID", aqerBuildConfigString(aqerFirebaseAppId)
        buildConfigField "String", "AQER_FIREBASE_PROJECT_ID", aqerBuildConfigString(aqerFirebaseProjectId)
        buildConfigField "String", "AQER_FIREBASE_SENDER_ID", aqerBuildConfigString(aqerFirebaseSenderId)
    }

    signingConfigs {
        if (aqerHasReleaseSigning) {
            release {
                storeFile file(aqerStoreFile)
                storePassword aqerStorePassword
                keyAlias aqerKeyAlias
                keyPassword aqerKeyPassword
            }
        }
    }

    flavorDimensions 'environment'
    productFlavors {
        uat {
            dimension 'environment'
            applicationId 'com.aqer.yemen.uat'
            resValue 'string', 'aqer_app_name', 'عقار UAT'
            buildConfigField 'boolean', 'AQER_PUSH_ENABLED', aqerUatClientEnabled.toString()
            buildConfigField 'String', 'AQER_FIREBASE_API_KEY', aqerBuildConfigString(aqerUatFirebase.getProperty('aqer.uat.firebase.apiKey', ''))
            buildConfigField 'String', 'AQER_FIREBASE_APP_ID', aqerBuildConfigString(aqerUatFirebase.getProperty('aqer.uat.firebase.appId', ''))
            buildConfigField 'String', 'AQER_FIREBASE_PROJECT_ID', aqerBuildConfigString('aqer-yemen')
            buildConfigField 'String', 'AQER_FIREBASE_SENDER_ID', aqerBuildConfigString('982331876719')
        }
        production {
            dimension 'environment'
            if (aqerProductionApplicationId) applicationId aqerProductionApplicationId
            resValue 'string', 'aqer_app_name', 'عقار'
        }
    }

    buildTypes {
        release {
            if (aqerHasReleaseSigning) {
                signingConfig = signingConfigs.release
            } else if (aqerAllowDebugRelease) {
                signingConfig = signingConfigs.debug
            } else if (aqerBuildingRelease) {
                throw new GradleException(
                    "Production release signing is not configured. " +
                    "Set AQER_RELEASE_STORE_FILE/AQER_RELEASE_STORE_PASSWORD/" +
                    "AQER_RELEASE_KEY_ALIAS/AQER_RELEASE_KEY_PASSWORD. " +
                    "UAT may explicitly set AQER_ALLOW_DEBUG_RELEASE_SIGNING=true."
                )
            }
        }
    }
}

flutter {
    source = "../.."
}


dependencies {
    // Pinned to the last Cloud Messaging line that officially supports API 23.
    implementation "com.google.firebase:firebase-messaging:25.0.1"
}
